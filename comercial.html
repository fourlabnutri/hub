  .f-prod .d{ display:block; font-size:13px; color:#222; margin-top:4px; line-height:1.35; }
  .f-qt{ flex:none; margin-left:auto; text-align:center; min-width:66px; padding-left:8px; }
  .f-qt b{ display:block; font-family:var(--font-title); font-size:30px; line-height:1; font-weight:800; color:#b84c00; } .f-qt span{ font-size:13px; font-weight:700; }
  .f-ops{ display:grid; gap:12px; }
  .f-op{ display:flex; flex-wrap:wrap; gap:16px; align-items:center; background:#fff; border:1px solid var(--ln); border-radius:14px; padding:15px; }

  .f-op ul{ margin:0; padding:0 0 0 18px; font-size:14.5px; line-height:1.45; }
  .f-tag{ display:inline-block; font-size:13px; font-weight:800; padding:3px 10px; border-radius:999px; background:#fdcc03; color:#000; margin-left:8px; vertical-align:middle; }
  .f-kv{ display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; }
  .f-kv div{ background:#fff; border:1px solid var(--ln); border-radius:14px; padding:15px; } .f-kv b{ display:block; font-size:21px; font-weight:800; } .f-kv span{ font-size:13px; color:#222; }
  .f-hist{ border-left:4px solid var(--orange); padding:2px 0 2px 14px; margin-bottom:14px; font-size:14.5px; line-height:1.55; white-space:pre-line; }
  .f-hist.auto{ border-color:#cfc6bb; } .f-hist summary{ cursor:pointer; font-weight:800; color:#b84c00; } .f-hist small{ color:#222; font-size:13px; }
  .f-vazio{ color:#222; font-size:14px; }

  @media (max-width:620px){ .f-stats,.f-two,.f-blocos{ grid-template-columns:1fr; } .f-top h3{ font-size:21px; } .f-prods{ grid-template-columns:1fr; } }
  .pn{ display:grid; grid-template-columns:1fr 1.25fr; gap:18px; margin-bottom:18px; }
  @media (max-width:1000px){ .pn{ grid-template-columns:1fr; } }
  .pn .panel{ margin:0; } .pn h2,.lista-h h2{ font-family:var(--font-title); font-size:18px; font-weight:800; color:#000; margin:0 0 3px; }
  .pn .dsc{ font-size:13.5px; color:#333; margin-bottom:14px; }
  .mb{ display:block; width:100%; background:none; border:0; padding:7px 0; font:inherit; text-align:left; cursor:pointer; }
  .mb .tp{ display:flex; justify-content:space-between; font-size:14.5px; font-weight:700; color:#111; margin-bottom:5px; } .mb .tr{ height:10px; border-radius:99px; background:#f1ebe4; overflow:hidden; } .mb .fl{ height:100%; border-radius:99px; transition:width .5s; }
  .mb:hover .tp{ color:#b84c00; } .mb.on .tp{ color:#b84c00; }
  .sau{ display:flex; height:12px; border-radius:99px; overflow:hidden; margin:16px 0 8px; } .sau i{ display:block; }
  .leg{ display:flex; flex-wrap:wrap; gap:6px 16px; font-size:13.5px; color:#111; } .leg i{ display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:5px; }
  .gd{ display:flex; gap:12px; align-items:center; padding:9px 0; border-top:1px solid #f1ebe4; } .gd:first-of-type{ border-top:0; }
  .gd .f-img{ width:52px; height:52px; } .gd .nm{ flex:1; min-width:0; font-size:14.5px; font-weight:800; color:#000; line-height:1.25; } .gd .nm span{ display:block; font-size:13px; font-weight:500; color:#333; margin-top:2px; }
  .gd .pt{ text-align:right; font-size:15px; font-weight:800; white-space:nowrap; } .gd .pt span{ display:block; font-size:12.5px; font-weight:500; color:#333; }
  .lista-h{ display:flex; flex-wrap:wrap; gap:10px; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .lista-h input[type=search]{ width:300px; max-width:100%; background:#fff; font-size:14.5px; }
  .lin{ display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1.6fr) 110px auto; gap:14px; align-items:center; padding:13px 14px; border-top:1px solid #f1ebe4; cursor:pointer; border-radius:12px; transition:background .15s; }
  .lin:hover{ background:#fbf7f2; } .lin.sel{ background:var(--orange-soft); }
  .lin .nm{ font-size:15px; font-weight:800; color:#000; line-height:1.25; } .lin .nm span{ display:block; font-size:13px; font-weight:500; color:#333; margin-top:2px; }

  .lin .vl{ font-size:14.5px; font-weight:800; text-align:right; } .lin .vl span{ display:block; font-size:12.5px; font-weight:500; color:#333; }
  .lig{ display:inline-block; padding:8px 14px; border-radius:999px; background:#111; color:#fff; font-size:13.5px; font-weight:800; text-decoration:none; white-space:nowrap; } .lig:hover{ background:var(--orange); } .lig.off{ background:#f1ebe4; color:#333; }

  @media print{ .sidebar,.filters,.no-print{ display:none !important; } .shell{ display:block; } }

/* ===== BI v2 (mesmo estilo do Contas a receber) ===== */
  /* ===== Contas a receber · v2 (vidro) ===== */
  body{ background:#efe9e3; }
  body::before{ content:""; position:fixed; inset:-20%; z-index:-1; pointer-events:none;
    background:radial-gradient(38% 34% at 78% 8%, rgba(233,103,9,.22), transparent 70%),
               radial-gradient(30% 30% at 12% 70%, rgba(115,27,88,.16), transparent 70%),
               radial-gradient(26% 26% at 60% 92%, rgba(253,204,3,.18), transparent 70%); filter:blur(10px); }
  main{ padding-top:28px !important; }
  
  .glass{ background:rgba(255,255,255,.58); -webkit-backdrop-filter:blur(22px) saturate(170%); backdrop-filter:blur(22px) saturate(170%);
    border:1px solid rgba(255,255,255,.75); border-radius:26px; box-shadow:0 1px 0 rgba(255,255,255,.9) inset, 0 10px 40px rgba(60,30,20,.07); }
  .r-head{ display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; margin-bottom:18px; }
  .r-head h1{ font-size:34px; letter-spacing:-.8px; }
  .r-head .sub{ font-size:12.5px; color:var(--muted); margin-top:4px; }
  .num{ text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .muted{ color:var(--muted); } .red{ color:var(--red); font-weight:700; }
  .sub2{ font-size:11px; color:var(--muted); }
  a.lnk{ color:var(--orange); font-weight:700; text-decoration:none; } a.lnk:hover{ text-decoration:underline; }

  /* barra de filtros */
  .toolbar{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:8px; margin-bottom:12px; border-radius:999px; }
  .segm{ display:inline-flex; background:rgba(26,19,21,.06); border-radius:999px; padding:3px; }
  .segm button{ border:0; background:none; padding:7px 14px; border-radius:999px; font-size:12px; font-weight:700; color:var(--ink-2); cursor:pointer; }
  .segm button.on{ background:var(--ink); color:#fff; box-shadow:0 4px 12px rgba(26,19,21,.2); }
  .sel{ position:relative; }
  .sel select{ appearance:none; -webkit-appearance:none; border:0; background:rgba(26,19,21,.06); border-radius:999px; padding:9px 34px 9px 14px; font-size:12px; font-weight:700; color:var(--ink); cursor:pointer; width:auto; }
  .sel::after{ content:""; position:absolute; right:14px; top:50%; width:6px; height:6px; border-right:2px solid var(--ink-2); border-bottom:2px solid var(--ink-2); transform:translateY(-70%) rotate(45deg); pointer-events:none; }
  .dates{ display:flex; gap:6px; align-items:center; font-size:12px; }
  .dates input{ width:auto; border:0; background:rgba(26,19,21,.06); border-radius:999px; padding:7px 12px; font-size:12px; }
  .busca{ flex:1; min-width:200px; position:relative; }
  .busca input{ width:100%; border:0; background:rgba(255,255,255,.8); border-radius:999px; padding:9px 14px 9px 36px; font-size:12.5px; }
  .busca svg{ position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--muted); }
  .sw{ display:inline-flex; align-items:center; gap:8px; font-size:11.5px; font-weight:700; color:var(--ink-2); cursor:pointer; margin:0 8px 0 0; white-space:nowrap; }
  .sw input{ display:none; }
  .sw i{ width:30px; height:18px; border-radius:99px; background:rgba(26,19,21,.15); position:relative; transition:.2s; }
  .sw i::after{ content:""; position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%; background:#fff; transition:.2s; box-shadow:0 1px 3px rgba(0,0,0,.2); }
  .sw input:checked + i{ background:var(--orange); } .sw input:checked + i::after{ left:14px; }

  /* pastas por tipo de comércio */
  .pastas{ display:flex; gap:8px; overflow-x:auto; padding:2px 2px 6px; margin-bottom:20px; scrollbar-width:none; }
  .pasta{ flex:0 0 auto; display:flex; align-items:center; gap:10px; border:1px solid rgba(255,255,255,.75); background:rgba(255,255,255,.45); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    border-radius:16px; padding:9px 14px 9px 10px; cursor:pointer; text-align:left; transition:.15s; }
  .pasta:hover{ background:rgba(255,255,255,.8); }
  .pasta .ico{ width:30px; height:30px; border-radius:10px; display:grid; place-items:center; font-size:15px; background:rgba(26,19,21,.06); }
  .pasta b{ display:block; font-size:12.5px; } .pasta small{ font-size:11px; color:var(--muted); }
  .pasta.on{ background:var(--ink); color:#fff; border-color:var(--ink); } .pasta.on small{ color:rgba(255,255,255,.65); } .pasta.on .ico{ background:rgba(255,255,255,.14); }

  /* topo: KPIs */
  .hero{ display:grid; grid-template-columns:1.35fr 1fr 1fr; gap:16px; margin-bottom:16px; }
  .k{ padding:22px 24px; display:flex; flex-direction:column; gap:6px; min-width:0; }
  .k .lbl{ font-size:12px; font-weight:600; color:var(--muted); display:flex; align-items:center; gap:8px; }
  .k .val{ font-family:var(--font-title); font-size:34px; font-weight:600; letter-spacing:-1px; line-height:1.05; font-variant-numeric:tabular-nums; }
  .k .val small{ font-size:.5em; font-weight:500; opacity:.55; margin-right:4px; letter-spacing:0; }
  .k .foot{ font-size:11.5px; color:var(--muted); }
  .k.dark{ background:linear-gradient(150deg,#241a1d 0%,#140e10 100%); color:#fff; border:0; }
  .k.dark .lbl, .k.dark .foot{ color:rgba(255,255,255,.6); }
  .k.hot{ background:linear-gradient(140deg,#e96709 0%,#f28a0c 60%,#f7a21b 100%); color:#fff; border:0; box-shadow:0 14px 40px rgba(233,103,9,.28); }
  .k.hot .lbl,.k.hot .foot{ color:rgba(255,255,255,.82); }
  .badge{ display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:800; padding:3px 9px; border-radius:999px; background:rgba(255,255,255,.18); }
  .badge.r{ background:var(--red-soft); color:var(--red); } .badge.g{ background:var(--green-soft); color:var(--green); }
  .stack{ display:flex; height:12px; border-radius:99px; overflow:hidden; gap:3px; margin-top:12px; }
  .stack span{ display:block; height:100%; border-radius:99px; min-width:4px; }
  .legend{ display:flex; gap:14px; flex-wrap:wrap; font-size:11.5px; margin-top:8px; }
  .legend i{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
  .k.dark .legend{ color:rgba(255,255,255,.75); }

  /* gráficos */
  .duo{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px; }
  .box{ padding:22px 24px; }
  .box h2{ font-size:15px; font-weight:700; } .box .desc{ font-size:12px; color:var(--muted); margin-top:2px; }
  .faixas{ display:grid; gap:14px; margin-top:18px; }
  .fx{ display:grid; grid-template-columns:110px 1fr auto; gap:14px; align-items:center; }
  .fx .n{ font-size:12px; font-weight:700; } .fx .n small{ display:block; font-weight:500; color:var(--muted); font-size:11px; }
  .fx .t{ height:30px; border-radius:10px; background:rgba(26,19,21,.05); overflow:hidden; }
  .fx .t div{ height:100%; border-radius:10px; }
  .fx .v{ font-family:var(--font-title); font-weight:600; font-size:16px; text-align:right; font-variant-numeric:tabular-nums; min-width:120px; }
  .fx .v small{ display:block; font-family:var(--font-body); font-size:11px; color:var(--muted); font-weight:500; }
  .cols{ display:flex; align-items:flex-end; gap:12px; height:190px; margin-top:18px; padding-top:28px; }
  .col{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:8px; min-width:0; }
  .col .bar{ width:100%; max-width:64px; border-radius:14px 14px 8px 8px; background:repeating-linear-gradient(135deg, rgba(233,103,9,.22) 0 6px, rgba(233,103,9,.1) 6px 12px); position:relative; }
  .col.top .bar{ background:var(--grad-accent); box-shadow:0 8px 20px rgba(233,103,9,.25); }
  .col .bar em{ position:absolute; top:-22px; left:50%; transform:translateX(-50%); font-style:normal; font-size:11px; font-weight:800; white-space:nowrap; }
  .col .m{ font-size:11px; color:var(--muted); font-weight:600; }

  /* clientes: abas + lista */
  .clientes{ padding:20px 22px; margin-bottom:16px; }
  .c-head{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:6px; }
  .tabs2{ display:flex; gap:4px; background:rgba(26,19,21,.06); border-radius:999px; padding:4px; overflow-x:auto; }
  .tabs2 button{ border:0; background:none; border-radius:999px; padding:8px 14px; font-size:12.5px; font-weight:700; color:var(--ink-2); cursor:pointer; white-space:nowrap; display:inline-flex; gap:6px; align-items:center; }

<script type="text/plain" id="app">
const HOJE = DATA.gerado;
const BRL = v => 'R$ ' + (Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const dBR = iso => iso ? iso.slice(0,10).split('-').reverse().join('/') : '—';
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const diasDesde = iso => Math.round((Date.parse(HOJE)-Date.parse(iso.slice(0,10)))/864e5);
const JANELA = 7;   // quem teve contato nesse prazo sai da fila do dia

// ordem da fila; 1 (lead novo) entra quando houver fonte de leads no Nekt
const MOTIVOS = {2:'Boleto vencido', 3:'Recompra atrasada', 4:'Recompra chegando', 5:'Reativar'};
function motivo(c){
  const d = c.dias_atraso_recompra;
  if(c.vencido>0) return 2;
  if(d==null) return null;
  if(d>=0 && d<=90) return 3;
  if(d>=-7 && d<0) return 4;
  if(d>90) return 5;
  return null;
}

// relatórios automáticos do SDR também são tarefas no Agendor, mas não são contato com o cliente
const ehAuto = h => /^(RELATÓRIO|BRIEFING) SDR/i.test(h.texto||'');
const HIST = {};
DATA.historico.forEach(h=>{ (HIST[h.cnpj]=HIST[h.cnpj]||[]).push(h); });
Object.values(HIST).forEach(a=>a.sort((x,y)=>x.criado<y.criado?1:-1));
const CLI = DATA.clientes.map(c=>{ const hs=HIST[c.cnpj]||[], ult=hs.find(h=>!ehAuto(h));
  return {...c, m:motivo(c), hs, ult, diasContato:ult?diasDesde(ult.criado):null}; });

const S = {mot:'todos', q:'', aberto:null, bloco:null, pag:12, aba:'fat', st:'todos'};
function fila(){
  const q=S.q.trim().toLowerCase(), dq=q.replace(/\D/g,'');
  return CLI.filter(c=>{
    if(q) return (c.nome||'').toLowerCase().includes(q) || (c.cidade_uf||'').toLowerCase().includes(q) || (dq && c.cnpj.includes(dq));
    if(!c.m) return false;
    if(S.mot!=='todos' && c.m!==S.mot) return false;
    return S.recentes || c.diasContato==null || c.diasContato>JANELA;
  }).sort((a,b)=>(a.m||9)-(b.m||9) || (b.faturamento||0)-(a.faturamento||0));
}
const digitos = s => String(s||'').replace(/\D/g,'').replace(/^55(?=\d{10,11}$)/,'');
const motHtml = c => c.m ? `<span class="mot m${c.m}">${MOTIVOS[c.m]}</span>` : '<span class="muted">—</span>';
function recompra(c){
  const d=c.dias_atraso_recompra;
  if(d==null) return '—';
  return `${dBR(c.proxima_compra_prevista)}<div class="sub2">${d>0?`${d} dias de atraso`:d===0?'hoje':`em ${-d} dias`}</div>`;
}
// ---------- fotos: catálogo da Shopify, família -> anúncio exato (nunca o combo) ----------

      <div class="foot">${CLI.filter(c=>c.pedidos>=2).length} de ${compr.length} compraram 2+ vezes${vencB2B?` · vencido ${BRL(vencB2B)}`:''}</div>
    </div>
  </div>

  <div class="tri">
    <div class="box glass"><h2>Recência da carteira</h2><div class="desc">Lojistas por tempo desde a última compra</div>
      <div class="faixas">${rec.map((r,i)=>`<div class="fx"><div class="n">${r.l}<small>${r.n} lojistas</small></div><div class="t"><div style="width:${r.v/maxR*100}%;background:${['var(--green)','#7cc49a','var(--yellow)','var(--orange)','var(--pink)'][i]}"></div></div><div class="v" style="font-size:13px;min-width:96px">${BRLc(r.v)}<small>faturamento</small></div></div>`).join('')}</div></div>
    <div class="box glass"><h2>Faturamento por estado</h2><div class="desc">Top ${ufs.length} UFs</div>
      <div class="rank">${ufs.map((x,i)=>`<div class="rk"><span class="pos">${i+1}º</span><div class="nmr"><b>${esc(x.u)}</b><div class="tr2"><i style="width:${x.v/maxU*100}%"></i></div></div><div class="vr">${BRLc(x.v)}<small>${x.n} lojistas</small></div></div>`).join('')||'<div class="empty">Sem dados.</div>'}</div></div>
    <div class="box glass"><h2>Produtos de ouro</h2><div class="desc">Melhor oportunidade somada na carteira</div>
      <div class="rank">${GERAL.ouro.map((o,i)=>`<div class="rk"><span class="pos">${i+1}º</span><div class="nmr"><b title="${esc(o.n)}">${esc(o.n)}</b><small class="sub2">${o.lojas} ${o.lojas===1?'lojista':'lojistas'}</small></div><div class="vr">${o.total?BRLc(o.total):'—'}<small>potencial</small></div></div>`).join('')||'<div class="empty">Sem dados de oportunidade.</div>'}</div></div>
  </div>

  <div class="clientes glass">
    <div class="c-head">
      <div class="tabs2">${ABAS.map(([id,t])=>`<button class="${S.aba===id?'on':''}" onclick="S.aba='${id}';S.pag=12;S.aberto=null;render()">${t} <span class="cnt">${cont[id]}</span></button>`).join('')}</div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <div class="segm">${[['todos','Todos'],['ativo','Ativos'],['pre_ativo','Pré'],['inativo','Inativos']].map(([id,t])=>`<button class="${S.st===id?'on':''}" onclick="S.st='${id}';S.pag=12;render()">${t}</button>`).join('')}</div>
        <div class="busca" style="min-width:220px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Loja, cidade ou CNPJ" value="${esc(S.q)}" oninput="S.q=this.value;S.pag=12;clearTimeout(window._t);window._t=setTimeout(render,250)"></div>
        <button class="btn-glass no-print" onclick="csvB2B()">Baixar CSV</button>
      </div>
    </div>
    <div class="lista" style="margin-top:12px"><div class="li lj cab"><span>Lojista</span><span class="num">Faturamento</span><span class="num">Ticket</span><span class="num">Última compra</span><span class="num">Recompra</span><span>Crédito</span></div>
      ${l.slice(0,S.pag).map(linha).join('')||'<div class="empty">Nenhum lojista neste filtro.</div>'}</div>
    ${l.length>S.pag?`<div class="rodape"><span class="note">Mostrando ${S.pag} de ${l.length}</span><button class="btn-glass no-print" onclick="S.pag+=24;render()">Ver mais ${Math.min(24,l.length-S.pag)}</button></div>`:''}
  </div>
  <div class="note">Atividade comercial registrada no Agendor: ${em(7)} contatos em 7 dias · ${em(30)} em 30 dias. Leads novos e carrinhos do B2B entram quando essas fontes chegarem ao Nekt.</div>`;
  if(foco){ const e=document.getElementById('q'); e.focus(); e.setSelectionRange(e.value.length,e.value.length); }
}
function csvB2B(){
  const cab=['Lojista','CNPJ','Cidade/UF','Status','Faturamento','Pedidos','Ticket médio','Última compra','Dias sem comprar','Recompra prevista','Atraso recompra (dias)','Vencido','A vencer','Crédito'];
  const n=v=>(Number(v)||0).toFixed(2).replace('.',',');
  const rows=lojistas().map(c=>[c.nome,c.cnpj,c.cidade_uf,ST_LBL[c.status_carteira]||'',n(c.faturamento),c.pedidos||0,n(c.ticket_medio),c.ultima_compra||'',c.dias_sem_comprar??'',c.proxima_compra_prevista||'',c.dias_atraso_recompra??'',n(c.vencido),n(c.a_vencer),c.classe_credito||'']);
  const txt='﻿'+[cab,...rows].map(r=>r.map(v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`).join(';')).join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'})); a.download=`b2b_${S.aba}_${HOJE}.csv`; a.click();
}
render();
</script>
