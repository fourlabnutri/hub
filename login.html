<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar · FourLab Hub</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="shared.css">
<style>
  body{ display:flex; align-items:center; justify-content:center; padding:20px; }
  .box{ width:100%; max-width:380px; }
  .logo{ display:flex; justify-content:center; margin-bottom:22px; }
  .logo span{ background:linear-gradient(200deg,var(--purple),var(--pink)); width:64px; height:64px; border-radius:20px; display:flex; align-items:center; justify-content:center; box-shadow:0 10px 30px rgba(115,27,88,.25); }
  .logo img{ height:34px; }
  .err{ color:var(--red); font-size:12.5px; margin-top:10px; min-height:18px; }
  form > div{ margin-bottom:14px; }
</style>
</head>
<body>
<div class="box">
  <div class="logo"><span><img id="logo" alt="FourLab"></span></div>
  <div class="panel">
    <h2 style="font-size:20px;font-family:var(--font-title)">Hub FourLab</h2>
    <div class="desc">Entre com seu e-mail e senha.</div>
    <form id="f">
      <div><label for="e">E-mail</label><input id="e" type="email" autocomplete="username" required></div>
      <div><label for="p">Senha</label><input id="p" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-primary" style="width:100%" id="b">Entrar</button>
      <div class="err" id="err"></div>
    </form>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const sb = window.supabase.createClient(HUB_CONFIG.SUPABASE_URL, HUB_CONFIG.SUPABASE_ANON_KEY);
sb.auth.getSession().then(({data}) => { if (data.session) location.href = '/'; });
document.getElementById('f').onsubmit = async ev => {
  ev.preventDefault();
  const b = document.getElementById('b'), err = document.getElementById('err');
  b.disabled = true; err.textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: e.value.trim(), password: p.value });
  if (error) { err.textContent = 'E-mail ou senha incorretos.'; b.disabled = false; return; }
  location.href = '/';
};
</script>
</body>
</html>
