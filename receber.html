<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contas a receber · FourLab</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#140e10">
<link rel="stylesheet" href="shared.css">
<style>
  /* ===== Contas a receber · v2 (vidro) ===== */
  body{ background:#efe9e3; }
  body::before{ content:""; position:fixed; inset:-20%; z-index:-1; pointer-events:none;
    background:radial-gradient(38% 34% at 78% 8%, rgba(233,103,9,.22), transparent 70%),
               radial-gradient(30% 30% at 12% 70%, rgba(115,27,88,.16), transparent 70%),
               radial-gradient(26% 26% at 60% 92%, rgba(253,204,3,.18), transparent 70%); filter:blur(10px); }
  main{ padding-top:28px !important; }
  
  .glass{ background:rgba(255,255,255,.58); -webkit-backdrop-filter:blur(22px) saturate(170%); backdrop-filter:blur(22px) saturate(170%);
    border:1px solid rgba(255,255,255,.75); border-radius:26px; box-shadow:0 1px 0 rgba(255,255,255,.9) inset, 0 10px 40px rgba(60,30,20,.07); }
  .r-head{ display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; margin-bottom:18px; }
  .r-head h1{ font-size:34px; letter-spacing:-.8px; }
  .r-head .sub{ font-size:12.5px; color:var(--muted); margin-top:4px; }
  .num{ text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .muted{ color:var(--muted); } .red{ color:var(--red); font-weight:700; }
  .sub2{ font-size:11px; color:var(--muted); }
  a.lnk{ color:var(--orange); font-weight:700; text-decoration:none; } a.lnk:hover{ text-decoration:underline; }

  /* barra de filtros */
  .toolbar{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:8px; margin-bottom:12px; border-radius:999px; }
  .segm{ display:inline-flex; background:rgba(26,19,21,.06); border-radius:999px; padding:3px; }
  .segm button{ border:0; background:none; padding:7px 14px; border-radius:999px; font-size:12px; font-weight:700; color:var(--ink-2); cursor:pointer; }
  .segm button.on{ background:#fff; color:var(--ink); box-shadow:0 2px 10px rgba(26,19,21,.1); }
  .sel{ position:relative; }
  .sel select{ appearance:none; -webkit-appearance:none; border:0; background:rgba(26,19,21,.06); border-radius:999px; padding:9px 34px 9px 14px; font-size:12px; font-weight:700; color:var(--ink); cursor:pointer; width:auto; }
  .sel::after{ content:""; position:absolute; right:14px; top:50%; width:6px; height:6px; border-right:2px solid var(--ink-2); border-bottom:2px solid var(--ink-2); transform:translateY(-70%) rotate(45deg); pointer-events:none; }
  .dates{ display:flex; gap:6px; align-items:center; font-size:12px; }
  .dates input{ width:auto; border:0; background:rgba(26,19,21,.06); border-radius:999px; padding:7px 12px; font-size:12px; }
  .busca{ flex:1; min-width:200px; position:relative; }
  .busca input{ width:100%; border:0; background:rgba(255,255,255,.8); border-radius:999px; padding:9px 14px 9px 36px; font-size:12.5px; }
  .busca svg{ position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--muted); }
  .sw{ display:inline-flex; align-items:center; gap:8px; font-size:11.5px; font-weight:700; color:var(--ink-2); cursor:pointer; margin:0 8px 0 0; white-space:nowrap; }
  .sw input{ display:none; }
  .sw i{ width:30px; height:18px; border-radius:99px; background:rgba(26,19,21,.15); position:relative; transition:.2s; }
  .sw i::after{ content:""; position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%; background:#fff; transition:.2s; box-shadow:0 1px 3px rgba(0,0,0,.2); }
  .sw input:checked + i{ background:var(--orange); } .sw input:checked + i::after{ left:14px; }

  /* pastas por tipo de comércio */
  .pastas{ display:flex; gap:8px; overflow-x:auto; padding:2px 2px 6px; margin-bottom:20px; scrollbar-width:none; }
  .pasta{ flex:0 0 auto; display:flex; align-items:center; gap:10px; border:1px solid rgba(255,255,255,.75); background:rgba(255,255,255,.45); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    border-radius:16px; padding:9px 14px 9px 10px; cursor:pointer; text-align:left; transition:.15s; }
  .pasta:hover{ background:rgba(255,255,255,.8); }
  .pasta .ico{ width:30px; height:30px; border-radius:10px; display:grid; place-items:center; background:rgba(26,19,21,.06); color:var(--ink-2); } .pasta.on .ico{ color:var(--orange); }
  .pasta b{ display:block; font-size:12.5px; } .pasta small{ font-size:11px; color:var(--muted); }
  .pasta.on{ background:#fff; border-color:var(--orange); box-shadow:0 0 0 1px var(--orange) inset; } .pasta.on .ico{ background:var(--orange-soft); }

  /* topo: KPIs */
  .hero{ display:grid; grid-template-columns:1.35fr 1fr 1fr; gap:16px; margin-bottom:16px; }
  .k{ padding:22px 24px; display:flex; flex-direction:column; gap:6px; min-width:0; }
  .k .lbl{ font-size:12px; font-weight:600; color:var(--muted); display:flex; align-items:center; gap:8px; }
  .k .val{ font-family:var(--font-title); font-size:34px; font-weight:600; letter-spacing:-1px; line-height:1.05; font-variant-numeric:tabular-nums; }
  .k .val small{ font-size:.5em; font-weight:500; opacity:.55; margin-right:4px; letter-spacing:0; }
  .k .foot{ font-size:11.5px; color:var(--muted); }
  .k.dark{ background:linear-gradient(150deg,#241a1d 0%,#140e10 100%); color:#fff; border:0; }
  .k.dark .lbl, .k.dark .foot{ color:rgba(255,255,255,.6); }
  .k.hot{ background:linear-gradient(140deg,#e96709 0%,#f28a0c 60%,#f7a21b 100%); color:#fff; border:0; box-shadow:0 14px 40px rgba(233,103,9,.28); }
  .k.hot .lbl,.k.hot .foot{ color:rgba(255,255,255,.82); }
  .badge{ display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:800; padding:3px 9px; border-radius:999px; background:rgba(255,255,255,.18); }
  .badge.r{ background:var(--red-soft); color:var(--red); } .badge.g{ background:var(--green-soft); color:var(--green); }
  .stack{ display:flex; height:12px; border-radius:99px; overflow:hidden; gap:3px; margin-top:12px; }
  .stack span{ display:block; height:100%; border-radius:99px; min-width:4px; }
  .legend{ display:flex; gap:14px; flex-wrap:wrap; font-size:11.5px; margin-top:8px; }
  .legend i{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
  .k.dark .legend{ color:rgba(255,255,255,.75); }

  /* gráficos */
  .duo{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px; }
  .box{ padding:22px 24px; }
  .box h2{ font-size:15px; font-weight:700; } .box .desc{ font-size:12px; color:var(--muted); margin-top:2px; }
  .faixas{ display:grid; gap:14px; margin-top:18px; }
  .fx{ display:grid; grid-template-columns:110px 1fr auto; gap:14px; align-items:center; }
  .fx .n{ font-size:12px; font-weight:700; } .fx .n small{ display:block; font-weight:500; color:var(--muted); font-size:11px; }
  .fx .t{ height:30px; border-radius:10px; background:rgba(26,19,21,.05); overflow:hidden; }
  .fx .t div{ height:100%; border-radius:10px; }
  .fx .v{ font-family:var(--font-title); font-weight:600; font-size:16px; text-align:right; font-variant-numeric:tabular-nums; min-width:120px; }
  .fx .v small{ display:block; font-family:var(--font-body); font-size:11px; color:var(--muted); font-weight:500; }
  .cols{ display:flex; align-items:flex-end; gap:12px; height:190px; margin-top:18px; padding-top:28px; }
  .col{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:8px; min-width:0; }
  .col .bar{ width:100%; max-width:64px; border-radius:14px 14px 8px 8px; background:repeating-linear-gradient(135deg, rgba(233,103,9,.22) 0 6px, rgba(233,103,9,.1) 6px 12px); position:relative; }
  .col.top .bar{ background:var(--grad-accent); box-shadow:0 8px 20px rgba(233,103,9,.25); }
  .col .bar em{ position:absolute; top:-22px; left:50%; transform:translateX(-50%); font-style:normal; font-size:11px; font-weight:800; white-space:nowrap; }
  .col .m{ font-size:11px; color:var(--muted); font-weight:600; }

  /* clientes: abas + lista */
  .clientes{ padding:20px 22px; margin-bottom:16px; }
  .c-head{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:6px; }
  .tabs2{ display:flex; gap:4px; background:rgba(26,19,21,.06); border-radius:999px; padding:4px; overflow-x:auto; }
  .tabs2 button{ border:0; background:none; border-radius:999px; padding:8px 14px; font-size:12.5px; font-weight:700; color:var(--ink-2); cursor:pointer; white-space:nowrap; display:inline-flex; gap:6px; align-items:center; }
  .tabs2 button .cnt{ font-size:10.5px; font-weight:800; padding:1px 7px; border-radius:99px; background:rgba(26,19,21,.08); }
  .tabs2 button.on{ background:#fff; color:var(--ink); box-shadow:0 2px 10px rgba(26,19,21,.08); }
  .tabs2 button.on .cnt{ background:var(--orange); color:#fff; }
  .sub-tabs{ display:flex; gap:6px; flex-wrap:wrap; margin:14px 0 4px; }
  .sub-tabs button{ border:1px solid var(--line); background:rgba(255,255,255,.6); border-radius:999px; padding:5px 12px; font-size:11.5px; font-weight:700; color:var(--ink-2); cursor:pointer; }
  .sub-tabs button.on{ border-color:var(--ink); background:var(--ink); color:#fff; }
  .c-desc{ font-size:12px; color:var(--muted); margin:10px 0 6px; }
  .lista{ display:grid; }
  .li{ display:grid; grid-template-columns:minmax(0,2.4fr) 140px 130px 110px 56px; gap:14px; align-items:center; padding:12px 10px; border-radius:16px; cursor:pointer; }
  .li + .li{ border-top:1px solid rgba(26,19,21,.06); }
  .li:hover{ background:rgba(255,255,255,.7); border-color:transparent; }
  .li.cab{ cursor:default; font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; padding-top:4px; padding-bottom:8px; }
  .li.cab:hover{ background:none; }
  .who{ display:flex; gap:12px; align-items:center; min-width:0; }
  .av{ flex:0 0 38px; height:38px; border-radius:12px; display:grid; place-items:center; font-weight:800; font-size:13px; }
  .who b{ display:block; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .who small{ display:block; font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ct{ font-size:12px; min-width:0; overflow:hidden; } .ct a.lnk{ color:var(--ink-2); font-weight:600; } .ct .sub2 a.lnk{ color:var(--muted); font-weight:500; } .ct .sub2{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .vv{ text-align:right; font-variant-numeric:tabular-nums; } .vv b{ font-size:14px; } .vv small{ display:block; font-size:11px; color:var(--muted); }
  .dias{ display:inline-block; font-size:11px; font-weight:800; padding:4px 9px; border-radius:99px; }
  .d1{ background:#fff4c9; color:#8a6a00; } .d2{ background:var(--orange-soft); color:#b5680a; } .d3{ background:var(--red-soft); color:var(--red); } .d0{ background:var(--surface-2); color:var(--muted); }
  .score{ display:inline-flex; align-items:center; justify-content:center; width:40px; height:40px; border-radius:50%; font-weight:800; font-size:12.5px; }
  .score.A{ background:var(--green-soft); color:var(--green); } .score.B{ background:#fff4c9; color:#8a6a00; } .score.C{ background:var(--orange-soft); color:#b5680a; } .score.D{ background:var(--red-soft); color:var(--red); } .score.N{ background:var(--surface-2); color:var(--muted); }
  .wa{ display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700; color:#0f7a3d; background:var(--green-soft); padding:6px 11px; border-radius:99px; text-decoration:none; }
  .rodape{ display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-top:12px; }
  .btn-glass{ border:1px solid rgba(26,19,21,.12); background:rgba(255,255,255,.7); border-radius:999px; padding:8px 16px; font-size:12px; font-weight:700; color:var(--ink); cursor:pointer; }
  .btn-glass:hover{ background:#fff; } .btn-ink{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .empty{ padding:30px; text-align:center; color:var(--muted); font-size:13px; }
  details.how summary{ cursor:pointer; font-size:12px; font-weight:700; color:var(--orange); margin-top:12px; }
  details.how p{ font-size:12px; color:var(--ink-2); margin-top:6px; line-height:1.55; }
  .note{ font-size:11.5px; color:var(--muted); line-height:1.5; }
  .tbl-wrap{ overflow-x:auto; }

  @media (max-width:1100px){ .hero{ grid-template-columns:1fr 1fr; } .hero .k.dark{ grid-column:1/-1; } .li{ grid-template-columns:minmax(0,2fr) 120px 110px 56px; } .li > :nth-child(3){ display:none; } }
  @media (max-width:720px){ .hero,.duo{ grid-template-columns:1fr; } .toolbar{ border-radius:22px; } .k .val{ font-size:28px; } .fx{ grid-template-columns:90px 1fr; } .fx .v{ grid-column:1/-1; text-align:left; }
    .li{ grid-template-columns:minmax(0,1fr) auto; } .li > :nth-child(n+3){ display:none; } .li.cab{ display:none; } }
  @media print{ .sidebar,.toolbar,.pastas,.no-print{ display:none !important; } .shell{ display:block; } body::before{ display:none; } .glass{ background:#fff; backdrop-filter:none; } }
  .hero{ grid-template-columns:repeat(4,minmax(0,1fr)); }
  .k{ justify-content:flex-start; min-height:0; padding:16px 20px; gap:6px; }
  .k .val{ font-size:26px; letter-spacing:-.6px; }
  .hero{ align-items:stretch; }
  .gcard{ flex-direction:row; align-items:center; justify-content:space-between; } .gcard .lbl{ align-self:flex-start; }
  .k .lbl{ font-size:13px; color:var(--ink-2); }
  .k.hot{ background:linear-gradient(140deg,#e96709 0%,#f28a0c 60%,#f7a21b 100%); color:#fff; border-radius:26px; }
  .k.hot .lbl{ color:rgba(255,255,255,.9); }
  .gcard{ padding-bottom:12px; } .gauge{ width:118px; flex:0 0 118px; margin:-4px -4px -8px 0; }
  .gauge text{ font-family:var(--font-title); font-size:40px; font-weight:600; fill:var(--ink); letter-spacing:-1px; }
  .pill-dt{ font-size:12px; font-weight:700; padding:8px 14px; border-radius:99px; background:rgba(255,255,255,.7); border:1px solid rgba(255,255,255,.8); }
  .box h2{ font-size:14px; } .box{ padding:16px 20px; } .duo,.tri,.hero{ gap:12px; margin-bottom:12px; } .col .bar{ max-width:52px; }
  .cols{ height:150px; padding-top:22px; }
  @media (max-width:1100px){ .hero{ grid-template-columns:1fr 1fr; } }
  @media (max-width:720px){ .hero{ grid-template-columns:1fr; } }
</style>
<style>
  .nav-area{ font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.8px; color:rgba(255,255,255,.55); padding:14px 14px 2px; white-space:nowrap; opacity:0; transition:opacity .16s ease .04s; }
  .sidebar:hover .nav-area{ opacity:1; }
  .nav-sep{ height:1px; background:rgba(255,255,255,.16); margin:10px 12px 0; }
  @media (max-width:860px){ .nav-area{ opacity:1; } }
  /* menu por área (sanfona) */
  .nav-cab .chev{ margin-left:auto; flex-shrink:0; opacity:0; transition:transform .22s ease, opacity .16s ease; }
  .sidebar:hover .nav-cab .chev{ opacity:.7; }
  .nav-grupo.aberto > .nav-cab .chev{ transform:rotate(90deg); }
  .nav-grupo.aberto > .nav-cab{ color:#fff; }
  .nav-grupo.tem-ativo > .nav-cab{ background:rgba(255,255,255,.14); color:#fff; }
  .nav-sub{ display:grid; grid-template-rows:0fr; transition:grid-template-rows .26s cubic-bezier(.4,0,.2,1); }
  .nav-sub > div{ overflow:hidden; display:flex; flex-direction:column; gap:2px; }
  .sidebar:hover .nav-grupo.aberto > .nav-sub{ grid-template-rows:1fr; }
  .nav-btn.sub{ font-size:12.5px; font-weight:600; padding:9px 12px 9px 22px; }
  .nav-btn.sub .ic{ transform:scale(.85); }
  .nav-sub > div > .nav-btn.sub:first-child{ margin-top:2px; }
  @media (max-width:860px){ .nav-cab .chev{ opacity:.7; } .nav-grupo.aberto > .nav-sub{ grid-template-rows:1fr; } }
  .home-btn{ display:inline-flex; align-items:center; gap:6px; margin-bottom:10px; padding:6px 13px 6px 10px; border-radius:999px; background:#fff; border:1px solid rgba(0,0,0,.12); font-size:12px; font-weight:700; color:var(--ink); text-decoration:none; }
  .home-btn:hover{ background:var(--orange); border-color:var(--orange); color:#fff; }
  .home-btn svg{ width:14px; height:14px; }
  @media print{ .home-btn{ display:none; } }
</style><style>
  @media print{
    @page{ size:A4; margin:20mm 12mm 18mm;
      @top-left{ content:url(assets/logo-print.svg) "  FourLab Nutrition"; font:700 10pt Arial, Helvetica, sans-serif; color:#222; vertical-align:middle; }
      @bottom-left{ content:"Documento interno · FourLab Nutrition"; font:8.5pt Arial, Helvetica, sans-serif; color:#666; }
      @bottom-right{ content:"Página " counter(page) " de " counter(pages); font:8.5pt Arial, Helvetica, sans-serif; color:#666; }
    }
    html, body, .shell, main{ background:#fff !important; }
    *{ box-shadow:none !important; text-shadow:none !important; }
    .card, .panel, .tile, .kpi{ border:1px solid #e3ddd5 !important; }
    body{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }
</style>
</head>
<body>

s="label">RNC de pedidos</span></a></div></div></div><div class="nav-grupo" data-area-cap="admin"><button type="button" class="nav-btn nav-cab" aria-expanded="false" onclick="var g=this.parentNode,e=g.classList.contains('aberto');g.parentNode.querySelectorAll('.nav-grupo.aberto').forEach(function(x){x.classList.remove('aberto');x.firstChild.setAttribute('aria-expanded','false')});if(!e){g.classList.add('aberto');this.setAttribute('aria-expanded','true')}"><span class="ic"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span><span class="label">Administração</span><svg class="chev" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button><div class="nav-sub"><div><a class="nav-btn sub" href="usuarios.html" data-area="admin"><span class="ic"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span><span class="label">Usuários e acessos</span></a></div></div></div></nav>

<script type="text/plain" id="app">
// ---------- dados ----------
const HOJE = DATA.gerado;                       // data de referência do snapshot (YYYY-MM-DD)
const FORMA = {B:'Boleto', X:'PIX', C:'Cartão (loja)', L:'PIX loja'};
const LOJA = new Set(['C']);                    // cartão da loja: pago pela operadora, fora da cobrança por padrão
// PIX da loja (L) vencido = cancelado: nunca entra (regra do negócio)
const CLI = {};
DATA.clientes.forEach(c=>{ CLI[c[0]] = {k:c[0], nome:c[1], email:(c[2]||'').split(/[;,]/)[0].trim(), tel:c[3]||'', loc:c[4]==='/'?'':c[4],
  n:c[5], emDia:c[6], atrasos:c[7], atrasoMedio:c[8], atrasoMax:c[9], pagoV:c[10], emitidoV:c[11], emDiaV:c[12], atrasoV:c[13], ...('scoreFixo' in c ? {scoreFixo:c.scoreFixo} : {})}; });
const TIT = DATA.titulos.map(t=>({k:t[0], o:t[1], venc:t[2], v:t[3], forma:t[4], ped:t[5], parc:t[6], dias:diffDias(HOJE, t[2])}));
// dias>0 = vencido há N dias; dias<=0 = a vencer (0 = vence hoje)

function diffDias(a,b){ return Math.round((Date.parse(a)-Date.parse(b))/864e5); }
function addDias(iso,n){ const d=new Date(Date.parse(iso)+n*864e5); return d.toISOString().slice(0,10); }
const BRL = v => 'R$ ' + (Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const dBR = iso => iso ? iso.split('-').reverse().join('/') : '—';
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const faixa = d => d<=0 ? 'avencer' : d<=30 ? 'f1' : d<=90 ? 'f2' : 'f3';
const FAIXA_LBL = {f1:'1 a 30 dias', f2:'31 a 90 dias', f3:'Acima de 90 dias', avencer:'A vencer'};

// ---------- filtros ----------
const S = {preset:'tudo', ini:'', fim:'', loja:false, q:'', seg:'ambos', tipo:'todos'};
const mes = (iso,off=0)=>{ const [y,m]=iso.split('-').map(Number); const d=new Date(Date.UTC(y,m-1+off,1)); return d.toISOString().slice(0,10); };
function intervalo(){
  const h=HOJE;
  switch(S.preset){
    case 'hoje': return [h,h];
    case 'u7': return [addDias(h,-7), h];
    case 'u30': return [addDias(h,-30), h];
    case 'p7': return [h, addDias(h,7)];
    case 'p30': return [h, addDias(h,30)];
    case 'mes': return [mes(h), addDias(mes(h,1),-1)];
    case 'mesant': return [mes(h,-1), addDias(mes(h),-1)];
    case 'custom': return [S.ini||'0000-00-00', S.fim||'9999-12-31'];
    default: return ['0000-00-00','9999-12-31'];
  }
}
const noSegmento = t => S.seg==='ambos' || (S.seg==='b2b') === (t.k.length===14);   // CNPJ = B2B; CPF = B2C
const noEscopo = t => t.forma!=='L' && (S.loja || !LOJA.has(t.forma)) && noSegmento(t) && (S.tipo==='todos' || tipoDe(t.k)===S.tipo);
function titulos({periodo=true}={}){
  const [a,b]=intervalo(); const q=S.q.trim().toLowerCase();
  return TIT.filter(t=>{
    if(!noEscopo(t)) return false;
    if(periodo && (t.venc<a || t.venc>b)) return false;
    if(q){ const c=CLI[t.k]; if(!(c.nome||'').toLowerCase().includes(q) && !t.k.includes(q.replace(/\D/g,'')||'§')) return false; }
    return true;
  });
}
const soma = arr => arr.reduce((s,t)=>s+t.v,0);

// ---------- score (0-100) ----------
// 75% pontualidade (metade por nº de títulos, metade por valor) + 25% gravidade do atraso médio (30d+ = 0).
// Teto por atraso atual: >90d = 25, >30d = 45. Sem histórico = null.
function score(c, maxVencido){
  if(c && 'scoreFixo' in c) return c.scoreFixo;   // modo ao vivo: score já calculado na tabela report_receber_clientes
  if(!c || !c.n) return null;
  const pc = c.emDia/c.n, tot=c.emDiaV+c.atrasoV, pv = tot? c.emDiaV/tot : pc;
  const lat = Math.max(c.atrasoMedio||0, maxVencido||0);
  let s = 100*(0.75*(0.5*pc+0.5*pv)) + 25*(1-Math.min(1,lat/30));
  if(maxVencido>90) s=Math.min(s,25); else if(maxVencido>30) s=Math.min(s,45);
  return Math.round(s);
}
const classe = s => s==null?'N': s>=80?'A': s>=60?'B': s>=40?'C':'D';
const scoreHtml = s => `<span class="score ${classe(s)}" title="${s==null?'Sem histórico de pagamento':'Score 0–100'}">${s==null?'—':s}</span>`;

// ---------- agregação por cliente ----------
function porCliente(){
  const abertos = titulos({periodo:false}), ini = titulos();
  const map = {};
  abertos.forEach(t=>{ const m = map[t.k] = map[t.k] || {c:CLI[t.k], venc:0, vencPer:0, avencer:0, maxDias:0, tits:[], prox:null};
    m.tits.push(t);
    if(t.dias>0){ m.venc+=t.v; m.maxDias=Math.max(m.maxDias,t.dias); } else { m.avencer+=t.v; if(!m.prox||t.venc<m.prox) m.prox=t.venc; } });
  ini.forEach(t=>{ if(t.dias>0) map[t.k].vencPer+=t.v; });
  Object.values(map).forEach(m=>{ m.score = score(m.c, m.maxDias); });
  return map;
}

// ---------- gráficos simples ----------
function bars(rows){ const max=Math.max(1,...rows.map(r=>r.v));
  return rows.map(r=>`<div class="bar-row"><div class="top"><b>${r.l}</b><span class="muted">${BRL(r.v)}${r.n!=null?` · ${r.n} tít.`:''}</span></div><div class="track"><div class="fill" style="width:${r.v/max*100}%;background:${r.c||'var(--orange)'}"></div></div></div>`).join('') || '<div class="desc">Sem dados no filtro.</div>'; }

// ---------- tipo de comércio (pastas) ----------
// Classificação pelo nome/razão social. CPF = pessoa física. Sem palavra-chave conhecida = "Outros".
const TIPOS = [
  {id:'bike', nome:'Bike shops', ico:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="16" r="3.5"/><circle cx="18" cy="16" r="3.5"/><path d="M6 16l4-8h5l3 8M10 8l2 8h-6M14 5h2"/></svg>', re:/BIK|BICICL|CICL|PEDAL|SPEED|MTB|EUROBIKE/},
  {id:'supl', nome:'Suplementos e naturais', ico:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="9" width="18" height="7" rx="3.5" transform="rotate(-35 12 12.5)"/><path d="M9.5 8.5l5 7"/></svg>', re:/SUPLEM|NUTRI|NATURA|SAUDAV|SAUDE|POWER|FIT|WHEY|EMPORIO|GRANEL|VIDA/},
  {id:'farm', nome:'Farmácias e saúde', ico:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/></svg>', re:/FARMA|DROGA|CLINIC|MEDIC|ODONT|FISIO|LABORAT/},
  {id:'esp',  nome:'Esportes e academias', ico:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7v10M18 7v10M3 9.5v5M21 9.5v5M6 12h12"/></svg>', re:/SPORT|ESPORT|TRAIN|ACADEM|CROSS|ATLET|CORRID|RUN|ARENA|GYM|SHOES/},
  {id:'alim', nome:'Alimentos e mercados', ico:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/><path d="M3 4h2l2.4 11h11l2-8H6.2"/></svg>', re:/ALIMENT|MERCAD|SUPERM|PADAR|DOCE|SWEET|CAFE|BEBID/},
  {id:'pf',   nome:'Pessoa física', ico:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>'},
  {id:'out',  nome:'Outros comércios', ico:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10l1.5-6h13L20 10M4 10h16M4 10v10h16V10M9 20v-5h6v5"/></svg>'},
];
const tipoCache = {};
function tipoDe(k){
  if(k in tipoCache) return tipoCache[k];
  if(k.length!==14) return tipoCache[k]='pf';
  const n=((CLI[k]&&CLI[k].nome)||'').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  return tipoCache[k]=(TIPOS.find(t=>t.re && t.re.test(n))||{id:'out'}).id;
}

// ---------- views ----------
let pagScore = 12, abaRegua = 'f0', abaScore='abertos', aba='devedores', pagLista=12;
const CORES = [['#fdebdc','#b5680a'],['#f3e6ef','#731b58'],['#dbf3e4','#0f7a3d'],['#fff4c9','#8a6a00'],['#e6eefc','#2b5bb5'],['#fde4ee','#b5004a']];
function avatar(c){ const n=(c.nome||'?').replace(/\b(LTDA|ME|EIRELI|EPP|S\/?A)\b/gi,'').trim(); const p=n.split(/\s+/).filter(Boolean);
  const ini=((p[0]||'?')[0]+(p[1]?p[1][0]:'')).toUpperCase(); let h=0; for(const ch of c.k) h=(h*31+ch.charCodeAt(0))%997; const [bg,fg]=CORES[h%CORES.length];
  return `<span class="av" style="background:${bg};color:${fg}">${esc(ini)}</span>`; }
const nomeCurto = s => String(s||'').replace(/\s+(LTDA|ME|EIRELI|EPP)\.?$/i,'').trim();
function quem(m){ const t=TIPOS.find(x=>x.id===tipoDe(m.c.k)); return `<div class="who">${avatar(m.c)}<div style="min-width:0"><b title="${esc(m.c.nome)}">${esc(nomeCurto(m.c.nome))}</b><small>${t.nome}${m.c.loc?' · '+esc(m.c.loc):''}</small></div></div>`; }
const diasHtml = d => `<span class="dias ${d<=0?'d0':d<=30?'d1':d<=90?'d2':'d3'}">${d<=0?'em dia':d+' d'}</span>`;
const kv = v => { const [i,c]=(Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}).split(','); return `<small>R$</small>${i}<span style="opacity:.45">,${c}</span>`; };
const kCurto = v => v>=1e6? 'R$ '+(v/1e6).toFixed(1).replace('.',',')+' mi' : v>=1e3? 'R$ '+Math.round(v/1e3)+' mil' : BRL(v);


// ---------- gráficos ----------
function gauge(pct){ const N=22, on=Math.round(Math.min(100,pct)/100*N), cx=110, cy=104; let seg='';
  for(let i=0;i<N;i++){ const ang=Math.PI*(1-i/(N-1)), c=Math.cos(ang), s=Math.sin(ang);
    seg+=`<line x1="${cx+c*76}" y1="${cy-s*76}" x2="${cx+c*96}" y2="${cy-s*96}" stroke="${i<on?(pct>=25?'var(--red)':'var(--orange)'):'rgba(26,19,21,.09)'}" stroke-width="9" stroke-linecap="round"/>`; }
  return `<svg class="gauge" viewBox="0 0 220 112">${seg}<text x="110" y="104" text-anchor="middle">${pct.toFixed(0)}%</text></svg>`; }
function colunas(rows){ const max=Math.max(1,...rows.map(r=>r.v));
  return `<div class="cols">${rows.map(r=>`<div class="col ${r.v===max&&r.v>0?'top':''}"><div class="bar" style="height:${Math.max(4,r.v/max*100)}%"><em>${kCurto(r.v)}</em></div><div class="m">${esc(r.l)}</div></div>`).join('')}</div>`; }

function render(){
  const ts = titulos(), vencidos = ts.filter(t=>t.dias>0), avencer = ts.filter(t=>t.dias<=0);
  const V=soma(vencidos), A=soma(avencer), tot=V+A, pct = tot? V/tot*100:0;
  const fx = {f1:vencidos.filter(t=>t.dias<=30), f2:vencidos.filter(t=>t.dias>30&&t.dias<=90), f3:vencidos.filter(t=>t.dias>90)};
  const nCli = arr => new Set(arr.map(t=>t.k)).size;
  const M = porCliente(), clientes = Object.values(M);
  const devedores = clientes.filter(m=>m.vencPer>0).sort((a,b)=>b.vencPer-a.vencPer);
  const possiveis = clientes.filter(m=>m.venc===0 && m.avencer>0 && m.c.atrasos>0).sort((a,b)=>b.avencer-a.avencer);
  const g = reguaGrupos(M), nRegua = Object.values(g).reduce((s,a)=>s+a.length,0);
  const [ia,ib]=intervalo();
  const corPct = pct>=25?'r':pct>=10?'':'g';

  const porMes={}; avencer.forEach(t=>{ const k=t.venc.slice(0,7); porMes[k]=(porMes[k]||0)+t.v; });
  const meses = Object.keys(porMes).sort().slice(0,8), maxMes=Math.max(1,...meses.map(k=>porMes[k]));
  const NM=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

  // pastas: contagem ignora o próprio filtro de pasta
  const tipoAtual=S.tipo; S.tipo='todos'; const base=titulos(); S.tipo=tipoAtual;
  const porTipo={}; base.forEach(t=>{ const id=tipoDe(t.k); (porTipo[id]=porTipo[id]||{k:new Set(),v:0}).k.add(t.k); porTipo[id].v+=t.v; });
  const pasta=(id,nome,ico,n,v)=>`<button class="pasta ${S.tipo===id?'on':''}" onclick="S.tipo='${id}';pagLista=12;render()"><span class="ico">${ico}</span><span><b>${nome}</b><small>${kCurto(v)}</small></span></button>`;
  const PER=[['tudo','Todo o período'],['hoje','Vence hoje'],['u7','Últimos 7 dias'],['u30','Últimos 30 dias'],['p7','Próximos 7 dias'],['p30','Próximos 30 dias'],['mes','Este mês'],['mesant','Mês passado'],['custom','Personalizado…']];

  const ABAS=[['devedores','Devedores',devedores.length],['regua','Aging por cliente',nRegua],['prev','Risco',possiveis.length],['score','Score',null]];

  document.getElementById('main').innerHTML = `
  <div class="r-head">
    <div><h1>Contas a receber</h1></div>
    <div class="no-print" style="display:flex;gap:8px;align-items:center"><span class="pill-dt">${dBR(HOJE)}</span><button class="btn-glass" onclick="window.print()">Imprimir / PDF</button></div>
  </div>

  <div class="toolbar glass no-print">
    <div class="segm">${[['ambos','Todos'],['b2b','B2B'],['b2c','B2C']].map(([id,l])=>`<button class="${S.seg===id?'on':''}" onclick="S.seg='${id}';render()">${l}</button>`).join('')}</div>
    <div class="sel"><select onchange="setPreset(this.value)">${PER.map(([id,l])=>`<option value="${id}" ${S.preset===id?'selected':''}>${l}</option>`).join('')}</select></div>
    ${S.preset==='custom'?`<div class="dates"><input type="date" value="${S.ini}" onchange="S.ini=this.value;render()"><span class="muted">até</span><input type="date" value="${S.fim}" onchange="S.fim=this.value;render()"></div>`:''}
    <div class="busca"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Buscar cliente, CNPJ ou CPF" value="${esc(S.q)}" oninput="S.q=this.value;clearTimeout(window._t);window._t=setTimeout(()=>{render();const e=document.getElementById('q');e.focus();e.setSelectionRange(e.value.length,e.value.length)},250)"></div>
    <label class="sw" title="Parcelas de cartão da loja online: quem paga é a operadora, não há cobrança."><input type="checkbox" ${S.loja?'checked':''} onchange="S.loja=this.checked;render()"><i></i>Cartão da loja</label>
  </div>

  <div class="pastas no-print">
    ${pasta('todos','Todas as pastas','<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',new Set(base.map(t=>t.k)).size,soma(base))}
    ${TIPOS.filter(t=>porTipo[t.id]).map(t=>pasta(t.id,t.nome,t.ico,porTipo[t.id].k.size,porTipo[t.id].v)).join('')}
  </div>

  <div class="hero">
    <div class="k glass"><div class="lbl">Carteira em aberto</div><div class="val">${kv(tot)}</div></div>
    <div class="k hot"><div class="lbl">Vencido</div><div class="val">${kv(V)}</div></div>
    <div class="k glass"><div class="lbl">A vencer</div><div class="val">${kv(A)}</div></div>
    <div class="k glass gcard"><div class="lbl">% vencido</div>${gauge(pct)}</div>
  </div>

  <div class="duo">
    <div class="box glass"><h2>Vencido por atraso</h2>
      ${colunas(['f1','f2','f3'].map(f=>({l:FAIXA_LBL[f].replace('Acima de ','+').replace(' dias',' d'), v:soma(fx[f])})))}</div>
    <div class="box glass"><h2>A vencer por mês</h2>
      ${meses.length?colunas(meses.map(k=>({l:NM[+k.slice(5)-1]+'/'+k.slice(2,4), v:porMes[k]}))):'<div class="empty">Nada a vencer no filtro.</div>'}</div>
  </div>

  <div class="clientes glass">
    <div class="c-head">
      <div class="tabs2">${ABAS.map(([id,l,n])=>`<button class="${aba===id?'on':''}" onclick="aba='${id}';pagLista=12;render()">${l}${n!=null?` <span class="cnt">${n}</span>`:''}</button>`).join('')}</div>
      <div class="no-print" style="display:flex;gap:8px">${aba==='devedores'?`<button class="btn-glass" onclick="csv('devedores')">Baixar CSV</button>`:aba==='prev'?`<button class="btn-glass" onclick="csv('possiveis')">Baixar CSV</button>`:aba==='regua'?`<button class="btn-glass" onclick="csv('regua')">CSV da faixa</button><button class="btn-glass" onclick="csv('reguaTudo')">CSV completo</button>`:''}</div>
    </div>
    ${aba==='devedores'?listaDevedores(devedores):aba==='regua'?reguaHtml(g):aba==='prev'?listaPrev(possiveis):scorePanel(M)}
  </div>`;
}

function mais(n){ return n>pagLista?`<div class="rodape"><span class="note">Mostrando ${pagLista} de ${n}</span><button class="btn-glass no-print" onclick="pagLista+=24;render()">Ver mais ${Math.min(24,n-pagLista)}</button></div>`:''; }
function listaDevedores(l){
  return `  <div class="lista"><div class="li cab"><span>Cliente</span><span class="num">Vencido</span><span class="num">A vencer</span><span class="num">Atraso</span><span>Score</span></div>
  ${l.slice(0,pagLista).map(m=>`<div class="li" onclick="detalhe('${m.c.k}')">${quem(m)}
    <div class="vv red"><b>${BRL(m.vencPer)}</b><small>${m.tits.filter(t=>t.dias>0).length} títulos</small></div><div class="vv">${m.avencer?BRL(m.avencer):'<span class="muted">—</span>'}</div><div class="num">${diasHtml(m.maxDias)}</div><div>${scoreHtml(m.score)}</div></div>`).join('') || '<div class="empty">Nenhum devedor no filtro.</div>'}</div>${mais(l.length)}`;
}
function listaPrev(l){
  return `  <div class="lista"><div class="li cab"><span>Cliente</span><span class="num">A vencer</span><span class="num">Próx. venc.</span><span class="num">Atrasos</span><span>Score</span></div>
  ${l.slice(0,pagLista).map(m=>`<div class="li" onclick="detalhe('${m.c.k}')">${quem(m)}
    <div class="vv"><b>${BRL(m.avencer)}</b></div><div class="vv">${dBR(m.prox)}</div><div class="vv"><b>${m.c.atrasos}</b><small>de ${m.c.n}${m.c.atrasoMedio!=null?' · '+m.c.atrasoMedio.toFixed(0)+' d':''}</small></div><div>${scoreHtml(m.score)}</div></div>`).join('') || '<div class="empty">Nenhum cliente nesse perfil.</div>'}</div>${mais(l.length)}`;
}

function reguaGrupos(M){
  const g={f0:[],f1:[],f2:[],f3:[]};
  Object.values(M).forEach(m=>{ const vs=m.tits.filter(t=>t.dias>0); if(!vs.length) return; const d=Math.max(...vs.map(t=>t.dias));
    (d===1?g.f0: d<=30?g.f1: d<=90?g.f2: g.f3).push(m); });
  Object.values(g).forEach(a=>a.sort((x,y)=>y.venc-x.venc));
  return g;
}
const REG_LBL = {f0:'Do dia (1 dia)', f1:'2 a 30 dias', f2:'31 a 90 dias', f3:'Acima de 90 dias'};
function reguaHtml(g){
  const lista=g[abaRegua];
  return `<div class="sub-tabs no-print">${Object.keys(REG_LBL).map(k=>`<button class="${abaRegua===k?'on':''}" onclick="abaRegua='${k}';pagLista=12;render()">${REG_LBL[k]} · ${g[k].length}</button>`).join('')}</div>
    <div class="lista"><div class="li cab"><span>Cliente</span><span class="num">Vencido</span><span class="num">A vencer</span><span class="num">Atraso</span><span>Score</span></div>
  ${lista.slice(0,pagLista).map(m=>{ const vs=m.tits.filter(t=>t.dias>0);
    return `<div class="li" onclick="detalhe('${m.c.k}')">${quem(m)}<div class="vv red"><b>${BRL(m.venc)}</b><small>${vs.length} títulos</small></div><div class="vv">${m.avencer?BRL(m.avencer):'<span class="muted">—</span>'}</div><div class="num">${diasHtml(m.maxDias)}</div>
    <div>${scoreHtml(m.score)}</div></div>`; }).join('') || '<div class="empty">Ninguém nessa faixa hoje.</div>'}</div>${mais(lista.length)}`;
}

function scorePanel(M){
  const abertos = Object.values(M).filter(m=>m.score!=null);
  const hist = Object.values(CLI).filter(c=>c.n>0 && !M[c.k] && (S.tipo==='todos'||tipoDe(c.k)===S.tipo)).map(c=>({c, venc:0, avencer:0, maxDias:0, tits:[], score:score(c,0)}));
  const lista = (abaScore==='abertos'? abertos : [...abertos,...hist]).sort((a,b)=>a.score-b.score);
  const q=S.q.trim().toLowerCase(), l2 = q? lista.filter(m=>m.c.nome.toLowerCase().includes(q)||m.c.k.includes(q.replace(/\D/g,'')||'§')) : lista;
  return `<div class="sub-tabs no-print"><button class="${abaScore==='abertos'?'on':''}" onclick="abaScore='abertos';pagLista=12;render()">Com título em aberto</button><button class="${abaScore==='todos'?'on':''}" onclick="abaScore='todos';pagLista=12;render()">Todos com histórico</button></div>
    <div class="lista"><div class="li cab"><span>Cliente</span><span class="num">Compras</span><span class="num">Em aberto</span><span class="num">Atraso méd.</span><span>Score</span></div>
  ${l2.slice(0,pagLista).map(m=>`<div class="li" onclick="detalhe('${m.c.k}')">${quem(m)}<div class="vv">${BRL(m.c.emitidoV)}<small>${m.c.emDia} de ${m.c.n} pagos em dia</small></div><div class="vv"><b>${m.venc+m.avencer?BRL(m.venc+m.avencer):'—'}</b></div><div class="num muted">${m.c.atrasoMedio!=null?m.c.atrasoMedio.toFixed(0)+' d':'—'}</div><div>${scoreHtml(m.score)}</div></div>`).join('') || '<div class="empty">Sem clientes.</div>'}</div>${mais(l2.length)}
  <details class="how"><summary>Como o score é calculado</summary><p>0 a 100. 75 pontos vêm da pontualidade (metade pelo nº de títulos pagos em dia, metade pelo valor) e 25 pontos da gravidade do atraso médio (30 dias ou mais zera esses 25). Atraso atual acima de 30 dias limita o score a 45; acima de 90 dias, a 25. Classes: A ≥ 80, B 60–79, C 40–59, D &lt; 40. Cliente sem histórico fica sem score (—). O histórico vem do Asaas desde jan/2026; o Bling ainda não traz títulos já pagos. A pasta de cada cliente é estimada pelo nome da empresa.</p></details>`;
}

// ---------- ações ----------
function setPreset(p){ S.preset=p; pagLista=12; if(p==='custom' && !S.ini){ S.ini=addDias(HOJE,-30); S.fim=HOJE; } render(); }
function detalhe(k){
  const c=CLI[k], ts=TIT.filter(t=>t.k===k && noEscopo(t)).sort((a,b)=>a.venc<b.venc?-1:1);
  const V=soma(ts.filter(t=>t.dias>0)), A=soma(ts.filter(t=>t.dias<=0)), m={c,venc:V,tits:ts};
  document.getElementById('modalBox').innerHTML = `
    <div class="card-head"><div><h2 style="font-size:20px">${esc(c.nome)}</h2><div class="desc">${esc(k)}${c.loc?' · '+esc(c.loc):''}</div></div><button class="icon-btn" onclick="fechar()">✕</button></div>

    <div class="note" style="margin-bottom:10px">Histórico: ${c.n?`${c.emDia} de ${c.n} títulos pagos em dia${c.atrasoMedio!=null?`, atraso médio de ${c.atrasoMedio.toFixed(0)} dias`:''}`:'sem histórico de pagamento'} · compras: ${BRL(c.emitidoV)}</div>
    <div class="tbl-wrap"><table><thead><tr><th>Vencimento</th><th>Pedido</th><th>Parcela</th><th>Forma</th><th class="num">Valor</th><th class="num">Situação</th></tr></thead><tbody>
    ${ts.map(t=>`<tr><td>${dBR(t.venc)}</td><td>${esc(t.ped)||'—'}</td><td>${esc(t.parc)||'—'}</td><td>${FORMA[t.forma]||t.forma}</td><td class="num">${BRL(t.v)}</td><td class="num ${t.dias>0?'red':''}">${t.dias>0?`vencido há ${t.dias} d`:t.dias===0?'vence hoje':`vence em ${-t.dias} d`}</td></tr>`).join('')}
    </tbody></table></div>`;
  document.getElementById('modalBg').classList.add('active');
}
function fechar(){ document.getElementById('modalBg').classList.remove('active'); }
document.getElementById('modalBg').addEventListener('click',e=>{ if(e.target.id==='modalBg') fechar(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') fechar(); });

function csv(tipo){
  const M=porCliente(); let rows=[], nome=tipo;
  const cab=['Cliente','CNPJ/CPF','Pasta','Cidade/UF','Vencido','A vencer','Títulos vencidos','Maior atraso (dias)','Faixa','Score'];
  const linha=(m,fx)=>[m.c.nome,m.c.k,(TIPOS.find(t=>t.id===tipoDe(m.c.k))||{}).nome,m.c.loc,m.venc.toFixed(2).replace('.',','),m.avencer.toFixed(2).replace('.',','),m.tits.filter(t=>t.dias>0).length,m.maxDias,fx||FAIXA_LBL[faixa(m.maxDias)],m.score==null?'':m.score];
  if(tipo==='devedores') rows=Object.values(M).filter(m=>m.vencPer>0).sort((a,b)=>b.vencPer-a.vencPer).map(m=>linha(m));
  else if(tipo==='possiveis') rows=Object.values(M).filter(m=>m.venc===0&&m.avencer>0&&m.c.atrasos>0).map(m=>linha(m,'Risco'));
  else { const g=reguaGrupos(M);
    if(tipo==='regua'){ rows=g[abaRegua].map(m=>linha(m,REG_LBL[abaRegua])); nome='regua_'+abaRegua; }
    else { rows=Object.keys(g).flatMap(k=>g[k].map(m=>linha(m,REG_LBL[k]))); nome='regua_do_dia'; } }
  const txt='﻿'+[cab,...rows].map(r=>r.map(v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`).join(';')).join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'})); a.download=`${nome}_${HOJE}.csv`; a.click();
}
