<script>
// Equipes "de verdade" (postam em grupo). Avulsos e profissionais parceiros são tratados individualmente.
let REAL_TEAMS = ["Trek","Audax","Oggi","Brou","Scott","4Fun"];
const State = { athletes:[], products:[], cycles:{}, history:{}, currentCycleYM: monthKey(todayISO()), cancelGeracao:false, envioOk:false, curtidos:[], compras:{}, cuponsCompras:{}, comprasOk:false, manualOk:false };

/* ---------- utilitários de data ---------- */
function daysInMonth(ym){ const [y,m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); }
function dateFromDay(ym, day){ return `${ym}-${String(day).padStart(2,'0')}`; }
function weekdayShort(iso){ return ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'][new Date(iso+'T12:00:00').getDay()]; }
function athleteName(id){ const a = State.athletes.find(x=>x.id===id); return a?a.name:'(removido)'; }

/* ---------- mapeadores ---------- */
function mapProductFromDB(r){ return {id:r.id, name:r.name, cat:r.cat, desc:r.descricao||''}; }
function mapEntryFromDB(r){
  return { id:r.id, athleteId:r.athlete_id, team:r.team, product:r.product, theme:r.theme,
    format:r.format, date:r.post_date, roteiro:r.roteiro||'',
    status:{ postou:r.postou, collab:r.collab, obs:r.obs||'',
      metrics:{views:r.metric_views||0, likes:r.metric_likes||0, comments:r.metric_comments||0, shares:r.metric_shares||0, saves:r.metric_saves||0} },
    ...camposEnvioDeLinha(r), manual: !!r.manual };
}
// campos de envio só entram no banco depois da migração 2026-10-08 (State.envioOk)
function camposEnvioParaBanco(e){
  if(!State.envioOk) return {};
  return { enviado_em:e.enviadoEm||null, roteiro_enviado:e.roteiroEnviado||'', avaliacao:e.avaliacao||null,
    alterado_equipe_em:e.alteradoEquipeEm||null, alterado_atleta_em:e.alteradoAtletaEm||null };
}

/* ---------- ciclo / persistência ---------- */
function getOrCreateCycle(ym){
  if(!State.cycles[ym]) State.cycles[ym] = {ym, id:null, themeGeral:'', trendsNotes:'', briefingText:'', briefingFileUrl:'', briefingFileName:'', entries:[]};
  return State.cycles[ym];
}
async function getOrCreateCycleDB(ym){
  if(State.cycles[ym] && State.cycles[ym].id) return State.cycles[ym];
  const existing = State.cycles[ym];
  const { data } = await sb.from('cycles').upsert({ym, theme_geral: existing?.themeGeral||'', trends_notes: existing?.trendsNotes||'',
    briefing_text: existing?.briefingText||'', briefing_file_url: existing?.briefingFileUrl||'', briefing_file_name: existing?.briefingFileName||''
  }, {onConflict:'ym'}).select().single();
  State.cycles[ym] = {ym, id:data.id, themeGeral:data.theme_geral||'', trendsNotes:data.trends_notes||'',
    briefingText:data.briefing_text||'', briefingFileUrl:data.briefing_file_url||'', briefingFileName:data.briefing_file_name||'',
    entries: existing?.entries||[]};
  return State.cycles[ym];
}
async function persistCycleMeta(ym){
  const cycle = await getOrCreateCycleDB(ym);
  await sb.from('cycles').update({ theme_geral:cycle.themeGeral, trends_notes:cycle.trendsNotes,
    briefing_text:cycle.briefingText, briefing_file_url:cycle.briefingFileUrl, briefing_file_name:cycle.briefingFileName }).eq('id', cycle.id);
}
async function persistCycleEntries(ym){
  const cycle = await getOrCreateCycleDB(ym);
  await sb.from('entries').delete().eq('cycle_id', cycle.id);
  const rows = cycle.entries.map(e=>({
    cycle_id: cycle.id, athlete_id:e.athleteId, team:e.team, product:e.product, theme:e.theme,
    format:e.format, post_date:e.date, roteiro:e.roteiro||'',
    postou:e.status?.postou||null, collab:e.status?.collab||null, obs:e.status?.obs||'',
    metric_views:e.status?.metrics?.views||0, metric_likes:e.status?.metrics?.likes||0,
    metric_comments:e.status?.metrics?.comments||0, metric_shares:e.status?.metrics?.shares||0, metric_saves:e.status?.metrics?.saves||0,
    ...camposEnvioParaBanco(e),
    ...(State.manualOk ? { manual: !!e.manual } : {}),
  }));
  if(rows.length){
    const { data } = await sb.from('entries').insert(rows).select();
    cycle.entries = (data||[]).map(mapEntryFromDB);
  }
  await carregarHistorico();
}
async function persistOneEntry(ym, entry){
  const cycle = await getOrCreateCycleDB(ym);
  await sb.from('entries').update({ post_date:entry.date, roteiro:entry.roteiro, product:entry.product, format:entry.format, theme:entry.theme||'',
    postou:entry.status?.postou||null, collab:entry.status?.collab||null, obs:entry.status?.obs||'',
    metric_views:entry.status?.metrics?.views||0, metric_likes:entry.status?.metrics?.likes||0,
    metric_comments:entry.status?.metrics?.comments||0, metric_shares:entry.status?.metrics?.shares||0, metric_saves:entry.status?.metrics?.saves||0,
  }).eq('id', entry.id);
  await carregarHistorico();
}

async function carregarMes(ym){
  const { data: cycleRow } = await sb.from('cycles').select('*').eq('ym', ym).maybeSingle();
  if(!cycleRow){ State.cycles[ym] = {ym, id:null, themeGeral:'', trendsNotes:'', briefingText:'', briefingFileUrl:'', briefingFileName:'', entries:[]}; return; }
  const { data: entriesData } = await sb.from('entries').select('*').eq('cycle_id', cycleRow.id);
  State.cycles[ym] = { ym, id:cycleRow.id, themeGeral:cycleRow.theme_geral||'', trendsNotes:cycleRow.trends_notes||'',
    briefingText:cycleRow.briefing_text||'', briefingFileUrl:cycleRow.briefing_file_url||'', briefingFileName:cycleRow.briefing_file_name||'',
    entries: (entriesData||[]).map(mapEntryFromDB) };
}

async function carregarHistorico(){
  // pra saber o "último produto usado" de cada atleta, olhando todos os meses
  const { data } = await sb.from('entries').select('athlete_id, product, theme, post_date, format, cycles(ym)');
  const hist = {};
  (data||[]).forEach(r=>{
    const ym = r.cycles?.ym; if(!ym) return;
    if(!hist[r.athlete_id]) hist[r.athlete_id] = [];
    hist[r.athlete_id].push({ym, product:r.product, theme:r.theme, date:r.post_date, format:r.format});
  });
  Object.keys(hist).forEach(k=> hist[k].sort((a,b)=> a.date.localeCompare(b.date)));
  State.history = hist;
}
function lastEntryFor(athleteId, beforeYM){
  const h = State.history[athleteId] || [];
  const filtered = beforeYM ? h.filter(e=>e.ym < beforeYM) : h;
  return filtered.length ? filtered[filtered.length-1] : null;
}

/* ---------- algoritmo de agendamento ---------- */
function autoScheduleCycle(ym, activeSelections){
  const nDays = daysInMonth(ym);
  const byTeam = {};
  activeSelections.forEach(sel=>{
    const key = REAL_TEAMS.includes(sel.team) ? sel.team : ('AVULSO_'+sel.athleteId);
    (byTeam[key] = byTeam[key] || []).push(sel);
  });
  const groups = Object.values(byTeam);
  const interleaved = [];
  let idx = 0, more = true;
  while(more){
    more = false;
    for(const g of groups){ if(idx < g.length){ interleaved.push(g[idx]); more = true; } }
    idx++;
  }
  const n = interleaved.length;
  const entries = interleaved.map((sel, i)=>{
    const day = n<=1 ? 1 : Math.min(nDays, 1 + Math.round((i * (nDays-1)) / (n-1)));
    return { id: uid(), athleteId: sel.athleteId, team: sel.team, product: sel.product,
      theme: sel.theme, format: sel.format, date: dateFromDay(ym, day), roteiro: '',
      status: { postou:null, collab:null, obs:'', metrics:{views:'',likes:'',comments:'',shares:'',saves:''} } };
  });
  entries.sort((a,b)=> a.date.localeCompare(b.date));
  const lastDayByTeam = {};
  entries.forEach(e=>{
    if(!REAL_TEAMS.includes(e.team)) return;
    let day = Number(e.date.split('-')[2]);
    const last = lastDayByTeam[e.team];
    if(last !== undefined && day - last < 3){ day = Math.min(nDays, last + 3); e.date = dateFromDay(ym, day); }
    lastDayByTeam[e.team] = day;
  });
  entries.sort((a,b)=> a.date.localeCompare(b.date));
  return entries;
}

/* ---------- IA (Edge Functions) ---------- */
async function gerarRoteiroAtleta(entry, athlete, produto, temaGeral, trendsNotes, briefingText, exemplosBons, exemplosRuins, bibliotecaRefs){
  const histAnterior = lastEntryFor(athlete.id, entry.__ym);
  const { data, error } = await invocarFuncao('gerar-roteiro',
    { athlete, produto, entry, temaGeral, trendsNotes, briefingText, histAnterior, exemplosBons, exemplosRuins, bibliotecaRefs }
  );
  if(error) throw error;
  if(data?.error) throw new Error(data.error);
  if(!data?.roteiro) throw new Error('A IA não devolveu roteiro');
  return data.roteiro;
}
// Mostra o motivo real quando a geração falha (faixa na tela, não some sozinha)
function avisoErroIA(err, nome){
  console.error(err);
  const msg = String(err?.message || err || '');
  let texto = msg;
  if(err?.name === 'FunctionsFetchError' || /Failed to send a request/i.test(msg))
    texto = 'A função <code>gerar-roteiro</code> não respondeu. Confira se a versão nova está publicada no Supabase (Edge Functions).';
  else if(err?.name === 'FunctionsHttpError' || /non-2xx/i.test(msg))
    texto = 'A função <code>gerar-roteiro</code> falhou ao rodar (no Supabase aparece como erro 546/500). Publique a versão nova do arquivo <code>supabase/functions/gerar-roteiro/index.ts</code>.';
  else texto = escHtml(msg);
  mostrarFaixaErro(`Não deu pra gerar o roteiro${nome?` de ${escHtml(nome)}`:''}.`, texto + '<br><span style="font-size:12px; color:var(--muted);">Dica: na aba <strong>Contexto da IA → Prévia</strong> tem o botão <strong>Testar IA</strong>, que diz na hora se a chave e o modelo estão ok.</span>');
}

// Encaixa atletas NOVOS nos dias livres do mês, sem mexer em quem já está no calendário.
// Mesma regra do calendário automático: posts da mesma equipe com pelo menos 3 dias de distância.
function agendarNovos(ym, selecoes, existentes){
  const nDays = daysInMonth(ym), dias = existentes.map(e=>({team:e.team, dia:Number(e.date.slice(8,10))}));
  return selecoes.map(sel=>{
    const daEquipe = REAL_TEAMS.includes(sel.team);
    let melhor = 1, melhorNota = -Infinity;
    for(let d=1; d<=nDays; d++){
      const distEquipe = daEquipe ? Math.min(99, ...dias.filter(x=>x.team===sel.team).map(x=>Math.abs(x.dia-d))) : 99;
      const distTodos = Math.min(99, ...dias.map(x=>Math.abs(x.dia-d)));
      const nota = (distEquipe >= 3 ? 1000 : distEquipe*100) + Math.min(distTodos, 10)*10 - d*0.01;
      if(nota > melhorNota){ melhorNota = nota; melhor = d; }
    }
    dias.push({team:sel.team, dia:melhor});
    return { id: uid(), athleteId: sel.athleteId, team: sel.team, product: sel.product, theme: sel.theme, format: sel.format,
      date: dateFromDay(ym, melhor), roteiro: '', manual:false, status: { postou:null, collab:null, obs:'', metrics:{views:'',likes:'',comments:'',shares:'',saves:''} } };
  });
}
async function inserirEntradas(ym, novas){
  const cycle = await getOrCreateCycleDB(ym);
  if(!novas.length) return [];
  const rows = novas.map(e=>({ cycle_id:cycle.id, athlete_id:e.athleteId, team:e.team, product:e.product, theme:e.theme||'', format:e.format, post_date:e.date, roteiro:e.roteiro||'' }));
  const { data, error } = await sb.from('entries').insert(rows).select();
  if(error) throw error;
  return (data||[]).map(mapEntryFromDB);
}

async function salvarExemplo(entry, athlete, tipo, motivo){
  try{
    await sb.from('roteiro_exemplos').insert({ athlete_id: athlete?.id || null, team: entry.team, produto: entry.product,
      formato: entry.format, roteiro_text: entry.roteiro, tipo, motivo: motivo||'' });
  }catch(err){ console.error('Erro ao salvar exemplo', err); }
}
async function buscarExemplosBons(limit){
  const { data } = await sb.from('roteiro_exemplos').select('roteiro_text, team, produto, formato').eq('tipo', 'bom').order('created_at', {ascending:false}).limit(limit||3);
  return data || [];
}
async function buscarExemplosRuinsComMotivo(limit){
  const { data } = await sb.from('roteiro_exemplos').select('motivo').eq('tipo', 'ruim').not('motivo', 'eq', '').order('created_at', {ascending:false}).limit(limit||8);
  return data || [];
}
async function buscarReferenciasBiblioteca(limit){
  const { data } = await sb.from('roteiro_biblioteca').select('titulo, roteiro_text').order('created_at', {ascending:false}).limit(limit||2);
  return data || [];
}
async function gerarUmRoteiro(cycle, entryId, motivoRegeracao){
  const e = cycle.entries.find(x=>x.id===entryId);
  const a = State.athletes.find(x=>x.id===e.athleteId);
  const isSemProduto = e.product === 'Sem produto (tema livre)';
  const produto = isSemProduto ? {name:'__SEM_PRODUTO__', desc:''} : (State.products.find(p=>p.name===e.product) || {name:e.product, desc:''});
  if(!a) return;
  e.__ym = cycle.ym;
  // ao regerar, o texto anterior vira exemplo 👎 — menos se a equipe tinha curtido (👍)
  if(e.roteiro && e.roteiro.trim() && e.avaliacao !== 'bom' && !e.__semExemplo) await salvarExemplo(e, a, 'ruim', motivoRegeracao||'');
  if(e.avaliacao){ e.avaliacao = null; if(State.envioOk) await sb.from('entries').update({ avaliacao:null }).eq('id', e.id); }
  try{
    const exemplosBons = await buscarExemplosBons(3);
    const exemplosRuins = await buscarExemplosRuinsComMotivo(8);
    const bibliotecaRefs = await buscarReferenciasBiblioteca(2);
    e.roteiro = await gerarRoteiroAtleta(e, a, produto, cycle.themeGeral, cycle.trendsNotes, cycle.briefingText, exemplosBons, exemplosRuins, bibliotecaRefs);
  }catch(err){ avisoErroIA(err, a.name); }
  await persistOneEntry(cycle.ym, e);
}

/* ---------- markdown -> html (pra PDF) ---------- */
function markdownParaHtml(texto){
  const esc = (s)=> (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const linhas = texto.split('\n');
  let html = ''; let emLista = false;
  linhas.forEach(linhaOriginal=>{
    let linha = linhaOriginal.trim();
    if(!linha){ if(emLista){ html += '</ul>'; emLista=false; } return; }
    if(/^-{3,}$/.test(linha)){ if(emLista){html+='</ul>'; emLista=false;} html += '<hr>'; return; }
    let m;
    if((m = linha.match(/^###\s+(.*)/))){ if(emLista){html+='</ul>'; emLista=false;} html += `<h3>${esc(m[1])}</h3>`; return; }
    if((m = linha.match(/^##\s+(.*)/))){ if(emLista){html+='</ul>'; emLista=false;} html += `<h3>${esc(m[1])}</h3>`; return; }
    if((m = linha.match(/^#\s+(.*)/))){ if(emLista){html+='</ul>'; emLista=false;} html += `<h2>${esc(m[1])}</h2>`; return; }
    if((m = linha.match(/^[-*]\s+(.*)/))){ if(!emLista){ html += '<ul>'; emLista = true; } html += `<li>${aplicarNegrito(esc(m[1]))}</li>`; return; }
    if(/^\d+\.\s+/.test(linha)){ if(!emLista){ html += '<ul>'; emLista = true; } html += `<li>${aplicarNegrito(esc(linha.replace(/^\d+\.\s+/,'')))}</li>`; return; }
    if(emLista){ html += '</ul>'; emLista = false; }
    html += `<p>${aplicarNegrito(esc(linha))}</p>`;
  });
  if(emLista) html += '</ul>';
  return html;
}
function aplicarNegrito(s){ return s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>'); }

  if(!gerados.length){ toast(`Nenhum roteiro gerado ainda pra ${groupLabel}`); return; }
  const w = window.open('', '_blank');
  const esc = (s)=> (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const blocks = gerados.map(e=>{
    const a = State.athletes.find(x=>x.id===e.athleteId);
    return `<div class="roteiro-block"><div class="cabecalho"><h2>${esc(a?a.name:'—')} <span class="team">${esc(e.team)}</span></h2>
      <div class="meta">${e.date.split('-').reverse().join('/')} · ${esc(e.product)} · ${esc(e.format)}</div></div>
      <div class="conteudo">${markdownParaHtml(e.roteiro)}</div></div>`;
  }).join('<div class="pagebreak"></div>');
  w.document.write(`<html><head><title>CRONOGRAMA_${filenameSlug}_${cycle.ym}_FOURLAB</title>
    <style>
      body{font-family:'Segoe UI',Arial,Helvetica,sans-serif; color:#1a1315; padding:36px; max-width:760px; margin:0 auto; font-size:13px; line-height:1.55;}
      h1{color:#731b58; font-size:21px; margin-bottom:2px;}
      .subtitle{color:#8a7c72; font-size:12px; margin-bottom:34px; text-transform:uppercase; letter-spacing:0.4px;}
      .roteiro-block{margin-bottom:10px;}
      .cabecalho{border-bottom:2px solid #fdcc03; padding-bottom:8px; margin-bottom:14px;}
      .roteiro-block h2{color:#e96709; font-size:17px; margin:0 0 2px 0;}
      .roteiro-block .team{color:#731b58; font-size:11px; font-weight:normal; margin-left:8px;}
      .meta{color:#8a7c72; font-size:11px;}
      .conteudo h2{color:#731b58; font-size:14px; margin:16px 0 4px 0; text-transform:uppercase; letter-spacing:0.3px;}
      .conteudo h3{color:#e96709; font-size:12.5px; margin:14px 0 4px 0; text-transform:uppercase; letter-spacing:0.3px;}
      .conteudo p{margin:0 0 8px 0;} .conteudo ul{margin:0 0 10px 0; padding-left:20px;} .conteudo li{margin-bottom:4px;}
      .conteudo hr{border:none; border-top:1px solid #e8ded3; margin:14px 0;}
      .pagebreak{page-break-before:always;} @media print{ body{padding:0;} }
    </style></head><body>
      <h1>Cronograma de Roteiros — FourLab</h1>
      <div class="subtitle">${groupLabel} · ${fmtMonthLabel(cycle.ym)} · ${gerados.length} roteiro(s)</div>
      ${blocks}
      <script>window.onload = ()=> window.print();<\/script>
    </body></html>`);
  w.document.close();
}

function pdfExportChoicesHtml(cycle){
  const byTeam = {};
  cycle.entries.forEach(e=>{ if(e.roteiro && e.roteiro.trim() && REAL_TEAMS.includes(e.team)) (byTeam[e.team] = byTeam[e.team] || []).push(e); });
  const avulsosPorAtleta = {};
  cycle.entries.forEach(e=>{ if(e.roteiro && e.roteiro.trim() && !REAL_TEAMS.includes(e.team)) (avulsosPorAtleta[e.athleteId] = avulsosPorAtleta[e.athleteId] || []).push(e); });
  let html = `<button class="modal-close" id="modalCloseBtn">&times;</button><h3>Exportar PDF</h3>
    <div style="font-size:12.5px; color:var(--muted); margin-bottom:14px;">Um PDF por equipe, e um PDF por atleta avulso.</div>
    <div class="section-title">Equipes</div>`;
  REAL_TEAMS.forEach(team=>{
    const list = byTeam[team] || [];
    html += `<div class="row" style="justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line);">
      <span><span class="badge team-${team}">${team}</span> ${list.length} roteiro(s) prontos</span>
      <button class="btn btn-outline btn-sm" data-pdf-team="${team}" ${!list.length?'disabled':''}>Gerar PDF</button></div>`;
  });
  html += `<div class="section-title">Avulsos</div>`;
  Object.keys(avulsosPorAtleta).forEach(athleteId=>{
    const list = avulsosPorAtleta[athleteId];
    const a = State.athletes.find(x=>x.id===athleteId);
    html += `<div class="row" style="justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line);">
      <span>${a?a.name:'(removido)'} — ${list.length} roteiro(s) prontos</span>
      <button class="btn btn-outline btn-sm" data-pdf-avulso="${athleteId}">Gerar PDF</button></div>`;
  });
  if(!Object.keys(avulsosPorAtleta).length) html += `<div style="color:var(--muted); font-size:12px;">Nenhum avulso com roteiro gerado ainda.</div>`;
  return html;
}
function openPDFExportModal(cycle){
  openModal(pdfExportChoicesHtml(cycle));
  document.getElementById('modalCloseBtn').onclick = closeModal;
  document.querySelectorAll('[data-pdf-team]').forEach(btn=>{
    btn.onclick = ()=>{ const team = btn.dataset.pdfTeam; exportPDFGroup(cycle, `Equipe ${team}`, cycle.entries.filter(e=>e.team===team), team.toUpperCase()); };
  });
  document.querySelectorAll('[data-pdf-avulso]').forEach(btn=>{
    btn.onclick = ()=>{
      const athleteId = btn.dataset.pdfAvulso;
      const a = State.athletes.find(x=>x.id===athleteId);
      exportPDFGroup(cycle, a?a.name:'Avulso', cycle.entries.filter(e=>e.athleteId===athleteId), (a?a.name:'avulso').toUpperCase().replace(/\s+/g,'_'));
    };
  });
}

async function apagarTudoDoMes(cycle){
  if(!confirm(`Apagar TODOS os ${cycle.entries.length} posts agendados de ${fmtMonthLabel(cycle.ym)}? Isso não afeta o histórico salvo no banco de exemplos, só o calendário deste mês. Não tem como desfazer.`)) return false;
  try{
    if(cycle.id) await sb.from('entries').delete().eq('cycle_id', cycle.id);
    cycle.entries = [];
    await carregarHistorico();
    toast('Mês apagado');
    return true;
  }catch(err){ console.error(err); toast('Erro ao apagar — veja o console (F12)'); return false; }
}

/* ---------- render ---------- */
// Roteiro curtido (👍) que sumiu do post na versão antiga — dá pra trazer de volta
function roteiroCurtidoPara(e){
  if(e.roteiro && e.roteiro.trim()) return null;
  return State.curtidos.find(x=> x.athlete_id===e.athleteId && x.produto===e.product && (!x.formato || x.formato===e.format)) || null;
}
function renderEntriesList(cycle){
  const pendentes = cycle.entries.filter(e=> !e.enviadoEm);
  const enviados = cycle.entries.filter(e=> e.enviadoEm);
  const cards = pendentes.map(e=>{
    const a = State.athletes.find(x=>x.id===e.athleteId), curtido = roteiroCurtidoPara(e);
    return `<div data-entry-card="${e.id}" style="border:1px solid ${e.roteiro?'#f8d6ba':'var(--line)'};border-radius:14px;padding:12px 14px;margin-top:10px;${e.roteiro?'background:#fffaf5;':''}">
      <div class="row" style="justify-content:space-between;">
        <div class="row" style="gap:8px;">
          ${teamBadge(e.team)}
          <strong>${a?escHtml(a.name):'(removido)'}</strong>
          <span style="color:var(--muted);font-size:12px;">${weekdayShort(e.date)} ${e.date.split('-').reverse().join('/')} · ${escHtml(e.product)} · ${escHtml(e.format)}</span>
          ${e.manual ? '<span class="chip static" style="color:var(--purple);">✍️ Manual</span>' : ''}
          ${e.roteiro ? '<span class="chip static" style="color:#b5680a;">Rascunho — o atleta ainda não vê</span>' : ''}
          ${e.produtoMudou ? '<span class="chip static" style="color:var(--red);">Produto/formato mudou — clique em Regerar</span>' : ''}
        </div>
        <div class="row" style="gap:6px;">
          <button class="btn btn-ghost btn-sm" data-editar-post="${e.id}">Editar post</button>
          <button class="btn btn-outline btn-sm" data-gen-one="${e.id}">${e.roteiro?'Regerar':'Gerar'}</button>
          ${e.roteiro?`<button class="btn btn-ghost btn-sm" data-copy="${e.id}">Copiar</button>`:''}
          ${e.roteiro?`<button class="btn ${e.avaliacao==='bom'?'btn-dark':'btn-ghost'} btn-sm" data-mark-bom="${e.id}" title="Bom exemplo pra IA aprender (o roteiro continua aqui)">${e.avaliacao==='bom'?'👍 Curtido':'👍'}</button>`:''}
          ${e.roteiro?`<button class="btn btn-ghost btn-sm" data-mark-ruim="${e.id}" title="Descartar (ruim)">👎</button>`:''}
          ${e.roteiro?`<button class="btn btn-primary btn-sm" data-enviar="${e.id}">Enviar pro atleta ✓</button>`:''}
        </div>
      </div>
      ${e.roteiro ? `<textarea style="margin-top:10px;min-height:200px;font-size:12.5px;line-height:1.5;" data-roteiro-edit="${e.id}">${escHtml(e.roteiro)}</textarea>

        : `<div style="color:var(--muted);font-size:12px;margin-top:8px;">Roteiro ainda não gerado.${curtido ? ` <button class="btn btn-ghost btn-sm" data-recuperar="${e.id}" style="margin-left:6px;">↩︎ Recuperar o roteiro que você curtiu (${new Date(curtido.created_at).toLocaleDateString('pt-BR')})</button>` : ''}</div>`}
    </div>`;
  }).join('');
  const resumoEnviados = enviados.length ? `<div style="margin-top:14px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; background:var(--green-soft); border-radius:14px; padding:12px 16px; font-size:13px; color:var(--green);">
      <strong>✓ ${enviados.length} roteiro(s) já enviado(s) pros atletas</strong>
      <span style="color:var(--ink-2); flex:1; min-width:200px;">${enviados.map(e=> escHtml(athleteName(e.athleteId).split(' ')[0])).join(', ')}. Pra ver ou editar, abra <a href="gestao-acompanhamento.html" style="color:var(--orange); font-weight:700;">Acompanhamento</a> ou a pasta do atleta.</span>
      ${enviados.some(e=>e.alteradoAtletaEm||e.alteradoEquipeEm) ? `<span class="chip static" style="color:var(--purple);">✏️ ${enviados.filter(e=>e.alteradoAtletaEm||e.alteradoEquipeEm).length} alterado(s)</span>` : ''}</div>` : '';
  return (pendentes.length ? cards : '<div class="empty-state" style="padding:22px;">Todos os roteiros deste mês já foram enviados. 🎉</div>') + resumoEnviados;
}

// "Re-check" antes de enviar: mostra como o atleta vai ver e pede confirmação
function abrirEnvio(ids){
  const cycle = getOrCreateCycle(State.currentCycleYM);
  const lista = ids.map(id=> cycle.entries.find(x=>x.id===id)).filter(e=> e && e.roteiro && e.roteiro.trim());
  if(!lista.length){ toast('Nenhum roteiro pronto pra enviar'); return; }
  const um = lista.length === 1, e0 = lista[0];
  openModal(`<button class="modal-close" id="modalCloseBtn">&times;</button>
    <h3>${um ? `Enviar roteiro pra ${escHtml(athleteName(e0.athleteId))}?` : `Enviar ${lista.length} roteiros pros atletas?`}</h3>
    ${um ? `<div style="font-size:12.5px; color:var(--muted); margin:-8px 0 10px;">${fmtDateBR(e0.date)} · ${escHtml(e0.product)} · ${escHtml(e0.format)} — é assim que o atleta vai ver:</div>
      <div style="max-height:46vh; overflow-y:auto; border:1px solid var(--line); border-radius:14px; padding:14px 16px; font-size:13px; line-height:1.55;">${textoRicoHtml(e0.roteiro)}</div>`
      : `<div style="max-height:46vh; overflow-y:auto;">${lista.map(e=>`<div style="display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid #f3eee8; font-size:13px;">
          <strong>${escHtml(athleteName(e.athleteId))}</strong><span style="color:var(--muted);">${fmtDateBR(e.date)} · ${escHtml(e.product)} · ${contarPalavras(e.roteiro)} palavras</span></div>`).join('')}</div>`}
    <label style="display:flex; gap:8px; align-items:center; margin:14px 0 4px; font-size:13px; cursor:pointer; text-transform:none; letter-spacing:0; color:var(--ink);">
      <input type="checkbox" id="envioRevisado" style="width:18px; height:18px;"> ${um ? 'Revisei o roteiro e está pronto' : 'Revisei todos e estão prontos'}</label>
    <div style="font-size:11.5px; color:var(--muted); margin-bottom:12px;">Depois de enviado, o roteiro aparece pro atleta e sai desta lista. Ainda dá pra editar em Acompanhamento ou na pasta do atleta — fica marcado como “alterado”.</div>
    <div class="row" style="justify-content:flex-end; gap:8px;"><button class="btn btn-ghost" id="envioVoltar">Voltar e revisar</button>
      <button class="btn btn-primary" id="envioConfirmar" disabled>✓ Enviar${um?'':` os ${lista.length}`}</button></div>`, {largo:!um ? false : true});
  document.getElementById('modalCloseBtn').onclick = closeModal;
  document.getElementById('envioVoltar').onclick = closeModal;
  const chk = document.getElementById('envioRevisado'), ok = document.getElementById('envioConfirmar');
  chk.onchange = ()=>{ ok.disabled = !chk.checked; };
  ok.onclick = async ()=>{
    if(!State.envioOk){ erroBanco({message:'column entries.enviado_em does not exist', code:'PGRST204'}, MIGRACAO_ENVIO); return; }
    ok.disabled = true; ok.innerHTML = '<span class="loader"></span> Enviando…';
    const agora = new Date().toISOString();
    for(const e of lista){
      const { error } = await sb.from('entries').update({ roteiro:e.roteiro, enviado_em:agora, roteiro_enviado:e.roteiro, alterado_equipe_em:null, alterado_atleta_em:null }).eq('id', e.id);
      if(error){ erroBanco(error, MIGRACAO_ENVIO); render(); return; }
      Object.assign(e, { enviadoEm:agora, roteiroEnviado:e.roteiro, alteradoEquipeEm:null, alteradoAtletaEm:null });
    }
    closeModal(); toast(um ? `Enviado pra ${athleteName(e0.athleteId).split(' ')[0]} ✓` : `${lista.length} roteiros enviados ✓`); render();
  };
}

function viewCiclo(){

    <div class="field" style="margin-top:12px;"><label>Tema geral do mês (opcional)</label>

  <div class="panel"><div class="row" style="justify-content:space-between;">

      <div class="row" style="gap:12px;">

          <input type="checkbox" id="selectAllAthletes" style="width:auto;"> Selecionar todos</label></div></div>
      ${State.comprasOk && Object.keys(State.cuponsCompras).length ? '<div style="font-size:12px; color:var(--muted); margin-top:6px;">🛒 Embaixo do produto aparecem os itens que o atleta mais pediu na Yampi. Clique num deles pra escolher esse produto.</div>' : ''}`;

      const checked = existing ? 'checked' : '';

        <td><input type="checkbox" class="selAthlete" data-athlete="${a.id}" data-team="${team}" ${checked}></td>
        <td><strong>${a.name}</strong>${existing?`<div style="font-size:11px;color:var(--green);font-weight:700;">📅 no calendário: ${fmtDateBR(existing.date).slice(0,5)}${existing.enviadoEm?' · enviado':''}</div>`:''}${last?`<div style="font-size:11px;color:var(--muted);">último: ${last.product}</div>`:''}</td>
        <td><select class="selProduct" data-athlete="${a.id}">
          <option value="__SEM_PRODUTO__" ${existing&&existing.product==='Sem produto (tema livre)'?'selected':''}>— Sem produto (tema livre) —</option>
          ${State.products.map(p=>`<option value="${p.id}" ${existing&&existing.product===p.name?'selected':''}>${p.name}</option>`).join('')}

        <td><input class="selTheme" data-athlete="${a.id}" placeholder="livre / deixa a IA decidir" value="${existing?existing.theme.replace(/"/g,'&quot;'):''}"></td>

        : 'Distribui as datas dos selecionados respeitando o espaçamento por equipe.'}</span>

      ${temCalendario ? '<button class="btn btn-ghost btn-sm" id="btnRefazerCalendario" style="color:var(--red);">Refazer calendário do zero</button>' : ''}</div></div>`;

  if(hasEntries){
    const faltam = cycle.entries.filter(e=> !e.enviadoEm && !(e.roteiro||'').trim()).length;

    html += `<div class="panel"><div class="row" style="justify-content:space-between;">

          <button class="btn btn-ghost" id="btnPostManual2">✍️ Post manual</button>

          <button class="btn btn-outline" id="btnExportarPDF">📄 Exportar PDF</button>
          ${faltam ? `<button class="btn btn-primary" id="btnGerarTodosRoteiros">2. Gerar os que faltam (${faltam})</button>` : ''}
          ${rascunhos ? `<button class="btn btn-dark" id="btnEnviarTodos">3. Enviar pros atletas (${rascunhos})</button>` : ''}
          <button class="btn btn-danger" id="btnCancelarGeracao" style="display:none;">Cancelar</button>
        </div></div>
      <div id="entriesList">${renderEntriesList(cycle)}</div></div>`;
  }
  return html;

function wireEntriesList(){
  document.querySelectorAll('[data-gen-one]').forEach(btn=>{
    btn.onclick = async ()=>{
      const cycle = getOrCreateCycle(State.currentCycleYM);
      btn.disabled = true; btn.innerHTML = '<span class="loader"></span> Gerando…';
      // aviso no próprio card enquanto a IA escreve (pode levar até ~1 min)
      const card = btn.closest('[data-entry-card]') || btn.parentElement;
      if(card && !card.querySelector('.gerando-aviso')) card.insertAdjacentHTML('beforeend', '<div class="gerando-aviso" style="font-size:12px; color:var(--muted); margin-top:8px; width:100%;">A IA está escrevendo o roteiro… pode levar até 1 minuto.</div>');
      await gerarUmRoteiro(cycle, btn.dataset.genOne);
      render();
    };
  });
  document.querySelectorAll('[data-copy]').forEach(btn=>{
    btn.onclick = ()=>{
      const ta = document.querySelector(`[data-roteiro-edit="${btn.dataset.copy}"]`);
      navigator.clipboard.writeText(ta.value).then(()=> toast('Roteiro copiado'));
    };
  });
  document.querySelectorAll('[data-mark-bom]').forEach(btn=>{
    btn.onclick = async ()=>{
      const cycle = getOrCreateCycle(State.currentCycleYM);
      const e = cycle.entries.find(x=>x.id===btn.dataset.markBom);
      const a = State.athletes.find(x=>x.id===e.athleteId);
      if(e.avaliacao === 'bom'){ toast('Já está como bom exemplo. Agora é só enviar pro atleta.'); return; }
      const ta = document.querySelector(`[data-roteiro-edit="${e.id}"]`); if(ta) e.roteiro = ta.value;
      await salvarExemplo(e, a, 'bom');
      e.avaliacao = 'bom';
      if(State.envioOk) await sb.from('entries').update({ roteiro:e.roteiro, avaliacao:'bom' }).eq('id', e.id);
      else await persistOneEntry(State.currentCycleYM, e);
      toast('👍 Guardado como bom exemplo pra IA — o roteiro continua aqui pra você enviar');
      render();
    };
  });
  document.querySelectorAll('[data-mark-ruim]').forEach(btn=>{
    btn.onclick = ()=>{
      const cycle = getOrCreateCycle(State.currentCycleYM);
      const e = cycle.entries.find(x=>x.id===btn.dataset.markRuim);
      const a = State.athletes.find(x=>x.id===e.athleteId);
      openModal(`<button class="modal-close" id="modalCloseBtn">&times;</button><h3>Reprovar roteiro</h3>
        <div style="font-size:12.5px; color:var(--muted); margin-bottom:12px;">O que não gostou? (opcional). Isso ajuda a IA a não repetir o mesmo erro.</div>
        <div class="field"><textarea id="motivoRuim" style="min-height:110px;" placeholder="Ex: soou muito artificial..."></textarea></div>
        <div class="row" style="justify-content:flex-end; gap:8px;">
          <button class="btn btn-ghost btn-sm" id="btnDescartarSemMotivo">Descartar sem motivo</button>
          <button class="btn btn-primary btn-sm" id="btnDescartarComMotivo">Descartar</button></div>`);
      document.getElementById('modalCloseBtn').onclick = closeModal;
      const confirmar = async (motivo)=>{
        await salvarExemplo(e, a, 'ruim', motivo);
        e.roteiro = '';
        await persistOneEntry(State.currentCycleYM, e);
        closeModal(); toast('Descartado — arquivado no banco do atleta'); render();
      };
      document.getElementById('btnDescartarSemMotivo').onclick = ()=> confirmar('');
      document.getElementById('btnDescartarComMotivo').onclick = ()=> confirmar(document.getElementById('motivoRuim').value.trim());
    };
  });
  document.querySelectorAll('[data-enviar]').forEach(btn=>{
    btn.onclick = async ()=>{
      const cycle = getOrCreateCycle(State.currentCycleYM), e = cycle.entries.find(x=>x.id===btn.dataset.enviar);
      const ta = document.querySelector(`[data-roteiro-edit="${e.id}"]`);
      if(ta && ta.value !== e.roteiro){ e.roteiro = ta.value; await persistOneEntry(State.currentCycleYM, e); }
      abrirEnvio([e.id]);
    };
  });
  document.querySelectorAll('[data-recuperar]').forEach(btn=>{
    btn.onclick = async ()=>{
      const cycle = getOrCreateCycle(State.currentCycleYM), e = cycle.entries.find(x=>x.id===btn.dataset.recuperar);
      const c = roteiroCurtidoPara(e); if(!c) return;
      e.roteiro = c.roteiro_text; e.avaliacao = 'bom';
      await persistOneEntry(State.currentCycleYM, e);
      if(State.envioOk) await sb.from('entries').update({ avaliacao:'bom' }).eq('id', e.id);
      toast('Roteiro recuperado — revise e envie pro atleta'); render();
    };
  });
  document.querySelectorAll('[data-roteiro-edit]').forEach(ta=>{
    ta.onchange = async ()=>{
      const cycle = getOrCreateCycle(State.currentCycleYM);
      const e = cycle.entries.find(x=>x.id===ta.dataset.roteiroEdit);
      if(e){ e.roteiro = ta.value; await persistOneEntry(State.currentCycleYM, e); }
    };
  });
  document.querySelectorAll('[data-editar-post]').forEach(btn=>{
    btn.onclick = ()=> abrirEditarPost(btn.dataset.editarPost);
  });
}

// Editar UM post: data, produto, formato, tema. Não mexe em nenhum outro atleta.
function abrirEditarPost(id){
  const cycle = getOrCreateCycle(State.currentCycleYM);
  const e = cycle.entries.find(x=>x.id===id); if(!e) return;
  const formatos = [...new Set(['Vídeo','Carrossel', ...FORMATOS_MANUAIS, e.format].filter(Boolean))];
  openModal(`<button class="modal-close" id="modalCloseBtn">&times;</button><h3>Editar post — ${escHtml(athleteName(e.athleteId))}</h3>
    <div style="font-size:12.5px; color:var(--muted); margin:-8px 0 12px;">Muda só este post. Os outros atletas e datas continuam iguais.</div>
    <div class="grid-2" style="gap:12px;">
      <div class="field"><label>Data</label><input type="date" id="epData" value="${e.date}"></div>
      <div class="field"><label>Formato</label><select id="epFormato">${formatos.map(f=>`<option ${f===e.format?'selected':''}>${f}</option>`).join('')}</select></div></div>
    <div class="field"><label>Produto</label><select id="epProduto"><option value="${SEM_PRODUTO}" ${e.product===SEM_PRODUTO?'selected':''}>— ${SEM_PRODUTO} —</option>
      ${State.products.map(p=>`<option ${p.name===e.product?'selected':''}>${escHtml(p.name)}</option>`).join('')}${e.product && e.product!==SEM_PRODUTO && !State.products.some(p=>p.name===e.product) ? `<option selected>${escHtml(e.product)}</option>` : ''}</select>
      ${State.compras[e.athleteId] ? `<div style="margin-top:6px;">${comprasChipsHtml(State.compras[e.athleteId], {produtos:State.products})}</div>` : ''}</div>
    <div class="field"><label>Tema / instrução pra IA</label><textarea id="epTema" style="min-height:70px;" placeholder="Ex: ele tem parceria com a Liquidz — falar só do gel em sachê">${escHtml(e.theme||'')}</textarea></div>
    ${e.roteiro && !e.enviadoEm ? `<label style="display:flex; gap:8px; align-items:center; font-size:13px; cursor:pointer; text-transform:none; letter-spacing:0; color:var(--ink); margin-bottom:10px;"><input type="checkbox" id="epRegerar" style="width:18px;height:18px;"> Regerar o roteiro com essas mudanças</label>` : ''}
    ${e.enviadoEm ? '<div style="font-size:12px; background:var(--orange-soft); border-radius:12px; padding:10px 12px; margin-bottom:10px;">Este roteiro já foi enviado. Mudar o produto aqui não muda o texto que o atleta tem — pra isso, abra o roteiro em Acompanhamento.</div>' : ''}
    <div class="row" style="justify-content:space-between;">
      <button class="btn btn-danger btn-sm" id="epRemover">Remover do mês</button>
      <button class="btn btn-primary" id="epSalvar">Salvar</button></div>`);
  document.getElementById('modalCloseBtn').onclick = closeModal;
  const regerarChk = document.getElementById('epRegerar');
  const marcarRegerar = ()=>{ if(!regerarChk) return; regerarChk.checked = document.getElementById('epProduto').value !== e.product || document.getElementById('epFormato').value !== e.format; };
  document.getElementById('epProduto').onchange = marcarRegerar; document.getElementById('epFormato').onchange = marcarRegerar;
  document.getElementById('epSalvar').onclick = async (ev)=>{
    const novo = { date:document.getElementById('epData').value, product:document.getElementById('epProduto').value, format:document.getElementById('epFormato').value, theme:document.getElementById('epTema').value.trim() };
    if(!novo.date){ toast('Escolha a data'); return; }
    const mudouBase = novo.product !== e.product || novo.format !== e.format;
    Object.assign(e, novo);
    const btn = ev.currentTarget; btn.disabled = true; btn.innerHTML = '<span class="loader"></span> Salvando…';
    await persistOneEntry(State.currentCycleYM, e);
    cycle.entries.sort((x,y)=> x.date.localeCompare(y.date));
    if(regerarChk && regerarChk.checked){
      btn.innerHTML = '<span class="loader"></span> Regerando o roteiro…';
      e.__semExemplo = true;   // o texto antigo não era ruim — só mudou o produto/formato
      await gerarUmRoteiro(cycle, e.id); e.__semExemplo = false; e.produtoMudou = false;
    } else if(mudouBase && e.roteiro && !e.enviadoEm) e.produtoMudou = true;
    closeModal(); toast('Post atualizado'); render();
  };
  document.getElementById('epRemover').onclick = async ()=>{
    if(!confirm(e.enviadoEm ? 'Este roteiro já foi enviado — o atleta deixa de ver. Remover este post do mês?' : 'Remover este post do mês? Os outros não mudam.')) return;
    const { error } = await sb.from('entries').delete().eq('id', e.id);
    if(error){ erroBanco(error); return; }
    cycle.entries = cycle.entries.filter(x=>x.id!==e.id); await carregarHistorico();
    closeModal(); toast('Post removido'); render();
  };
}

function wireCicloView(){
  document.querySelectorAll('[data-usar-produto]').forEach(b=> b.onclick = ()=>{
    const sel = document.querySelector(`.selProduct[data-athlete="${b.dataset.atletaCompra}"]`);
    if(sel){ sel.value = b.dataset.usarProduto; const chk = document.querySelector(`.selAthlete[data-athlete="${b.dataset.atletaCompra}"]`); if(chk) chk.checked = true; toast('Produto escolhido'); }
  });
  const btnCompras = document.getElementById('btnAtualizarCompras');
  if(btnCompras) btnCompras.onclick = async ()=>{
    btnCompras.disabled = true; btnCompras.innerHTML = '<span class="loader" style="border-top-color:var(--orange);border-color:rgba(0,0,0,0.1);"></span> Buscando na Yampi… (pode levar 1 min)';
    // guarda o que foi escolhido na tela pra não perder ao redesenhar
    const escolhas = [...document.querySelectorAll('.selAthlete')].map(c=>({id:c.dataset.athlete, on:c.checked, prod:document.querySelector(`.selProduct[data-athlete="${c.dataset.athlete}"]`)?.value,
      tema:document.querySelector(`.selTheme[data-athlete="${c.dataset.athlete}"]`)?.value, fmt:document.querySelector(`.selFormat[data-athlete="${c.dataset.athlete}"]`)?.value}));
    try{
      const r = await atualizarComprasYampi(Object.keys(State.cuponsCompras));
      (r.resultados||[]).forEach(x=> State.compras[x.athlete_id] = x);
      toast(`Compras atualizadas — ${r.pedidosLidos} pedidos lidos na Yampi`);
    }catch(err){ mostrarFaixaErro('Não consegui buscar na Yampi.', escHtml(err.message)); }
    render();
    escolhas.forEach(e=>{ const q = (cls)=> document.querySelector(`.${cls}[data-athlete="${e.id}"]`);
      if(q('selAthlete')) q('selAthlete').checked = e.on; if(q('selProduct') && e.prod) q('selProduct').value = e.prod;
      if(q('selTheme') && e.tema != null) q('selTheme').value = e.tema; if(q('selFormat') && e.fmt) q('selFormat').value = e.fmt; });
  };
  const selectAll = document.getElementById('selectAllAthletes');
  if(selectAll) selectAll.onchange = ()=> document.querySelectorAll('.selAthlete').forEach(chk=> chk.checked = selectAll.checked);

  document.getElementById('cycleMonth').onchange = async (e)=>{
    State.currentCycleYM = e.target.value;
    document.getElementById('main').innerHTML = `<div class="empty-state"><span class="loader"></span></div>`;
    await carregarMes(State.currentCycleYM);
    render();
  };

  document.getElementById('temaGeral').onchange = async (e)=>{
    const cycle = getOrCreateCycle(State.currentCycleYM);
    cycle.themeGeral = e.target.value;
    await persistCycleMeta(State.currentCycleYM);
  };

  const lerSelecoes = ()=> Array.from(document.querySelectorAll('.selAthlete:checked')).map(chk=>{
    const athleteId = chk.dataset.athlete, team = chk.dataset.team;
    const prodSel = document.querySelector(`.selProduct[data-athlete="${athleteId}"]`);
    const isSemProduto = prodSel.value === '__SEM_PRODUTO__';
    const productObj = isSemProduto ? null : State.products.find(p=>p.id===prodSel.value);
    return { athleteId, team, product: isSemProduto ? SEM_PRODUTO : (productObj ? productObj.name : ''),
      theme: document.querySelector(`.selTheme[data-athlete="${athleteId}"]`).value.trim(), format: document.querySelector(`.selFormat[data-athlete="${athleteId}"]`).value };
  });

  document.getElementById('btnGerarCalendario').onclick = async (ev)=>{
    const ym = State.currentCycleYM, cycle = getOrCreateCycle(ym);
    const selections = lerSelecoes();
    if(!selections.length){ toast('Marque ao menos um atleta'); return; }
    const noCalendario = cycle.entries.filter(e=> !e.manual);
    if(!noCalendario.length){ await refazerCalendario(selections, true); return; }
    // Incremental: só entra quem ainda não está no mês; ninguém que já está muda de data, produto ou roteiro
    const novos = selections.filter(s=> !noCalendario.some(e=> e.athleteId===s.athleteId));
    if(!novos.length){ toast('Todos os marcados já estão no calendário. Pra mudar produto ou data de alguém, use “Editar post” no card dele.'); return; }
    const btn = ev.currentTarget; btn.disabled = true; btn.innerHTML = '<span class="loader"></span> Adicionando…';
    try{
      cycle.themeGeral = document.getElementById('temaGeral').value; await persistCycleMeta(ym);
      const criadas = await inserirEntradas(ym, agendarNovos(ym, novos, cycle.entries));
      cycle.entries = [...cycle.entries, ...criadas].sort((x,y)=> x.date.localeCompare(y.date));
      await carregarHistorico();
      toast(`${criadas.length} atleta(s) adicionado(s) — os outros não mudaram`);
    }catch(err){ erroBanco(err); }
    render();
  };
  // Refazer do zero: redistribui as datas de todos (mantém o roteiro de quem continua com o mesmo produto e formato)
  async function refazerCalendario(selections, primeiraVez){
    const ym = State.currentCycleYM, cycle = getOrCreateCycle(ym);
    const antigos = cycle.entries.filter(e=> !e.manual), manuais = cycle.entries.filter(e=> e.manual);
    const novos = autoScheduleCycle(ym, selections).map(n=>{
      const o = antigos.find(x=> x.athleteId===n.athleteId && x.product===n.product && x.format===n.format && ((x.roteiro||'').trim() || x.enviadoEm));
      return o ? {...o, id:n.id, date:n.date, theme:n.theme} : n;
    });
    if(!primeiraVez){
      const perdidos = antigos.filter(o=> (o.enviadoEm || (o.roteiro||'').trim()) && !novos.some(n=> n.athleteId===o.athleteId && n.roteiro===o.roteiro));
      if(!confirm(`Refazer o calendário do zero muda as datas de TODOS os atletas marcados.${perdidos.length ? `\n\n${perdidos.length} roteiro(s) vão ser apagados (${perdidos.map(o=>athleteName(o.athleteId)).join(', ')}).` : ''}\n\nPosts manuais não são mexidos. Continuar?`)) return;
    }
    cycle.entries = [...novos, ...manuais];
    cycle.themeGeral = document.getElementById('temaGeral').value;
    await persistCycleMeta(ym);
    await persistCycleEntries(ym);
    toast('Calendário gerado');
    render();
  }
  const refazer = document.getElementById('btnRefazerCalendario');
  if(refazer) refazer.onclick = ()=>{ const sel = lerSelecoes(); if(!sel.length){ toast('Marque ao menos um atleta'); return; } refazerCalendario(sel, false); };
  const abrirManual = ()=> abrirPostManual({ atletas:State.athletes, produtos:State.products, data: State.currentCycleYM === monthKey(todayISO()) ? todayISO() : State.currentCycleYM+'-01',
    onCriado:(linha)=>{ if(String(linha.post_date).slice(0,7) === State.currentCycleYM){ const c = getOrCreateCycle(State.currentCycleYM); if(!c.id) c.id = linha.cycle_id; c.entries.push(mapEntryFromDB(linha)); c.entries.sort((x,y)=> x.date.localeCompare(y.date)); } render(); } });
  ['btnPostManual','btnPostManual2'].forEach(id=>{ const b = document.getElementById(id); if(b) b.onclick = abrirManual; });

  wireEntriesList();

  const btnExportPDF = document.getElementById('btnExportarPDF');
  if(btnExportPDF) btnExportPDF.onclick = ()=> openPDFExportModal(getOrCreateCycle(State.currentCycleYM));

  const btnApagarMes = document.getElementById('btnApagarMes');
  if(btnApagarMes) btnApagarMes.onclick = async ()=>{ const ok = await apagarTudoDoMes(getOrCreateCycle(State.currentCycleYM)); if(ok) render(); };

  const btnGerarTodos = document.getElementById('btnGerarTodosRoteiros');
  const btnCancelar = document.getElementById('btnCancelarGeracao');
  if(btnGerarTodos){
    btnGerarTodos.onclick = async ()=>{
      const cycle = getOrCreateCycle(State.currentCycleYM);
      btnGerarTodos.disabled = true;
      State.cancelGeracao = false;
      if(btnCancelar) btnCancelar.style.display = 'inline-block';
      // só os que ainda não têm roteiro (nunca mexe em rascunho editado nem no que já foi enviado)
      const alvo = cycle.entries.filter(e=> !e.enviadoEm && !(e.roteiro||'').trim());
      for(let i=0;i<alvo.length;i++){
        if(State.cancelGeracao){ toast('Geração cancelada'); break; }
        btnGerarTodos.innerHTML = `<span class="loader"></span> Gerando ${i+1}/${alvo.length}...`;
        await gerarUmRoteiro(cycle, alvo[i].id);
      }
      btnGerarTodos.disabled = false;
      if(btnCancelar) btnCancelar.style.display = 'none';
      if(!State.cancelGeracao) toast('Todos os roteiros gerados');
      render();
    };
  }
  const btnEnviarTodos = document.getElementById('btnEnviarTodos');
  if(btnEnviarTodos) btnEnviarTodos.onclick = async ()=>{
    const cycle = getOrCreateCycle(State.currentCycleYM);
    // guarda o que estiver digitado antes de abrir a revisão
    for(const ta of document.querySelectorAll('[data-roteiro-edit]')){ const e = cycle.entries.find(x=>x.id===ta.dataset.roteiroEdit); if(e && ta.value !== e.roteiro){ e.roteiro = ta.value; await persistOneEntry(State.currentCycleYM, e); } }
    abrirEnvio(cycle.entries.filter(e=> !e.enviadoEm && (e.roteiro||'').trim()).map(e=>e.id));
  };
  if(btnCancelar) btnCancelar.onclick = ()=>{ State.cancelGeracao = true; btnCancelar.textContent = 'Cancelando...'; btnCancelar.disabled = true; };
}

function render(){
  document.getElementById('main').innerHTML = viewCiclo();
  wireCicloView();
}

(async function start(){
  const auth = await guardStaff('ciclo');
  if(!auth) return;
  REAL_TEAMS = EQUIPES.filter(e=> e.tipo==='equipe' && e.name!=='Avulsos').map(e=>e.name);
  const { data: athletesData } = await sb.from('athletes').select('*').order('team').order('name');
  State.athletes = (athletesData||[]).map(mapAthleteFromDB);
  const { data: productsData } = await sb.from('products').select('*').order('cat').order('name');
  State.products = (productsData||[]).map(mapProductFromDB);
  const [probe, curt] = await Promise.all([
    sb.from('entries').select('enviado_em').limit(1),
    sb.from('roteiro_exemplos').select('athlete_id, produto, formato, roteiro_text, created_at').eq('tipo', 'bom').order('created_at', {ascending:false}).limit(300),
  ]);
  State.envioOk = !probe.error;
  State.manualOk = !(await sb.from('entries').select('manual').limit(1)).error;
  const [cads, comp] = await Promise.all([
    sb.from('atleta_cadastro').select('athlete_id, cupom_compras'),
    sb.from('atleta_compras').select('*'),
  ]);
  State.comprasOk = !cads.error && !comp.error;
  (cads.data||[]).forEach(c=>{ if((c.cupom_compras||'').trim()) State.cuponsCompras[c.athlete_id] = c.cupom_compras.trim(); });
  (comp.data||[]).forEach(c=> State.compras[c.athlete_id] = c);
  const limite = new Date(Date.now() - 45*864e5).toISOString();
  State.curtidos = (curt.data || []).filter(x=> x.athlete_id && x.roteiro_text && x.created_at >= limite);
  await carregarMes(State.currentCycleYM);
  await carregarHistorico();
  render();
})();
</script>
