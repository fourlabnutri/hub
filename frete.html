<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cotação de frete · FourLab Hub</title>
<link rel="stylesheet" href="shared.css">
<style>
/* Componentes da tela de cotação (no Hub, entram junto com o shared.css) */
[hidden] { display: none !important }   /* o shared.css do Hub não tem esta regra; sem ela o campo da NF aparece no modo Pedido */
:root { --line-2: #f3eee8; --wait: #b5680a; --wait-soft: #fdf3e1; --white: #ffffff;
  --bar1: #e96709; --bar2: #fdcc03; --bar3: #731b58; --bar4: #e3055f; --bar5: #8a7c72; --font-title: "Montserrat", "Maven Pro", sans-serif }
.modo { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .4px; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line) }
.modo.on { background: var(--green-soft); color: var(--green); border-color: transparent }
/* cartões */
.entrada, .resumo, .tab-wrap, details.itens, .dest { background: var(--card); border: 1px solid rgba(235,228,220,.7); border-radius: var(--radius); box-shadow: var(--shadow) }
.entrada { padding: 22px; display: grid; gap: 16px }
.tipos { display: inline-flex; max-width: 100%; overflow-x: auto; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 4px; gap: 2px; justify-self: start }
.tipos button { border: 0; background: transparent; border-radius: 999px; padding: 7px 14px; font-size: 12px; font-weight: 700; color: var(--muted); white-space: nowrap }
.tipos button[aria-pressed="true"] { background: var(--grad-accent); color: var(--white); box-shadow: 0 4px 12px rgba(233,103,9,.25) }
.linha { display: flex; gap: 12px; flex-wrap: wrap; align-items: end }
.campo { display: grid; gap: 6px; min-width: 0 }
.campo input, .campo select, textarea { width: 100%; border: 1.5px solid transparent; border-radius: 12px; padding: 11px 14px; font-size: 13.5px; background: var(--surface-2); color: var(--ink); transition: border-color .15s, background .15s }
.campo input:focus, .campo select:focus, textarea:focus { outline: none; border-color: var(--orange); background: var(--white) }
#q { width: min(320px, 100%); font-size: 15px; font-weight: 600 }
.btn { border: 0; border-radius: 999px; padding: 11px 22px; font-weight: 700; font-size: 12.5px; background: var(--grad-accent); color: var(--white); box-shadow: 0 6px 16px rgba(233,103,9,.25); text-shadow: 0 1px 1px rgba(120,50,0,.18); display: inline-flex; align-items: center; justify-content: center; gap: 7px; transition: transform .1s, opacity .15s }
.btn:hover { opacity: .92 }
.btn:active { transform: scale(.97) }
.btn:disabled { opacity: .5; cursor: progress }
.btn.ghost { background: var(--white); color: var(--ink); border: 1px solid var(--line); box-shadow: none; text-shadow: none }
.btn.ghost:hover { border-color: var(--ink-2) }
.lnk { background: none; border: 0; color: var(--orange); padding: 0; font-weight: 700; font-size: 12.5px }
.lnk:hover { text-decoration: underline; text-underline-offset: 2px }
.cx-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: end }
.cx-row .campo input { width: 110px }
.exemplos { font-size: 12.5px; color: var(--muted); display: flex; gap: 6px 14px; flex-wrap: wrap; align-items: center }
.erro { background: var(--red-soft); color: var(--red); border-radius: var(--radius-sm); padding: 10px 14px; font-weight: 600; font-size: 13px }

/* resumo da carga */
.resumo { padding: 22px; display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 2fr); gap: 22px }
.destino .lbl { display: block; margin-bottom: 4px }
.destino strong { font-family: var(--font-title); font-weight: 600; font-size: 26px; letter-spacing: -.5px; display: block; line-height: 1.15 }
.destino .sub { color: var(--muted); font-size: 12.5px }
.metricas { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px }
.metricas div { display: grid; gap: 4px }
.metricas .num { font-family: var(--font-title); font-size: 24px; font-weight: 600; letter-spacing: -.5px; line-height: 1.1 }
.caixas { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; border-top: 1px solid var(--line-2); padding-top: 14px }
.cx { display: inline-flex; align-items: center; gap: 7px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; font-size: 11.5px; font-weight: 600; color: var(--ink-2) }
.cx i { display: inline-block; width: 34px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; position: relative }
.cx i b { position: absolute; inset: 0 auto 0 0; background: var(--grad-accent) }
.pend { grid-column: 1 / -1; background: var(--wait-soft); color: var(--wait); border-radius: var(--radius-sm); padding: 12px 16px; font-size: 12.5px }
.pend ul { margin: 4px 0 0; padding-left: 18px }

/* três destaques */
.destaques { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px }
.dest { padding: 22px; display: grid; gap: 6px; text-align: left; font: inherit; color: inherit; transition: transform .1s }
.dest:hover { transform: translateY(-1px) }
.dest .lbl { font-size: 12.5px }
.dest .preco { font-family: var(--font-title); font-size: 30px; font-weight: 600; letter-spacing: -.5px; line-height: 1.1; font-variant-numeric: tabular-nums }
.dest .quem { font-weight: 700 }
.dest .meta { color: var(--muted); font-size: 11.5px }
.dest.rec { border: 1.5px solid var(--orange); box-shadow: 0 6px 24px rgba(233,103,9,.12) }
.dest.rec .lbl { color: var(--orange) }

/* tabela */
.tab-wrap { padding: 22px; overflow-x: auto }
.tab-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 14px; flex-wrap: wrap }
.tab-head h2 { font-size: 15px; font-weight: 700 }
.tab-head .desc { font-size: 12.5px; color: var(--muted); font-family: var(--font-body); font-weight: 400; letter-spacing: 0 }
table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; min-width: 780px }
th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap }
th button { background: none; border: 0; padding: 0; color: inherit; font: inherit }
th button[aria-sort]::after { content: " ↕"; opacity: .5 }
th button[aria-sort="ascending"] { color: var(--ink) }
th button[aria-sort="ascending"]::after { content: " ↑"; opacity: 1 }
td { padding: 12px; border-bottom: 1px solid var(--line-2); vertical-align: middle; font-variant-numeric: tabular-nums }
td.r, th.r { text-align: right }
tbody tr:last-child td { border-bottom: 0 }
tr.g { cursor: pointer }
tr.g:hover td, tr.g.aberto td { background: var(--surface-2) }
tr.g:hover td:first-child, tr.g.aberto td:first-child { border-radius: 12px 0 0 12px }
tr.g:hover td:last-child, tr.g.aberto td:last-child { border-radius: 0 12px 12px 0 }
tr.esc td:first-child { box-shadow: inset 3px 0 0 var(--orange) }
.serv { font-weight: 700 }
.serv small { display: block; font-weight: 500; color: var(--muted); font-size: 12px }
.chips { display: flex; gap: 4px; flex-wrap: wrap }
.chip { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .4px; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap }
.chip.selo { background: var(--orange-soft); color: var(--orange); border-color: transparent }
.chip.alt { border-style: dashed }
.obs { color: var(--muted); font-size: 11.5px; max-width: 280px }
.preco-c { font-weight: 700; font-size: 14px; white-space: nowrap; font-variant-numeric: tabular-nums }
.dif { display: block; font-size: 11px; color: var(--muted) }
.det td { background: var(--surface-2); padding: 18px; border-radius: 14px }
.det-grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 24px }
.comp-bar { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--line); margin: 10px 0 }
.comp-bar span { display: block; height: 100% }
.comp-list { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; font-size: 12.5px }
.comp-list i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-top: 4px }
.alts { display: grid; gap: 8px }
.alt-row { display: flex; justify-content: space-between; gap: 10px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 8px 12px }
.na { margin-top: 10px }
.na summary { cursor: pointer; padding: 10px 2px 0; color: var(--muted); font-size: 12.5px; font-weight: 600 }
.na ul { margin: 6px 0 0; padding-left: 20px; color: var(--muted); font-size: 12.5px }

details.itens { padding: 4px 22px }
details.itens summary { cursor: pointer; padding: 16px 0; font-family: var(--font-title); font-weight: 700; font-size: 15px }
details.itens .tab-in { overflow-x: auto; padding-bottom: 16px }
details.itens table { min-width: 640px }

/* página: espaçamento e consulta compacta */
#main { display: grid; gap: 18px; align-content: start }
.entrada.compacta { padding: 16px 18px; gap: 12px; grid-template-columns: auto 1fr; align-items: end }
.entrada.compacta .tipos { align-self: end; margin-bottom: 4px }
.entrada.compacta .linha { gap: 10px }
.entrada.compacta .linha .campo:first-child { flex: 1 1 260px }
.entrada.compacta #q { width: 100% }
.entrada.compacta .lbl { font-size: 11px }
.entrada.compacta #caixas-m, .entrada.compacta .exemplos, .entrada.compacta .erro { grid-column: 1 / -1 }
.exemplos:empty { display: none }
/* listas lado a lado, altura limitada */
.listas { display: grid; grid-template-columns: 1fr; gap: 18px }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px }
.kp { background: var(--card); border: 1px solid rgba(235,228,220,.7); border-radius: 20px; box-shadow: var(--shadow); padding: 16px 20px; display: flex; flex-direction: column; gap: 6px }
.kp span { font-size: 13px; color: var(--ink-2) }
.kp b { font-family: var(--font-title); font-size: 26px; font-weight: 600; letter-spacing: -.6px; font-variant-numeric: tabular-nums }
.kp:first-child { background: linear-gradient(140deg,#e96709,#f7a21b); color: #fff; border: 0; box-shadow: 0 12px 30px rgba(233,103,9,.25) }
.kp:first-child span { color: rgba(255,255,255,.9) }
@media (max-width: 720px) { .kpis { grid-template-columns: 1fr } }
.lista { background: var(--card); border: 1px solid rgba(235,228,220,.7); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden }
.lista-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line-2) }
.lista-head h2 { font-size: 14px; font-weight: 700 }
.lista-head .desc { font-size: 11.5px; color: var(--muted) }
.cont { display: inline-block; margin-left: 6px; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: var(--orange-soft); color: var(--orange); vertical-align: 1px }
.hist { display: grid; max-height: 360px; overflow-y: auto }
.hist button { text-align: left; display: grid; grid-template-columns: 120px minmax(0, 1fr) 120px 80px; gap: 12px; align-items: center; background: none; border: 0; border-bottom: 1px solid var(--line-2); border-radius: 0; padding: 9px 18px; font-size: 12.5px; color: var(--ink) }
.hist button:last-child { border-bottom: 0 }
.hist button:hover { background: var(--surface-2) }
.hist small { display: block; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.hist small.ok { color: var(--green) }
.h-ped { display: flex; gap: 6px; align-items: center }
.h-ped .chip { font-size: 9px; padding: 2px 6px }
.h-dest { min-width: 0 }
.h-dest > span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.h-val { text-align: right; min-width: 0 }
.h-dt { text-align: right; color: var(--muted); font-size: 11.5px }

/* barra de escolha e aviso */
.barra { position: fixed; left: calc(100px + env(safe-area-inset-left, 0px)); right: calc(14px + env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 40px rgba(26,19,21,.14); padding: 14px 18px; z-index: 15 }
.barra-in { max-width: 1340px; margin: 0 auto; display: flex; gap: 12px 18px; align-items: center; flex-wrap: wrap }
.barra-in .quem { flex: 1 1 220px; min-width: 0 }
.barra textarea { flex: 2 1 260px; min-height: 44px; resize: vertical }
.toast { opacity: 1; position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(110px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--white); padding: 12px 22px; border-radius: 999px; font-size: 12.5px; font-weight: 600; z-index: 30; max-width: calc(100% - 32px) }

@media (max-width: 860px) {
  .sidebar { display: none }
  main.wrap { margin-left: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
  .barra { left: calc(10px + env(safe-area-inset-left, 0px)); right: calc(10px + env(safe-area-inset-right, 0px)) }
  .resumo, .det-grid { grid-template-columns: 1fr }
  .metricas { grid-template-columns: repeat(2, minmax(0, 1fr)) }
  .destaques { grid-template-columns: 1fr }
  .entrada.compacta { grid-template-columns: 1fr }
  .listas { grid-template-columns: 1fr }
  .hist button { grid-template-columns: 90px minmax(0, 1fr) 90px; padding: 9px 14px }
  .h-dt { display: none }
  .page-head h1 { font-size: 24px }
}
@media (prefers-reduced-motion: reduce) { .sidebar, .dest, .btn { transition: none } }
</style>
<style>
  .nav-area{ font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.8px; color:rgba(255,255,255,.55); padding:14px 14px 2px; white-space:nowrap; opacity:0; transition:opacity .16s ease .04s; }
  .sidebar:hover .nav-area{ opacity:1; }
  .nav-sep{ height:1px; background:rgba(255,255,255,.16); margin:10px 12px 0; }
  @media (max-width:860px){ .nav-area{ opacity:1; } }
  /* menu por área (sanfona) */
  .nav-cab .chev{ margin-left:auto; flex-shrink:0; opacity:0; transition:transform .22s ease, opacity .16s ease; }
  .sidebar:hover .nav-cab .chev{ opacity:.7; }
  .nav-grupo.aberto > .nav-cab .chev{ transform:rotate(90deg); }
  .nav-grupo.aberto > .nav-cab{ color:#fff; }
  .nav-grupo.tem-ativo > .nav-cab{ background:rgba(255,255,255,.14); color:#fff; }
  .nav-sub{ display:grid; grid-template-rows:0fr; transition:grid-template-rows .26s cubic-bezier(.4,0,.2,1); }
  .nav-sub > div{ overflow:hidden; display:flex; flex-direction:column; gap:2px; }
  .sidebar:hover .nav-grupo.aberto > .nav-sub{ grid-template-rows:1fr; }
  .nav-btn.sub{ font-size:12.5px; font-weight:600; padding:9px 12px 9px 22px; }
  .nav-btn.sub .ic{ transform:scale(.85); }
  .nav-sub > div > .nav-btn.sub:first-child{ margin-top:2px; }
  @media (max-width:860px){ .nav-cab .chev{ opacity:.7; } .nav-grupo.aberto > .nav-sub{ grid-template-rows:1fr; } }
  .home-btn{ display:inline-flex; align-items:center; gap:6px; margin-bottom:10px; padding:6px 13px 6px 10px; border-radius:999px; background:#fff; border:1px solid rgba(0,0,0,.12); font-size:12px; font-weight:700; color:var(--ink); text-decoration:none; }
  .home-btn:hover{ background:var(--orange); border-color:var(--orange); color:#fff; }
  .home-btn svg{ width:14px; height:14px; }
  @media print{ .home-btn{ display:none; } }
</style><style>
  @media print{
    @page{ size:A4; margin:20mm 12mm 18mm;
      @top-left{ content:url(assets/logo-print.svg) "  FourLab Nutrition"; font:700 10pt Arial, Helvetica, sans-serif; color:#222; vertical-align:middle; }
      @bottom-left{ content:"Documento interno · FourLab Nutrition"; font:8.5pt Arial, Helvetica, sans-serif; color:#666; }
      @bottom-right{ content:"Página " counter(page) " de " counter(pages); font:8.5pt Arial, Helvetica, sans-serif; color:#666; }
    }
    html, body, .shell, main{ background:#fff !important; }
    *{ box-shadow:none !important; text-shadow:none !important; }
    .card, .panel, .tile, .kpi{ border:1px solid #e3ddd5 !important; }
    body{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }
</style>
</head>

$("#cx-add").onclick = addCaixa;
const numBR = (s) => Number(String(s).replace(/\./g, "").replace(",", "."));

$("#form").onsubmit = async (e) => {
  e.preventDefault(); $("#erro").hidden = true;
  const q = $("#q").value.trim();
  let corpo;
  if (tipo === "cep") {
    const caixas = [...$("#cx-lista").children].map((_, i) => ({ caixa: $(`#cx-t${i}`).value, peso_kg: numBR($(`#cx-p${i}`).value), quantidade: Number($(`#cx-q${i}`).value) || 1 })).filter((c) => c.peso_kg > 0);
    corpo = { cep: q, valor_nf: numBR($("#nf").value), caixas };
  } else corpo = { [tipo]: q };
  if (!q) return erro("Informe o número do pedido ou o CEP.");
  if (!online) {
    const d = DEMO.find((c) => tipo === "pedido" ? String(c.pedido?.numero) === q : c.request.destino.cep === q.replace(/\D/g, ""));
    return d ? mostrar(d) : erro("Na prévia só há os dois exemplos abaixo. Rode o gateway localmente (npm start) para cotar qualquer pedido ou CEP.");
  }
  $("#cotar").disabled = true; $("#cotar").textContent = "Cotando…";
  try {
    mostrar(await api("cotar", corpo)); carregarHist();
  } catch (x) { erro(x.message || "Falha ao cotar."); }
  finally { $("#cotar").disabled = false; $("#cotar").textContent = "Cotar"; }
};
function erro(m) { $("#erro").textContent = m; $("#erro").hidden = false; }

// ---------- resultado ----------
function mostrar(c) {
  atual = c; aberto = null; fecharBarra();
  const d = c.request.destino, r = c.resumo;
  const ok = c.grupos.filter((g) => g.status === "ok");
  const pega = (s) => ok.find((g) => g.principal.selos?.includes(s));
  const card = (s, g) => !g ? "" : `<button class="dest${s === "recomendado" ? " rec" : ""}" type="button" data-chave="${esc(g.chave)}">
      <span class="lbl">${SELO[s]}</span><span class="preco">${brl(g.principal.preco_total)}</span>
      <span class="quem">${esc(g.transportadora)} · ${esc(g.servico)}</span><span class="meta">${prazo(g.principal)} · ${esc(fonteDe(g.principal))}</span></button>`;
  const pedidoLinha = c.pedido ? `Pedido Bling ${c.pedido.numero}${c.pedido.numeroLoja ? ` · Mercos ${esc(c.pedido.numeroLoja)}` : ""}${c.pedido.cliente ? ` · ${esc(c.pedido.cliente)}` : ""}` : "Cotação manual";
  const caixas = (c.caixas || []).map((x) => `<span class="cx" title="ocupação ${Math.round(x.ocupacao * 100)}%">${esc(x.caixa.replace("Caixa Fourlab ", ""))} <span class="num">${kg(x.peso_kg)}</span><i><b style="width:${Math.round(x.ocupacao * 100)}%"></b></i></span>`).join("");
  const naoAt = c.grupos.filter((g) => g.status !== "ok");

  $("#resultado").innerHTML = `
    <div class="resumo">
      <div class="destino"><span class="lbl">${pedidoLinha}</span><strong>${esc(titulo(d.cidade) || cepFmt(d.cep))}${d.uf ? "/" + esc(d.uf) : ""}</strong><span class="sub num">CEP ${cepFmt(d.cep)} · ${c.request.canal}</span></div>
      <div class="metricas">
        <div><span class="lbl">Peso real</span><span class="num">${kg(r.peso_real_kg)}</span></div>
        <div><span class="lbl">Cubagem</span><span class="num">${r.cubagem_m3.toLocaleString("pt-BR", { maximumFractionDigits: 3 })} m³</span></div>
        <div><span class="lbl">Volumes</span><span class="num">${r.volumes}</span></div>
        <div><span class="lbl">Valor NF</span><span class="num">${brl(r.valor_nf)}</span></div>
      </div>
      ${caixas ? `<div class="caixas"><span class="lbl">Caixas montadas</span>${caixas}</div>` : ""}
      ${c.pendencias?.length ? `<div class="pend"><strong>Atenção antes de decidir</strong><ul>${c.pendencias.map((p) => `<li>${esc(p)}</li>`).join("")}</ul></div>` : ""}
    </div>
    <div class="destaques">${card("mais_barato", pega("mais_barato"))}${card("mais_rapido", pega("mais_rapido"))}${card("recomendado", pega("recomendado"))}</div>
    <div class="tab-wrap">
      <div class="tab-head"><h2>${ok.length} serviços cotados <span class="desc">· ${c.grupos.reduce((s, g) => s + 1 + g.alternativas.length, 0)} respostas em ${(c.duracao_ms / 1000).toLocaleString("pt-BR", { maximumFractionDigits: 1 })} s</span></h2>
        <span class="desc">Clique numa linha para ver a composição</span></div>
      <table><thead><tr>
        <th>Transportadora · serviço</th><th>Fonte</th>
        <th class="r"><button type="button" data-ord="preco" aria-sort="${ordem === "preco" ? "ascending" : "none"}">Preço</button></th>
        <th><button type="button" data-ord="prazo" aria-sort="${ordem === "prazo" ? "ascending" : "none"}">Prazo</button></th>
        <th class="r">Peso taxado</th><th>Observações</th><th></th></tr></thead>
      <tbody id="tb"></tbody></table>
      ${naoAt.length ? `<details class="na"><summary>${naoAt.length} não atendem este envio</summary><ul>${naoAt.map((g) => `<li><strong>${esc(g.transportadora)} · ${esc(g.servico)}</strong> (${esc(g.fontes.join(", "))}): ${esc(g.principal.mensagem || g.status)}</li>`).join("")}</ul></details>` : ""}
    </div>
    ${c.itens?.length ? itensHtml(c.itens) : ""}`;
  $("#resultado").hidden = false;
  $("#resultado").querySelectorAll(".dest").forEach((b) => b.onclick = () => abrir(b.dataset.chave, true));
  $("#resultado").querySelectorAll("th button").forEach((b) => b.onclick = () => { ordem = b.dataset.ord; mostrarTabela();
    $("#resultado").querySelectorAll("th button").forEach((x) => x.setAttribute("aria-sort", x.dataset.ord === ordem ? "ascending" : "none")); });
  mostrarTabela();
}
const titulo = (s) => {
  if (!s) return "";
  const [cidade, ...resto] = String(s).split("/");   // "GOIANIA/GO" → "Goiania/GO"
  const c = cidade === cidade.toUpperCase() ? cidade.toLowerCase().replace(/(^|\s)\S/g, (m) => m.toUpperCase()) : cidade;
  return [c, ...resto].join("/");
};

function mostrarTabela() {
  const ok = atual.grupos.filter((g) => g.status === "ok").slice();
  if (ordem === "prazo") ok.sort((a, b) => (a.principal.prazo_max_du ?? 99) - (b.principal.prazo_max_du ?? 99) || a.principal.preco_total - b.principal.preco_total);
  else ok.sort((a, b) => a.principal.preco_total - b.principal.preco_total);
  const escolhida = atual.escolha?.chave;
  $("#tb").innerHTML = ok.map((g) => {
    const o = g.principal;
    const selos = (o.selos || []).map((s) => `<span class="chip selo">${SELO[s]}</span>`).join("");
    const alt = g.alternativas.filter((a) => a.status === "ok");
    return `<tr class="g${aberto === g.chave ? " aberto" : ""}${escolhida === g.chave ? " esc" : ""}" data-chave="${esc(g.chave)}" tabindex="0" aria-expanded="${aberto === g.chave}">
      <td><div class="serv">${esc(g.transportadora)}<small>${esc(g.servico)}</small></div><div class="chips" style="margin-top:4px">${selos}${escolhida === g.chave ? '<span class="chip selo">escolhida</span>' : ""}</div></td>
      <td><div class="chips"><span class="chip">${esc(fonteDe(o))}</span>${alt.length ? `<span class="chip alt">+${alt.length} ${alt.length > 1 ? "fontes" : "fonte"}</span>` : ""}</div></td>
      <td class="r"><span class="preco-c">${brl(o.preco_total)}</span>${g.diferenca_alternativa ? `<span class="dif">${brl(g.diferenca_alternativa)} mais caro via ${esc(fonteDe(alt[0]))}</span>` : ""}</td>
      <td class="num">${prazo(o)}</td>
      <td class="r num">${kg(o.peso_taxado_kg)}</td>
      <td class="obs">${esc(o.mensagem || "")}</td>
      <td><button class="btn ghost" type="button" data-escolher="${esc(g.chave)}" style="padding:7px 13px;font-size:11.5px">Escolher</button></td></tr>
      ${aberto === g.chave ? `<tr class="det"><td colspan="7">${detalhe(g)}</td></tr>` : ""}`;
  }).join("");
  $("#tb").querySelectorAll("tr.g").forEach((tr) => {
    tr.onclick = (e) => { if (!e.target.closest("[data-escolher]")) abrir(tr.dataset.chave); };
    tr.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); abrir(tr.dataset.chave); } };
  });
  $("#tb").querySelectorAll("[data-escolher]").forEach((b) => b.onclick = () => pedirEscolha(b.dataset.escolher, b.dataset.adaptador));
}
function abrir(chave, rolar) {
  aberto = aberto === chave && !rolar ? null : chave; mostrarTabela();
  if (rolar) document.querySelector(`tr.g[data-chave="${CSS.escape(chave)}"]`)?.scrollIntoView({ block: "center", behavior: "smooth" });
}
function detalhe(g) {
  const o = g.principal, c = o.composicao || {}, total = o.preco_total || 1;
  const partes = COMP.filter(([k]) => c[k] > 0).map(([k, n, cor]) => ({ n, v: c[k], cor }));
  const soma = partes.reduce((s, p) => s + p.v, 0);
  const bar = partes.map((p) => `<span style="width:${(p.v / Math.max(soma, total)) * 100}%;background:var(${p.cor})" title="${esc(p.n)}"></span>`).join("");
  const lista = partes.map((p) => `<i style="background:var(${p.cor})"></i><span>${esc(p.n)}</span><span class="num">${brl(p.v)}</span>`).join("");
  const semDet = partes.length <= 1 ? `<p class="obs" style="max-width:none">${o.fonte.startsWith("agregador") ? "O agregador devolve só o preço final, sem composição." : o.fonte === "api" ? "A transportadora devolve só o total." : ""}</p>` : "";
  const alts = [o, ...g.alternativas].map((a, i) => `<div class="alt-row"><span><strong>${esc(fonteDe(a))}</strong> <span class="obs">${a.status === "ok" ? prazo(a) : esc(a.mensagem || a.status)}</span></span>
      <span style="display:flex;gap:10px;align-items:center"><span class="preco-c">${brl(a.preco_total)}</span>${a.status === "ok" ? `<button class="btn ghost" type="button" data-escolher="${esc(g.chave)}" data-adaptador="${esc(a.adaptador)}" style="padding:7px 13px;font-size:11.5px">${i === 0 ? "Escolher" : "Escolher esta fonte"}</button>` : ""}</span></div>`).join("");
  return `<div class="det-grid">
    <div><div class="lbl">Composição do preço</div><div class="comp-bar">${bar}</div><div class="comp-list">${lista}<span></span><strong>Total</strong><strong class="num">${brl(o.preco_total)}</strong></div>${semDet}</div>
    <div><div class="lbl" style="margin-bottom:8px">Mesmo serviço por fonte</div><div class="alts">${alts}</div></div></div>`;
}
function itensHtml(itens) {
  return `<details class="itens"><summary>Itens do pedido (${itens.length}) e pesos usados</summary><div class="tab-in"><table><thead><tr><th>Código</th><th>Produto</th><th class="r">Qtd</th><th class="r">Peso bruto</th><th>Medidas (cm)</th><th>Regra aplicada</th></tr></thead><tbody>
    ${itens.map((i) => `<tr><td class="num">${esc(i.codigo)}</td><td>${esc(i.descricao)}${i.origem ? `<div class="obs">${esc(i.origem)}</div>` : ""}</td><td class="r num">${i.quantidade}</td><td class="r num">${kg(i.peso_bruto_kg)}</td><td class="num">${i.altura_cm ? `${i.altura_cm}×${i.largura_cm}×${i.comprimento_cm}` : "–"}</td><td class="obs">${esc(i.ajuste || "cadastro do Bling")}</td></tr>`).join("")}
  </tbody></table></div></details>`;
}

// ---------- escolha ----------
function pedirEscolha(chave, adaptador) {
  const g = atual.grupos.find((x) => x.chave === chave);
  const o = [g.principal, ...g.alternativas].find((a) => !adaptador || a.adaptador === adaptador);
  const rec = !!g.principal.selos?.includes("recomendado") && o.adaptador === g.principal.adaptador;
  pendente = { chave, adaptador: o.adaptador, rec };
  $("#b-quem").innerHTML = `<strong>${esc(g.transportadora)} · ${esc(g.servico)}</strong> via ${esc(fonteDe(o))} · <span class="num">${brl(o.preco_total)}</span> · ${prazo(o)}${rec ? ' <span class="chip selo">recomendada</span>' : ""}`;
  $("#motivo").placeholder = rec ? "Observação (opcional)" : "Motivo (obrigatório, não é a recomendada): ex. cliente pediu, prazo do evento, restrição de entrega";
  $("#motivo").value = ""; $("#barra").hidden = false; $("#motivo").focus();
}
function fecharBarra() { $("#barra").hidden = true; pendente = null; }
$("#b-cancel").onclick = fecharBarra;
$("#b-ok").onclick = async () => {
  const motivo = $("#motivo").value.trim();
  if (!pendente.rec && !motivo) { $("#motivo").focus(); return toast("Escreva o motivo para escolher uma opção fora da recomendada."); }
  const corpo = { cotacao_id: atual.id, chave: pendente.chave, adaptador: pendente.adaptador, motivo };
  if (online) {
    let j;
    try { j = await api("escolha", corpo); } catch (x) { return toast(x.message); }
    atual.escolha = j; carregarHist(); carregarPendentes();
    toast(`Escolha registrada: ${j.transportadora} · ${j.servico}`);
  } else {
    atual.escolha = { ...corpo };
    toast("Escolha marcada. Na prévia ela não é gravada.");
  }
  fecharBarra(); mostrarTabela();
};
let tt; function toast(m) { $("#toast").textContent = m; $("#toast").hidden = false; clearTimeout(tt); tt = setTimeout(() => $("#toast").hidden = true, 3500); }

// ---------- histórico e modo ----------
async function carregarPendentes() {
  try {
    const l = await api("cotacoes?pendentes=1&n=50");
    $("#pendentes").hidden = !l.length; $("#k1").textContent = l.length;
    $("#pend-n").textContent = l.length ? `· ${l.length} ${l.length > 1 ? "pedidos" : "pedido"}` : "";
    $("#pend-l").innerHTML = l.map((h) => `<button type="button" data-id="${esc(h.id)}"><span class="h-ped"><strong class="num">${h.pedido}</strong>${h.loja ? `<span class="chip">${esc(({ 205860994: "Mercos", 205392589: "Site" })[h.loja] || "Loja " + h.loja)}</span>` : ""}</span>
      <span class="h-dest"><span>${esc(titulo(h.destino))}</span>${h.cliente ? `<small>${esc(h.cliente)}</small>` : ""}</span>
      <span class="h-val">${h.melhor ? `<strong class="num">${brl(h.melhor.preco)}</strong><small>${esc(h.melhor.transportadora)}</small>` : '<small>sem cotação</small>'}</span>
      <span class="h-dt num">${new Date(h.criada_em).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })}</span></button>`).join("");
    $("#pend-l").querySelectorAll("button").forEach((b) => b.onclick = async () => {
      const c = await api(`cotacao?id=${encodeURIComponent(b.dataset.id)}`);
      setTipo("pedido"); $("#q").value = c.pedido?.numero ?? ""; mostrar(c);
      $("#resultado").scrollIntoView({ behavior: "smooth", block: "start" });
    });
  } catch { /* sem servidor */ }
}
async function carregarHist() {
  try {
    const l = await api("cotacoes?n=200");
    $("#historico").hidden = !l.length;
    { const hoje = new Date().toLocaleDateString("en-CA", { timeZone: "America/Sao_Paulo" }), esc2 = l.filter((h) => h.escolha && h.escolha.preco > 0);
      $("#k2").textContent = l.filter((h) => new Date(h.criada_em).toLocaleDateString("en-CA", { timeZone: "America/Sao_Paulo" }) === hoje).length;
      $("#k3").textContent = esc2.length ? brl(esc2.reduce((s, h) => s + h.escolha.preco, 0) / esc2.length) : "—"; }
    $("#hist").innerHTML = l.map((h) => `<button type="button" data-id="${esc(h.id)}"><span class="h-ped"><strong class="num">${h.pedido || "Manual"}</strong>${h.automatica ? '<span class="chip">auto</span>' : ""}</span>
      <span class="h-dest"><span>${esc(/^\d/.test(h.destino) ? h.destino : titulo(h.destino))}</span></span>
      <span class="h-val">${h.escolha ? `<strong class="num">${brl(h.escolha.preco)}</strong><small class="ok">✓ ${esc(h.escolha.transportadora)}</small>` : h.melhor ? `<strong class="num">${brl(h.melhor.preco)}</strong><small>${esc(h.melhor.transportadora)}</small>` : ""}</span>
      <span class="h-dt num">${new Date(h.criada_em).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })}</span></button>`).join("");
    $("#hist").querySelectorAll("button").forEach((b) => b.onclick = async () => { mostrar(await api(`cotacao?id=${encodeURIComponent(b.dataset.id)}`)); $("#resultado").scrollIntoView({ behavior: "smooth", block: "start" }); });
  } catch { /* sem servidor */ }
}
function exemplos() {
  $("#exemplos").innerHTML = DEMO.length ? "Exemplos com dados reais: " + DEMO.map((c, i) => `<button type="button" class="lnk" data-i="${i}">${c.pedido ? `Pedido ${c.pedido.numero} (${esc(titulo(c.request.destino.cidade))}/${esc(c.request.destino.uf)})` : `Itajubá → ${esc(c.request.destino.cidade)}, ${kg(c.resumo.peso_real_kg)}, NF ${brl(c.resumo.valor_nf)}`}</button>`).join("") : "";
  $("#exemplos").querySelectorAll("button").forEach((b) => b.onclick = () => {
    const c = DEMO[b.dataset.i];
    if (c.pedido) { setTipo("pedido"); $("#q").value = c.pedido.numero; } else { setTipo("cep"); $("#q").value = cepFmt(c.request.destino.cep); $("#nf").value = String(c.resumo.valor_nf).replace(".", ","); }
    mostrar(c);
  });
}
(async () => {
  setTipo("pedido");
  try {
    const s = await api("status");
    online = true;
    $("#modo").textContent = `Conectado · ${s.adaptadores.length} fontes${s.bling ? " · Bling" : ""}`; $("#modo").classList.add("on");
    carregarHist(); carregarPendentes();
  } catch { online = false; }
  exemplos();
  if (!online && DEMO[0]) { $("#q").value = DEMO[0].pedido?.numero ?? ""; mostrar(DEMO[0]); }
})();
</script>
