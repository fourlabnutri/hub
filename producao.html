<style>
  main{ padding-top:28px !important; }
  @media (max-width:860px){ .sidebar{display:none;} main{ padding:16px !important; } }
  .filters{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:18px; }
  .filters .dates{ display:flex; gap:8px; align-items:center; }
  .filters .dates input, .filters select{ width:auto; background:#fff; }
  .filters .search{ flex:1; min-width:200px; max-width:320px; }
  .check{ display:inline-flex; align-items:center; gap:8px; font-size:12.5px; font-weight:600; color:var(--ink-2); cursor:pointer; margin:0; }
  .check input{ width:auto; }
  .num{ text-align:right; white-space:nowrap; } th.num{ text-align:right; }
  .tbl-wrap{ overflow-x:auto; }
  .red{ color:var(--red); font-weight:700; } .muted{ color:var(--muted); } .sub2{ font-size:11px; color:var(--muted); }
  .note{ font-size:11.5px; color:var(--muted); line-height:1.5; }
  .bar-row{ margin-bottom:9px; } .bar-row .top{ display:flex; justify-content:space-between; font-size:11.5px; margin-bottom:3px; }
  .bar-row .track{ background:var(--surface-2); border-radius:999px; height:10px; overflow:hidden; } .bar-row .fill{ height:100%; border-radius:999px; }
  .more{ text-align:center; margin-top:10px; }
  .st{ display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.3px; padding:4px 10px; border-radius:999px; white-space:nowrap; }
  .st.A{ background:#fff4c9; color:#8a6a00; } .st.P{ background:#e6f0ff; color:#1d4ed8; } .st.F{ background:var(--green-soft); color:var(--green); }
  .etp{ display:inline-block; font-size:10px; font-weight:800; padding:2px 7px; border-radius:6px; margin:1px 2px 1px 0; }
  .etp.A{ background:var(--surface-2); color:var(--muted); border:1px solid var(--line); } .etp.E{ background:#e6f0ff; color:#1d4ed8; } .etp.X{ background:var(--green-soft); color:var(--green); }
  .proc{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  @media (max-width:1080px){ .proc{ grid-template-columns:repeat(2,1fr); } } @media (max-width:560px){ .proc{ grid-template-columns:1fr; } }
  .proc .p{ border:1px solid var(--line); border-radius:18px; padding:16px; background:var(--surface-2); }
  .proc .p h3{ font-size:13px; font-weight:700; margin-bottom:8px; }
  .proc .p .big{ font-size:26px; font-weight:600; letter-spacing:-.5px; line-height:1; }
  .proc .p .lbl{ font-size:11px; color:var(--muted); margin-bottom:10px; }
  .proc .p .mini{ display:flex; gap:12px; font-size:11.5px; margin-top:10px; } .proc .p .mini b{ font-weight:800; }
  .stack{ display:flex; height:8px; border-radius:999px; overflow:hidden; background:var(--line); margin-top:10px; }
  /* kanban */
  .wk-head{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  .wk-head .ttl{ font-family:var(--font-title); font-weight:700; font-size:15px; min-width:210px; text-align:center; }
  .legend{ display:flex; gap:14px; flex-wrap:wrap; font-size:11.5px; color:var(--ink-2); align-items:center; }
  .legend i{ display:inline-block; width:14px; height:14px; border-radius:4px; border:1px solid var(--line); vertical-align:-3px; margin-right:5px; }
  .board{ display:grid; grid-template-columns:minmax(230px,1.05fr) repeat(5,minmax(200px,1fr)); gap:12px; overflow-x:auto; padding-bottom:10px; align-items:start; }
  .col{ background:var(--surface-2); border:1px solid var(--line); border-radius:18px; padding:12px; min-height:320px; }
  .col.over{ outline:2px dashed var(--orange); background:var(--orange-soft); }
  .col.today{ border-color:var(--orange); }
  .col h3{ font-size:13px; font-weight:700; display:flex; justify-content:space-between; align-items:baseline; gap:6px; }
  .col .meta{ font-size:11px; color:var(--muted); margin:2px 0 10px; min-height:16px; }
  .card-op{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:10px 11px; margin-bottom:8px; cursor:grab; box-shadow:0 1px 2px rgba(26,19,21,.04); }
  .card-op:active{ cursor:grabbing; } .card-op.dragging{ opacity:.45; }
  .card-op.min{ background:#fff4c9; border-color:#f5e39a; }
  .card-op.zero{ background:var(--red-soft); border-color:#eec8c2; }
  .card-op .t1{ display:flex; justify-content:space-between; gap:6px; align-items:center; margin-bottom:4px; }
  .card-op .opn{ font-weight:800; font-size:12px; white-space:nowrap; }
  .card-op .st{ font-size:9.5px; padding:3px 8px; }
  .card-op .desc2{ font-size:12px; line-height:1.3; font-weight:600; margin-bottom:5px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .card-op .row2{ display:flex; justify-content:space-between; font-size:11px; color:var(--ink-2); align-items:center; gap:6px; }
  .card-op .acts{ display:flex; gap:6px; margin-top:7px; }
  .card-op .acts button{ font-size:10.5px; padding:4px 9px; }
  .col.fila .list{ max-height:760px; overflow-y:auto; padding-right:2px; }
  @media print{ .sidebar,.filters,.no-print{ display:none !important; } .shell{ display:block; } }
</style>
<style>
  .nav-area{ font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.8px; color:rgba(255,255,255,.55); padding:14px 14px 2px; white-space:nowrap; opacity:0; transition:opacity .16s ease .04s; }
  .sidebar:hover .nav-area{ opacity:1; }
  .nav-sep{ height:1px; background:rgba(255,255,255,.16); margin:10px 12px 0; }
  @media (max-width:860px){ .nav-area{ opacity:1; } }
</style>

<script type="text/plain" id="app">
// ---------- dados ----------
const HOJE = DATA.gerado;
const PROC = [['PE','Pesagem'],['ML','Mistura líquido'],['MP','Mistura em pó'],['EL','Envase líquido'],['EP','Envase em pó'],['RP','Rotulagem de pote'],['DP','Embalagem em display']];
const OUTROS = [['EC','Envase / contagem de cápsulas'],['SS','Selagem de sachê']];
const ETP = Object.fromEntries([...PROC,...OUTROS]);
const STL = {A:'Em produção', P:'Produzindo', F:'Finalizada'};
const STD = {A:'aguardando início das etapas', P:'processo produtivo iniciado', F:'último processo concluído'};
const LS = {get(k,d){ try{ return JSON.parse(localStorage.getItem(k))??d; }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }};
let PLAN = LS.get('prod_plan',{}), STO = LS.get('prod_status',{});     // plano (dia) e status movidos nesta tela
// ponytail: plano/status ficam no navegador de quem moveu; mover para banco (Supabase) quando a equipe usar junto.

const diffDias = (a,b)=>Math.round((Date.parse(a)-Date.parse(b))/864e5);
const addDias = (iso,n)=>new Date(Date.parse(iso)+n*864e5).toISOString().slice(0,10);
const dBR = iso => iso ? iso.slice(0,10).split('-').reverse().join('/') : '—';
const nf = (v,d=0)=> (Number(v)||0).toLocaleString('pt-BR',{maximumFractionDigits:d});
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const mes = (iso,off=0)=>{ const [y,m]=iso.split('-').map(Number); return new Date(Date.UTC(y,m-1+off,1)).toISOString().slice(0,10); };

const OPS = DATA.ops.map(o=>({id:o[0], n:o[1], d:o[2], tp:o[3], un:o[4], sku:o[5], q:o[6], st:o[7], ab:o[8], ini:o[9].slice(0,10), prev:o[11], conc:o[12], obs:o[14],
  ops:(o[13]?o[13].split(','):[]).map(x=>{ const [c,s]=x.split(':'); return {c,s}; })}));
OPS.forEach(o=>{ o.st = STO[o.id] || o.st; o.fin = o.st==='F'; o.idade = diffDias(o.fin && o.conc ? o.conc : HOJE, o.ab); });

// quantidades: bases em g → kg; acabado em un. "OPs somadas em quantidade"
function qtd(arr){ let kg=0, un=0; arr.forEach(o=>{ if(o.un==='UN') un+=o.q; else kg+=o.q/1000; }); return {kg,un}; }
function qtdTxt(arr){ const q=qtd(arr), p=[]; if(q.un) p.push(nf(q.un)+' un'); if(q.kg) p.push(nf(q.kg,1)+' kg'); return p.join(' · ')||'—'; }

// ---------- filtros ----------
const S = {aba:'geral', preset:'tudo', ini:'', fim:'', tipo:'', q:'', st:'', antigas:true, pag:40, semana:null, simular:false, filaTudo:false};
function intervalo(){ const h=HOJE;
  switch(S.preset){ case 'hoje':return [h,h]; case 'u7':return [addDias(h,-7),h]; case 'u30':return [addDias(h,-30),h]; case 'u90':return [addDias(h,-90),h];
    case 'mes':return [mes(h),addDias(mes(h,1),-1)]; case 'mesant':return [mes(h,-1),addDias(mes(h),-1)]; case 'custom':return [S.ini||'0000-00-00',S.fim||'9999-12-31'];
    default:return ['0000-00-00','9999-12-31']; } }
function filtradas(){ const [a,b]=intervalo(), q=S.q.trim().toLowerCase();
  return OPS.filter(o=> o.ab>=a && o.ab<=b && (!S.tipo||o.tp===S.tipo) && (S.antigas || o.fin || o.idade<=90)
    && (!q || o.d.toLowerCase().includes(q) || o.n.includes(q) || o.sku.includes(q))); }
const bars = rows => { const m=Math.max(1,...rows.map(r=>r.v)); return rows.map(r=>`<div class="bar-row"><div class="top"><b>${r.l}</b><span class="muted">${r.t||nf(r.v)}</span></div><div class="track"><div class="fill" style="width:${r.v/m*100}%;background:${r.c||'var(--orange)'}"></div></div></div>`).join('')||'<div class="desc">Sem dados no filtro.</div>'; };

// ---------- tempo médio (emissão → finalização) ----------
function tempo(arr){ const f=arr.filter(o=>o.fin && o.conc).map(o=>diffDias(o.conc,o.ab)).sort((a,b)=>a-b);
  if(!f.length) return {n:0,med:0,mediana:0,max:0,mesmo:0};
  return {n:f.length, med:f.reduce((s,x)=>s+x,0)/f.length, mediana:f[Math.floor(f.length/2)], max:f[f.length-1], mesmo:f.filter(x=>x===0).length}; }

// ---------- render ----------
function render(){
  document.getElementById('main').innerHTML = `
  <div class="page-head">
    <div><h1>Produção</h1><div class="sub">Gestão à vista das ordens de produção · posição de ${dBR(HOJE)} · fonte: iApp via Nekt</div></div>
    <div class="row no-print"><div class="seg brand"><button class="${S.aba==='geral'?'active':''}" onclick="S.aba='geral';render()">Visão geral</button><button class="${S.aba==='semana'?'active':''}" onclick="S.aba='semana';render()">Programação semanal</button></div></div>
  </div>` + (S.aba==='geral' ? viewGeral() : viewSemana());
  if(S.aba==='semana') bindDnD();
}

function viewGeral(){
  const ts=filtradas(), A=ts.filter(o=>o.st==='A'), P=ts.filter(o=>o.st==='P'), F=ts.filter(o=>o.st==='F');
  const T=tempo(ts), velhas=ts.filter(o=>!o.fin && o.idade>90), atras=ts.filter(o=>!o.fin && o.prev && o.prev<HOJE);
  const pill=(id,l)=>`<button class="fpill ${S.preset===id?'active':''}" onclick="S.preset='${id}';S.pag=40;if('${id}'==='custom'&&!S.ini){S.ini=addDias(HOJE,-30);S.fim=HOJE;}render()">${l}</button>`;
  const [ia,ib]=intervalo();
  const porMes={}; ts.filter(o=>o.fin&&o.conc).forEach(o=>{ const k=o.conc.slice(0,7); (porMes[k]=porMes[k]||[]).push(diffDias(o.conc,o.ab)); });
  const mesRows=Object.keys(porMes).sort().map(k=>({l:k.split('-').reverse().join('/'), v:porMes[k].reduce((s,x)=>s+x,0)/porMes[k].length, t:`${nf(porMes[k].reduce((s,x)=>s+x,0)/porMes[k].length,1)} d · ${porMes[k].length} OPs`, c:'var(--purple)'}));

  const proc=([c,n])=>{ const a=ts.filter(o=>o.ops.some(x=>x.c===c&&x.s==='A')), e=ts.filter(o=>o.ops.some(x=>x.c===c&&x.s==='E')), x=ts.filter(o=>o.ops.some(y=>y.c===c&&y.s==='X')), tot=a.length+e.length+x.length||1;
    return `<div class="p"><h3>${n}</h3><div class="big">${nf(a.length)}</div><div class="lbl">OPs aguardando · ${qtdTxt(a)}</div>
      <div class="stack" title="aguardando / em execução / executadas"><div style="width:${a.length/tot*100}%;background:#f5d77a"></div><div style="width:${e.length/tot*100}%;background:#1d4ed8"></div><div style="width:${x.length/tot*100}%;background:var(--green)"></div></div>
      <div class="mini"><span><b>${e.length}</b> em execução</span><span><b>${x.length}</b> executadas</span></div></div>`; };

  const lista = ts.filter(o=>!S.st||o.st===S.st).sort((a,b)=> a.ab<b.ab?1:a.ab>b.ab?-1:(a.n<b.n?1:-1));
  return `
  <div class="filters">
    <div class="filter-pills">${pill('tudo','Tudo')}${pill('hoje','Hoje')}${pill('u7','Últimos 7 dias')}${pill('u30','Últimos 30 dias')}${pill('u90','Últimos 90 dias')}${pill('mes','Este mês')}${pill('mesant','Mês passado')}${pill('custom','Personalizado')}</div>
    ${S.preset==='custom'?`<div class="dates"><input type="date" value="${S.ini}" onchange="S.ini=this.value;render()"><span class="muted">até</span><input type="date" value="${S.fim}" onchange="S.fim=this.value;render()"></div>`:''}
    <select onchange="S.tipo=this.value;render()"><option value="">Todos os tipos</option><option value="04" ${S.tipo==='04'?'selected':''}>Produto acabado</option><option value="03" ${S.tipo==='03'?'selected':''}>Base / em processo</option></select>
    <div class="search"><input id="q" type="search" placeholder="Buscar produto, OP ou SKU…" value="${esc(S.q)}" oninput="S.q=this.value;S.pag=40;clearTimeout(window._t);window._t=setTimeout(()=>{render();const e=document.getElementById('q');e.focus();e.setSelectionRange(e.value.length,e.value.length)},250)"></div>
    <label class="check" title="Esconde OPs abertas e nunca iniciadas há mais de 90 dias (provável cadastro esquecido)."><input type="checkbox" ${S.antigas?'':'checked'} onchange="S.antigas=!this.checked;render()"> Ocultar fila parada &gt; 90 dias</label>
  </div>
  ${S.preset!=='tudo'?`<div class="note" style="margin:-8px 0 14px;">Filtro pela data de emissão da OP: ${dBR(ia)} a ${dBR(ib)}.</div>`:''}

  <div class="grid-4" style="margin-bottom:18px;">
    <div class="card kpi"><div class="kpi-label">OPs no filtro</div><div class="kpi-value">${nf(ts.length)}</div><div class="kpi-foot">${qtdTxt(ts)}</div></div>
    <div class="card kpi"><div class="kpi-label">Em produção <span class="sub2">(${STD.A})</span></div><div class="kpi-value" style="color:#b5680a">${nf(A.length)}</div><div class="kpi-foot">${qtdTxt(A)}</div></div>
    <div class="card kpi"><div class="kpi-label">Produzindo <span class="sub2">(${STD.P})</span></div><div class="kpi-value" style="color:#1d4ed8">${nf(P.length)}</div><div class="kpi-foot">${qtdTxt(P)}</div></div>
    <div class="card kpi"><div class="kpi-label">Finalizadas <span class="sub2">(${STD.F})</span></div><div class="kpi-value" style="color:var(--green)">${nf(F.length)}</div><div class="kpi-foot">${qtdTxt(F)}</div></div>
  </div>

  <div class="grid-3" style="margin-bottom:18px;">
    <div class="tile t-purple"><div class="t-label" style="font-weight:700">Tempo médio de produção</div><div class="t-foot"><div><div class="t-value">${T.n?nf(T.med,1)+' dias':'—'}</div><div class="t-label">emissão → finalização · ${T.n} OPs · mediana ${T.mediana} d · máx. ${T.max} d${T.n?` · ${T.mesmo} no mesmo dia`:''}</div></div></div></div>
    <div class="tile t-yellow"><div class="t-label" style="font-weight:700">Entrega prevista vencida</div><div class="t-foot"><div><div class="t-value">${nf(atras.length)} OPs</div><div class="t-label">não finalizadas com previsão anterior a ${dBR(HOJE)} · ${qtdTxt(atras)}</div></div></div></div>
    <div class="tile t-pink"><div class="t-label" style="font-weight:700">Fila parada há mais de 90 dias</div><div class="t-foot"><div><div class="t-value">${nf(velhas.length)} OPs</div><div class="t-label">${ts.length?(velhas.length/ts.length*100).toFixed(0):0}% das OPs do filtro · limpar o cadastro? · ${qtdTxt(velhas)}</div></div></div></div>
  </div>

  <div class="panel">
    <h2>Etapas do processo produtivo</h2><div class="desc">OPs por etapa: aguardando, em execução e executadas, com a quantidade somada das OPs aguardando. Uma OP aparece em cada etapa que ela tem.</div>
    <div class="proc">${PROC.map(proc).join('')}</div>
    <div class="note" style="margin-top:12px">Outras etapas cadastradas: ${OUTROS.map(([c,n])=>`${n}: <b>${ts.filter(o=>o.ops.some(x=>x.c===c&&x.s!=='X')).length}</b> OPs aguardando/em execução`).join(' · ')}.</div>
  </div>

  <div class="grid-2" style="margin-bottom:18px;">
    <div class="panel" style="margin-bottom:0"><h2>OPs por status</h2><div class="desc">Quantidade de OPs e volume somado</div>
      ${bars([{l:'Em produção',v:A.length,t:`${nf(A.length)} OPs · ${qtdTxt(A)}`,c:'var(--yellow)'},{l:'Produzindo',v:P.length,t:`${nf(P.length)} OPs · ${qtdTxt(P)}`,c:'#1d4ed8'},{l:'Finalizadas',v:F.length,t:`${nf(F.length)} OPs · ${qtdTxt(F)}`,c:'var(--green)'}])}</div>
    <div class="panel" style="margin-bottom:0"><h2>Tempo médio por mês de finalização</h2><div class="desc">Dias entre emissão e finalização da OP</div>${bars(mesRows)}
      <div class="note" style="margin-top:8px">A emissão tem só a data (sem hora): precisão de 1 dia. Para horas, falta trazer os apontamentos de tempo do iApp.</div></div>
  </div>

  <div class="panel">
    <div class="card-head"><div><h2>Ordens de produção</h2><div class="desc">${nf(lista.length)} OPs${S.st?' · '+STL[S.st]:''}. Etapas: cinza aguardando, azul em execução, verde executada.</div></div>
      <div class="row no-print"><div class="seg"><button class="${!S.st?'active':''}" onclick="S.st='';S.pag=40;render()">Todas</button>${['A','P','F'].map(k=>`<button class="${S.st===k?'active':''}" onclick="S.st='${k}';S.pag=40;render()">${STL[k]}</button>`).join('')}</div>
      <button class="btn btn-ghost btn-sm" onclick="csv()">Baixar CSV</button></div></div>
    <div class="tbl-wrap"><table><thead><tr><th>OP</th><th>Produto</th><th class="num">Quantidade</th><th>Emissão</th><th>Previsão</th><th class="num">Idade</th><th>Etapas</th><th>Status</th></tr></thead><tbody>
    ${lista.slice(0,S.pag).map(o=>`<tr><td><b>${esc(o.n)}</b></td><td>${esc(o.d)}<div class="sub2">${o.tp==='04'?'Produto acabado':'Base / em processo'}${o.sku?' · '+esc(o.sku):''}</div></td><td class="num">${qtdTxt([o])}</td><td>${dBR(o.ab)}</td><td class="${!o.fin&&o.prev&&o.prev<HOJE?'red':''}">${dBR(o.prev)}</td><td class="num">${o.idade} d</td>
      <td>${o.ops.map(x=>`<span class="etp ${x.s}" title="${ETP[x.c]||x.c}">${x.c}</span>`).join('')||'<span class="sub2">—</span>'}</td><td><span class="st ${o.st}">${STL[o.st]}</span></td></tr>`).join('') || '<tr><td colspan="8"><div class="empty-state">Nenhuma OP no filtro.</div></td></tr>'}
    </tbody></table></div>
    ${lista.length>S.pag?`<div class="more no-print"><button class="btn btn-ghost btn-sm" onclick="S.pag+=60;render()">Ver mais (${lista.length-S.pag})</button></div>`:''}
    <div class="note" style="margin-top:10px">PE pesagem · ML mistura líquido · MP mistura em pó · EL envase líquido · EP envase em pó · RP rotulagem de pote · DP embalagem em display · EC envase/contagem de cápsulas · SS selagem de sachê</div>
  </div>`;
}

function csv(){ const ts=filtradas().filter(o=>!S.st||o.st===S.st);
  const cab=['OP','Produto','SKU','Tipo','Quantidade','Unidade','Emissão','Previsão','Status','Idade (dias)','Etapas'];
  const rows=ts.map(o=>[o.n,o.d,o.sku,o.tp==='04'?'Produto acabado':'Base',String(o.q).replace('.',','),o.un,o.ab,o.prev,STL[o.st],o.idade,o.ops.map(x=>x.c+':'+x.s).join(' ')]);
  const txt='﻿'+[cab,...rows].map(r=>r.map(v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`).join(';')).join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'})); a.download=`producao_${HOJE}.csv`; a.click(); }

// ---------- programação semanal (kanban) ----------
const DIAS=['Segunda','Terça','Quarta','Quinta','Sexta'];
const segunda = iso => { const d=new Date(Date.parse(iso)); const w=(d.getUTCDay()+6)%7; return addDias(iso,-w); };
// Cores do card: branco = estoque normal · amarelo = abaixo do mínimo · vermelho = zerado ou pedidos > saldo.
// ESTOQUE[sku] = {saldo, minimo, pedidos}. Ainda sem dados (Bling estoque não carregado no Nekt): fica branco.
const ESTOQUE = {};
function corEstoque(o){
  if(o.tp!=='04') return '';
  const e = ESTOQUE[o.sku] || (S.simular ? {saldo:[50,0,300,5,120,0,40][o.id%7], minimo:[30,10,100,20,60,10,30][o.id%7], pedidos:[0,0,0,0,200,10,0][o.id%7]} : null);
  if(!e) return '';
  if(e.saldo<=0 || e.pedidos>e.saldo) return 'zero';
  if(e.saldo<e.minimo) return 'min';
  return '';
}
function colunaDe(o, seg){ const p=PLAN[o.id];
  if(p==='fila') return 'fila';
  if(p && p>=seg && p<=addDias(seg,4)) return p;
  if(p && !(p>=seg && p<=addDias(seg,4))) return null;                    // movida para outra semana
  const d = o.fin ? (o.conc||'') : o.ini;
  if(d>=seg && d<=addDias(seg,4)) return d;
  return o.fin ? null : 'fila'; }
function viewSemana(){
  if(!S.semana) S.semana=segunda(HOJE);
  const seg=S.semana, dias=DIAS.map((_,i)=>addDias(seg,i));
  const cols={fila:[]}; dias.forEach(d=>cols[d]=[]);
  OPS.forEach(o=>{ const c=colunaDe(o,seg); if(c==='fila'){ if(S.filaTudo || o.idade<=60 || PLAN[o.id]==='fila') cols.fila.push(o); } else if(c&&cols[c]) cols[c].push(o); });
  cols.fila.sort((a,b)=>a.ab<b.ab?1:-1);
  const filaTotal=OPS.filter(o=>colunaDe(o,seg)==='fila').length;
  const card=o=>{ const prox=o.ops.find(x=>x.s!=='X'); return `<div class="card-op ${corEstoque(o)}" draggable="true" data-id="${o.id}">
      <div class="t1"><span class="opn">OP ${esc(o.n)}</span><span class="st ${o.st}">${STL[o.st]}</span></div>
      <div class="desc2" title="${esc(o.d)}">${esc(o.d)}</div>
      <div class="row2"><b>${qtdTxt([o])}</b><span>${prox&&!o.fin?`<span class="etp ${prox.s}">${prox.c}</span>`:o.fin?'':''}${o.prev?`<span class="${!o.fin&&o.prev<HOJE?'red':'muted'}"> ${dBR(o.prev).slice(0,5)}</span>`:''}</span></div>
      ${o.fin?'':`<div class="acts no-print">${o.st==='A'?`<button class="btn btn-ghost btn-sm" onclick="setSt(${o.id},'P')">Iniciar</button>`:`<button class="btn btn-dark btn-sm" onclick="setSt(${o.id},'F')">Finalizar</button>`}</div>`}
    </div>`; };
  const colHtml=(key,titulo,sub,extra='')=>{ const l=cols[key]; return `<div class="col ${key==='fila'?'fila':''} ${key===HOJE?'today':''}" data-col="${key}"><h3>${titulo}<span class="sub2">${l.length} OPs</span></h3><div class="meta">${sub||qtdTxt(l)}</div>${extra}<div class="list">${l.map(card).join('')}</div></div>`; };
  return `
  <div class="wk-head no-print">
    <button class="icon-btn" onclick="S.semana=addDias(S.semana,-7);render()" title="Semana anterior">‹</button>
    <div class="ttl">${dBR(seg)} a ${dBR(dias[4])}</div>
    <button class="icon-btn" onclick="S.semana=addDias(S.semana,7);render()" title="Próxima semana">›</button>
    <button class="btn btn-ghost btn-sm" onclick="S.semana=segunda(HOJE);render()">Hoje</button>
    <label class="check"><input type="checkbox" ${S.filaTudo?'checked':''} onchange="S.filaTudo=this.checked;render()"> Fila completa (${nf(filaTotal)})</label>
    <label class="check" title="Só para visualizar o layout: atribui estoque fictício aos cards de produto acabado."><input type="checkbox" ${S.simular?'checked':''} onchange="S.simular=this.checked;render()"> Simular cores de estoque (demonstração)</label>
    <button class="btn btn-ghost btn-sm" onclick="if(confirm('Voltar todas as OPs para o dia/status originais?')){PLAN={};STO={};LS.set('prod_plan',PLAN);LS.set('prod_status',STO);location.reload();}">Restaurar</button>
  </div>
  <div class="legend" style="margin-bottom:14px"><span><i style="background:#fff"></i>Estoque de produto acabado normal</span><span><i style="background:#fff4c9;border-color:#f5e39a"></i>Abaixo do mínimo</span><span><i style="background:var(--red-soft);border-color:#eec8c2"></i>Zerado ou pedidos maiores que o saldo</span><span class="muted">Arraste os cards entre os dias. Bases/em processo não usam cor.</span></div>
  <div class="board">
    ${colHtml('fila','Fila','', '')}
    ${dias.map((d,i)=>colHtml(d,`${DIAS[i]} <span class="sub2">${dBR(d).slice(0,5)}</span>`)).join('')}
  </div>`;
}
function setSt(id,s){ STO[id]=s; LS.set('prod_status',STO); const o=OPS.find(x=>x.id===id); o.st=s; o.fin=s==='F'; render(); }
function bindDnD(){
  let drag=null;
  document.querySelectorAll('.card-op').forEach(c=>{ c.addEventListener('dragstart',e=>{ drag=c.dataset.id; c.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',drag); });
    c.addEventListener('dragend',()=>c.classList.remove('dragging')); });
  document.querySelectorAll('.col').forEach(col=>{
    col.addEventListener('dragover',e=>{ e.preventDefault(); col.classList.add('over'); });
    col.addEventListener('dragleave',()=>col.classList.remove('over'));
    col.addEventListener('drop',e=>{ e.preventDefault(); col.classList.remove('over'); const id=Number(e.dataTransfer.getData('text/plain')||drag); if(!id) return; PLAN[id]=col.dataset.col; LS.set('prod_plan',PLAN); render(); }); });
}
render();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="hub.js"></script>
<script>hubBoot('producao');</script>
</body>
