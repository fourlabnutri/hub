const diffDias = (a,b)=>Math.round((Date.parse(a)-Date.parse(b))/864e5);
const mesIni = (iso,off=0)=>{ const [y,m]=iso.split('-').map(Number); return new Date(Date.UTC(y,m-1+off,1)).toISOString().slice(0,10); };
const addMes = (iso,off)=>{ const [y,m,d]=iso.split('-').map(Number); const dt=new Date(Date.UTC(y,m-1+off,1)); const ult=new Date(Date.UTC(dt.getUTCFullYear(),dt.getUTCMonth()+1,0)).getUTCDate(); dt.setUTCDate(Math.min(d,ult)); return dt.toISOString().slice(0,10); };
const BRL = v => 'R$ ' + (Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const NUM = (v,d=0) => (Number(v)||0).toLocaleString('pt-BR',{maximumFractionDigits:d});
const PCT = (v,d=0) => (isFinite(v)?NUM(v,d):'0')+'%';
const dBR = iso => iso ? iso.slice(0,10).split('-').reverse().join('/') : '—';
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const soma = (a,f) => a.reduce((s,x)=>s+(Number(typeof f==='string'?x[f]:f(x))||0),0);
const dv = (a,b) => b ? a/b : null;
const NOME = {meta:'Meta Ads', google:'Google Ads', instagram_organico:'Instagram orgânico', shopper:'Shopper', outras_origens:'Outras origens', sem_origem:'Sem origem rastreada'};
const PAGOS = ['meta','google'];

const S = {preset:'u30', ini:'', fim:'', cmp:'anterior', cini:'', cfim:'', ordemAd:'pedidos', pagAd:15};
function periodo(){ const h=HOJE;
  switch(S.preset){ case 'hoje':return [h,h]; case 'ontem':return [addDias(h,-1),addDias(h,-1)]; case 'u7':return [addDias(h,-6),h]; case 'u30':return [addDias(h,-29),h];
    case 'mes':return [mesIni(h),h]; case 'mesant':return [mesIni(h,-1),addDias(mesIni(h),-1)]; case 'custom':return [S.ini||h,S.fim||h]; } }
function comparacao([a,b]){ const n=diffDias(b,a)+1;
  switch(S.cmp){ case 'anterior':return [addDias(a,-n),addDias(a,-1)]; case 'semana':return [addDias(a,-7),addDias(b,-7)]; case 'mes':return [addMes(a,-1),addMes(b,-1)];
    case 'custom':return (S.cini&&S.cfim)?[S.cini,S.cfim]:null; default:return null; } }
const dias = ([a,b]) => { const r=[]; for(let d=a; d<=b; d=addDias(d,1)) r.push(d); return r; };
const noP = ([a,b]) => r => r.dia>=a && r.dia<=b;
const delta = (cur,prev,inv) => { if(prev===null||prev===undefined||prev===0) return ''; const d=(cur-prev)/prev*100; const bom = inv ? d<0 : d>0; const c=Math.abs(d)<0.05?'flat':bom?'up':'down'; return `<span class="chip ${c}" title="período de comparação: ${esc(NUM(prev,2))}">${d>0?'▲':d<0?'▼':'■'} ${NUM(Math.abs(d),1)}%</span>`; };

function metr(rg){
  const c=CANAL.filter(noP(rg)), por={};
  c.forEach(r=>{ const x=por[r.canal]=por[r.canal]||{inv:0,imp:0,cl:0,cp:0,ped:0,rec:0}; x.inv+=r.investimento; x.imp+=r.impressoes; x.cl+=r.cliques; x.cp+=r.compras_plataforma; x.ped+=r.pedidos; x.rec+=r.receita; });
  const pagos=PAGOS.map(k=>por[k]||{inv:0,ped:0,rec:0,cl:0,cp:0});
  const inv=soma(pagos,'inv'), ped=soma(pagos,'ped'), rec=soma(pagos,'rec');
  const totPed=soma(Object.values(por),'ped'), semOrig=(por.sem_origem||{ped:0}).ped;
  return {por,inv,ped,rec,cpa:dv(inv,ped),roas:dv(rec,inv),totPed,cobertura:totPed?(totPed-semOrig)/totPed*100:0, c};
}
function colunas(rows, rot, alt){ const max=Math.max(1,...rows.map(r=>r.v));
  return `<div class="cols ${alt?'alt':''}">${rows.map(r=>`<div class="c" title="${esc(r.l)}: ${esc(rot(r.v))}"><div class="v">${r.v?NUM(r.v):''}</div><div class="b" style="height:${r.v/max*100}%"></div></div>`).join('')}</div><div class="cols-l">${rows.map(r=>`<span>${r.l.slice(8)}</span>`).join('')}</div>`; }
const sel = r => r>=3?['bom','Bom']:r>=1.5?['ok','Médio']:r>0?['ruim','Baixo']:['sem','—'];

// ---------- visual BI (mesmo padrão dos outros módulos) ----------
let VIEW='painel', ANA='canais';
const CH={serie:'inv', camp:'rec'};
const MES3B=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const kv = v => { const [i,c]=(Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}).split(','); return `<small>R$</small>${i}<span style="opacity:.45">,${c}</span>`; };
const kC = v => v>=1e6?'R$ '+(v/1e6).toFixed(1).replace('.',',')+' mi':v>=1e3?'R$ '+(v/1e3).toFixed(v>=1e4?0:1).replace('.',',')+' mil':'R$ '+Math.round(v||0);
const chipsB=(k,ops)=>`<div class="chips-f no-print">${ops.map(([id,l])=>`<button class="${CH[k]===id?'on':''}" onclick="CH.${k}='${id}';render()">${l}</button>`).join('')}</div>`;
function gaugeB(pct){ const N=22,on=Math.round(Math.min(100,pct)/100*N),cx=110,cy=104; let s='';
  for(let i=0;i<N;i++){ const a=Math.PI*(1-i/(N-1)),c=Math.cos(a),n=Math.sin(a); s+=`<line x1="${cx+c*76}" y1="${cy-n*76}" x2="${cx+c*96}" y2="${cy-n*96}" stroke="${i<on?'var(--orange)':'rgba(26,19,21,.09)'}" stroke-width="9" stroke-linecap="round"/>`; }
  return `<svg class="gauge" viewBox="0 0 220 112">${s}<text x="110" y="104" text-anchor="middle">${(pct||0).toFixed(0)}%</text></svg>`; }
// série diária: barras finas, a maior em laranja, rótulo do dia a cada poucos dias
function serieB(rows, fmt){ const max=Math.max(1,...rows.map(r=>r.v)), passo=Math.max(1,Math.ceil(rows.length/10));
  return `<div class="sd">${rows.map((r,i)=>`<div class="sdc ${r.v===max&&r.v>0?'top':''}" title="${dBR(r.l)}: ${esc(fmt(r.v))}"><i style="height:${Math.max(2,r.v/max*100)}%"></i><span>${i%passo===0?r.l.slice(8)+(i===0||r.l.slice(8)==='01'?'/'+MES3B[+r.l.slice(5,7)-1]:''):''}</span></div>`).join('')}</div>`; }
const rankB=(rows,fmt,tag)=>{ const max=Math.max(1,...rows.map(r=>r.v)); return `<div class="rank">${rows.map((r,i)=>`<div class="rk"><span class="ic2">${i+1}</span><div class="nmr"><b title="${esc(r.l)}">${esc(r.l)}</b><div class="tr2"><i style="width:${r.v/max*100}%"></i></div></div><div class="vr">${fmt(r)}${tag?tag(r):''}</div></div>`).join('')||'<div class="empty">Sem dados.</div>'}</div>`; };
function donutB(parts){ const tot=parts.reduce((s,p)=>s+p.v,0)||1,C=2*Math.PI*42; let off=0;
  const arcs=parts.map(p=>{ const len=p.v/tot*C,d=`<circle cx="60" cy="60" r="42" fill="none" stroke="${p.c}" stroke-width="16" stroke-dasharray="${Math.max(0,len-3)} ${C}" stroke-dashoffset="${-off}" stroke-linecap="round" transform="rotate(-90 60 60)"/>`; off+=len; return d; }).join('');
  return `<div class="donut"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="42" fill="none" stroke="rgba(26,19,21,.06)" stroke-width="16"/>${arcs}</svg><div class="dl">${parts.map(p=>`<div><i style="background:${p.c}"></i><span>${esc(p.l)}</span><b>${p.fmt||p.v}</b><small>${Math.round(p.v/tot*100)}%</small></div>`).join('')}</div></div>`; }
const roasTag = r => { const x=r.inv?r.rec/r.inv:0; return `<span class="rt ${x>=3?'g':x>=1.5?'y':x>0?'r':''}">${x?NUM(x,1)+'x':'—'}</span>`; };
const viewSw = () => `<div class="vw no-print"><button class="${VIEW==='painel'?'on':''}" onclick="VIEW='painel';render()">Painel</button><button class="${VIEW==='analitico'?'on':''}" onclick="VIEW='analitico';render()">Analítico</button></div>`;

function render(){
  const per=periodo(), cmpR=comparacao(per), M=metr(per), C=cmpR?metr(cmpR):null;
  const pill=(id,l)=>`<button class="fpill ${S.preset===id?'active':''}" onclick="S.preset='${id}';if('${id}'==='custom'&&!S.ini){S.ini=addDias(HOJE,-13);S.fim=HOJE;}render()">${l}</button>`;
  const adsP=ADS.filter(noP(per));
  // campanhas Meta
  const camp={}; adsP.forEach(r=>{ const x=camp[r.campanha_id]=camp[r.campanha_id]||{nome:r.campanha,inv:0,cl:0,cp:0,ped:0,rec:0}; x.inv+=r.investimento; x.cl+=r.cliques_link; x.cp+=r.compras_meta; x.ped+=r.pedidos; x.rec+=r.receita; });
  const campRows=Object.values(camp).filter(x=>x.inv>0||x.ped>0).sort((a,b)=>b.inv-a.inv);
  // criativos (anúncios)
  const ad={}; adsP.forEach(r=>{ const k=(r.ad_id||r.anuncio)+'|'+r.campanha_id; const x=ad[k]=ad[k]||{anuncio:r.anuncio,campanha:r.campanha,ad:r.ad_id,conta:r.conta_id,camp:r.campanha_id,conj:r.conjunto_id,inv:0,cl:0,cp:0,ped:0,rec:0}; x.inv+=r.investimento; x.cl+=r.cliques_link; x.cp+=r.compras_meta; x.ped+=r.pedidos; x.rec+=r.receita; });
  const adRows=Object.values(ad).filter(x=>x.inv>0||x.ped>0);
  const ord={pedidos:(a,b)=>b.ped-a.ped||b.inv-a.inv, investimento:(a,b)=>b.inv-a.inv, retorno:(a,b)=>(dv(b.rec,b.inv)||0)-(dv(a.rec,a.inv)||0), cpa:(a,b)=>(a.ped?a.inv/a.ped:1e9)-(b.ped?b.inv/b.ped:1e9)};
  adRows.sort(ord[S.ordemAd]);
  const semPedido=adRows.filter(x=>x.inv>=30&&x.ped===0).sort((a,b)=>b.inv-a.inv).slice(0,5);
  // anúncios ativos, de campanhas que gastaram no período, que não tiveram nenhuma entrega
  const campGasto=new Set(adsP.filter(r=>r.investimento>0).map(r=>r.campanha_id)), comLinha=new Set(adsP.map(r=>r.ad_id));
  const semEntrega=CAT.filter(c=>campGasto.has(c.campanha_id)&&!comLinha.has(c.ad_id)).slice(0,8);
  const linkAd = a => a.ad ? 'https://adsmanager.facebook.com/adsmanager/manage/ads?act='+(a.conta||'')+(a.camp?'&selected_campaign_ids='+a.camp:'')+(a.conj?'&selected_adset_ids='+a.conj:'')+'&selected_ad_ids='+a.ad : '';
  const OLHO='<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  const celula = a => '<div class="adcell">'+(linkAd(a)?'<a class="crv no-print" href="'+esc(linkAd(a))+'" target="_blank" rel="noopener" title="Ver o criativo no Meta">'+OLHO+'</a>':'')+'<div><b>'+esc(a.anuncio)+'</b><div class="sub2">'+esc(a.campanha)+'</div></div></div>';
  // séries diárias dos canais pagos
  const ds=dias(per), serieInv=ds.map(d=>({l:d,v:soma(M.c.filter(r=>r.dia===d&&PAGOS.includes(r.canal)),'investimento')})), seriePed=ds.map(d=>({l:d,v:soma(M.c.filter(r=>r.dia===d&&PAGOS.includes(r.canal)),'pedidos')}));
  const canais=Object.keys(NOME).filter(k=>M.por[k]);
  const th = (k,l) => `<th class="num"><a href="#" class="lnk" onclick="S.ordemAd='${k}';render();return false" style="${S.ordemAd===k?'text-decoration:underline':'font-weight:600;color:inherit'}">${l}</a></th>`;

  const PER=[['hoje','Hoje'],['ontem','Ontem'],['u7','Últimos 7 dias'],['u30','Últimos 30 dias'],['mes','Este mês'],['mesant','Mês passado'],['custom','Personalizado…']];
  const CMP=[['nenhum','Sem comparação'],['anterior','vs período anterior'],['semana','vs semana anterior'],['mes','vs mês anterior'],['custom','vs personalizado…']];
  const dChip=(cur,prev,inv)=>delta(cur,prev,inv);
  const serieRec=ds.map(d=>({l:d,v:soma(M.c.filter(r=>r.dia===d&&PAGOS.includes(r.canal)),'receita')}));
  const SER={inv:[serieInv,v=>BRL(v)],ped:[seriePed,v=>NUM(v)+' pedidos'],rec:[serieRec,v=>BRL(v)]}[CH.serie];
  const canalRows=canais.filter(k=>M.por[k].inv||M.por[k].ped).map(k=>({l:NOME[k],v:M.por[k].rec,inv:M.por[k].inv,rec:M.por[k].rec,ped:M.por[k].ped})).sort((a,b)=>b.v-a.v);
  const campTop=campRows.map(x=>({l:x.nome,v:CH.camp==='rec'?x.rec:x.inv?x.rec/x.inv:0,inv:x.inv,rec:x.rec,ped:x.ped})).sort((a,b)=>b.v-a.v).slice(0,6);
  const adTop=adRows.slice().sort((a,b)=>b.ped-a.ped||b.rec-a.rec).slice(0,6).map(x=>({l:x.anuncio,v:x.ped,inv:x.inv,rec:x.rec,ped:x.ped}));
  const pagos=PAGOS.map(k=>({k,v:(M.por[k]||{inv:0}).inv}));
  const tk=M.ped?M.rec/M.ped:0, tkC=C&&C.ped?C.rec/C.ped:null;
  const cl=soma(PAGOS.map(k=>M.por[k]||{cl:0}),'cl');

  const toolbar=`<div class="toolbar glass no-print">
    <div class="sel"><select onchange="S.preset=this.value;if(this.value==='custom'&&!S.ini){S.ini=addDias(HOJE,-13);S.fim=HOJE;}render()">${PER.map(([id,l])=>`<option value="${id}" ${S.preset===id?'selected':''}>${l}</option>`).join('')}</select></div>
    ${S.preset==='custom'?`<div class="dates"><input type="date" value="${S.ini}" onchange="S.ini=this.value;render()"><span class="muted">até</span><input type="date" value="${S.fim}" onchange="S.fim=this.value;render()"></div>`:''}
    <div class="sel"><select onchange="S.cmp=this.value;if(this.value==='custom'&&!S.cini){S.cini=addDias(periodo()[0],-14);S.cfim=addDias(periodo()[0],-1);}render()">${CMP.map(([id,l])=>`<option value="${id}" ${S.cmp===id?'selected':''}>${l}</option>`).join('')}</select></div>
    ${S.cmp==='custom'?`<div class="dates"><input type="date" value="${S.cini}" onchange="S.cini=this.value;render()"><span class="muted">até</span><input type="date" value="${S.cfim}" onchange="S.cfim=this.value;render()"></div>`:''}
    <span class="pill-dt" style="margin-left:auto">${dBR(per[0])} – ${dBR(per[1])}</span></div>`;

  const painel=`
  <div class="hero">
    <div class="k glass"><div class="lbl">Investimento ${dChip(M.inv,C&&C.inv)}</div><div class="val">${kv(M.inv)}</div></div>
    <div class="k hot"><div class="lbl">Receita atribuída ${dChip(M.rec,C&&C.rec)}</div><div class="val">${kv(M.rec)}</div></div>
    <div class="k glass"><div class="lbl">ROAS ${dChip(M.roas||0,C&&C.roas)}</div><div class="val">${M.roas!=null?NUM(M.roas,2)+'<small style="font-size:.5em;opacity:.55">x</small>':'—'}</div></div>
    <div class="k glass gcard"><div class="lbl">Pedidos com UTM</div>${gaugeB(M.cobertura)}</div>
  </div>
  <div class="mini">
    <div class="glass m1"><span>Pedidos atribuídos ${dChip(M.ped,C&&C.ped)}</span><b>${NUM(M.ped)}</b></div>
    <div class="glass m1"><span>Custo por pedido ${dChip(M.cpa||0,C&&C.cpa,true)}</span><b>${M.cpa!=null?kC(M.cpa):'—'}</b></div>
    <div class="glass m1"><span>Ticket médio ${dChip(tk,tkC)}</span><b>${tk?kC(tk):'—'}</b></div>
    <div class="glass m1"><span>Cliques</span><b>${NUM(cl)}</b></div>
  </div>
  <div class="g-main">
    <div class="box glass"><div class="bh"><h2>Por dia</h2>${chipsB('serie',[['inv','Investimento'],['ped','Pedidos'],['rec','Receita']])}</div>${serieB(SER[0],SER[1])}</div>
    <div class="box glass ana"><div class="bh"><h2>Por canal</h2><button class="btn-glass" onclick="VIEW='analitico';ANA='canais';render();scrollTo(0,0)">Analítico →</button></div>
      ${rankB(canalRows,r=>kC(r.rec),r=>r.inv?' '+roasTag(r):'')}</div>
  </div>
  <div class="g-tri">
    <div class="box glass"><div class="bh"><h2>Campanhas do Meta</h2>${chipsB('camp',[['rec','Receita'],['roas','ROAS']])}</div>${rankB(campTop,r=>CH.camp==='rec'?kC(r.rec):NUM(r.v,1)+'x')}</div>
    <div class="box glass"><div class="bh"><h2>Criativos que vendem</h2></div>${rankB(adTop,r=>NUM(r.ped)+' ped.')}</div>
    <div class="box glass"><div class="bh"><h2>Verba por plataforma</h2></div>${donutB([{l:'Meta Ads',v:pagos[0].v,c:'var(--orange)',fmt:kC(pagos[0].v)},{l:'Google Ads',v:pagos[1].v,c:'var(--purple)',fmt:kC(pagos[1].v)}])}
      ${semPedido.length?`<div class="alerta"><b>Sem pedido</b>${semPedido.map(a=>`<span>${esc(a.anuncio)} · ${kC(a.inv)}</span>`).join('')}</div>`:''}</div>
  </div>`;

  const tbCanais=`<table class="tb"><thead><tr><th>Canal</th><th class="num">Investimento</th><th class="num">Cliques</th><th class="num">Compras (plataforma)</th><th class="num">Pedidos (Yampi)</th><th class="num">Receita</th><th class="num">CPA</th><th class="num">ROAS</th></tr></thead><tbody>
    ${canais.map(k=>{ const x=M.por[k]; return `<tr><td><b>${NOME[k]}</b></td><td class="num">${x.inv?BRL(x.inv):'—'}</td><td class="num">${x.cl?NUM(x.cl):'—'}</td><td class="num">${x.cp?NUM(x.cp):'—'}</td><td class="num"><b>${NUM(x.ped)}</b></td><td class="num">${BRL(x.rec)}</td><td class="num">${x.inv&&x.ped?BRL(x.inv/x.ped):'—'}</td><td class="num">${x.inv?roasTag(x):'—'}</td></tr>`; }).join('')}</tbody></table>`;
  const tbCamp=`<table class="tb"><thead><tr><th>Campanha</th><th class="num">Investimento</th><th class="num">Cliques</th><th class="num">Compras (Meta)</th><th class="num">Pedidos (Yampi)</th><th class="num">Receita</th><th class="num">CPA</th><th class="num">ROAS</th></tr></thead><tbody>
    ${campRows.map(x=>`<tr><td><b>${esc(x.nome)}</b></td><td class="num">${BRL(x.inv)}</td><td class="num">${NUM(x.cl)}</td><td class="num">${NUM(x.cp)}</td><td class="num"><b>${NUM(x.ped)}</b></td><td class="num">${BRL(x.rec)}</td><td class="num">${x.ped?BRL(x.inv/x.ped):'—'}</td><td class="num">${roasTag(x)}</td></tr>`).join('')||'<tr><td colspan="8"><div class="empty">Sem campanhas no período.</div></td></tr>'}</tbody></table>`;
  const tbAds=`<table class="tb"><thead><tr><th>Criativo / campanha</th>${th('investimento','Investimento')}<th class="num">Cliques</th><th class="num">Compras (Meta)</th>${th('pedidos','Pedidos (Yampi)')}<th class="num">Receita</th>${th('cpa','CPA')}${th('retorno','ROAS')}</tr></thead><tbody>
    ${adRows.slice(0,S.pagAd).map(x=>`<tr><td>${celula(x)}</td><td class="num">${BRL(x.inv)}</td><td class="num">${NUM(x.cl)}</td><td class="num">${NUM(x.cp)}</td><td class="num"><b>${NUM(x.ped)}</b></td><td class="num">${BRL(x.rec)}</td><td class="num">${x.ped?BRL(x.inv/x.ped):'—'}</td><td class="num">${roasTag(x)}</td></tr>`).join('')||'<tr><td colspan="8"><div class="empty">Sem criativos no período.</div></td></tr>'}</tbody></table>
    ${adRows.length>S.pagAd?`<div class="rodape"><span class="note">Mostrando ${S.pagAd} de ${adRows.length}</span><button class="btn-glass no-print" onclick="S.pagAd+=20;render()">Ver mais</button></div>`:''}`;
  const analitico=`<div class="clientes glass"><div class="c-head"><div class="tabs2">${[['canais','Canais',canais.length],['camp','Campanhas',campRows.length],['ads','Criativos',adRows.length]].map(([id,l,n])=>`<button class="${ANA===id?'on':''}" onclick="ANA='${id}';render()">${l} <span class="cnt">${n}</span></button>`).join('')}</div></div>
    <div class="tb-wrap">${ANA==='canais'?tbCanais:ANA==='camp'?tbCamp:tbAds}</div></div>`;

  document.getElementById('main').innerHTML = `
  <div class="r-head"><div class="tt"><h1>Canais e UTM</h1>${viewSw()}</div><button class="btn-glass no-print" onclick="window.print()">Imprimir / PDF</button></div>
  ${toolbar}
  ${VIEW==='painel'?painel:analitico}`;
}

render();
